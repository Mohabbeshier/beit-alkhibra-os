function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function timeStr(iso){ return iso?new Date(iso).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):""; }
async function paintAttendance(){
  const box=$("attWidget"); if(!box) return;

        const { error }=await sb.from("os_attendance").upsert({ user_id:ME.id, user_name:PROFILE.name, dept:PROFILE.dept||null, work_date:todayStr(), check_in:new Date().toISOString() },{onConflict:"user_id,work_date"});

async function openAttendanceLog(){
  const isReception=PROFILE.dept==="reception";
  if(!["owner","ops","manager"].includes(PROFILE.role)&&!isReception){ toast("الشاشة دي للإدارة بس","bad"); return; }
  openSheet('<h3>سجل الحضور — النهاردة</h3><div id="attLogBox"><div class="skel"></div><div class="skel"></div></div><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  try{
    const wide=isOwnerOps()||isReception;
    const scope=wide?PROFILES:PROFILES.filter(p=>p.dept===PROFILE.dept);
    const { data }=await sb.from("os_attendance").select("*").eq("work_date",todayStr());
    const byUser={}; (data||[]).forEach(r=>byUser[r.user_id]=r);
    const inNow=[], leftNow=[], notYet=[];
    scope.forEach(p=>{
      const r=byUser[p.id];
      if(!r) notYet.push({p});
      else if(!r.check_out) inNow.push({p,r});
      else leftNow.push({p,r});
    });
    const card=(o,st)=>'<div class="card flat"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(o.p.name)+'</b>'+st+'</div>'
      +(wide?'<div class="muted" style="font-size:11px;margin-top:2px">'+esc((DEPT_BY_KEY[o.p.dept]&&DEPT_BY_KEY[o.p.dept].name)||o.p.dept||"—")+'</div>':'')+'</div>';
    let h='<div class="card flat" style="background:linear-gradient(135deg,#E8F5E9,#E3F2FD);border:none;margin-bottom:10px"><div style="display:flex;gap:14px;text-align:center">'
      +'<div style="flex:1"><b style="font-size:19px;color:var(--green-d)">'+inNow.length+'</b><div class="muted" style="font-size:11px">موجود دلوقتي</div></div>'
      +'<div style="flex:1"><b style="font-size:19px;color:var(--blue)">'+leftNow.length+'</b><div class="muted" style="font-size:11px">انصرف</div></div>'
      +'<div style="flex:1"><b style="font-size:19px;color:var(--muted)">'+notYet.length+'</b><div class="muted" style="font-size:11px">لسه</div></div>'
      +'</div></div>';
    if(inNow.length) h+='<div class="sec-h" style="color:var(--green-d)">موجودين دلوقتي <span class="ln"></span></div>'+inNow.map(o=>card(o,'<span class="badge b-green">من '+timeStr(o.r.check_in)+'</span>')).join("");
    if(leftNow.length) h+='<div class="sec-h">انصرفوا <span class="ln"></span></div>'+leftNow.map(o=>card(o,'<span class="badge '+(o.r.auto_closed?'b-grey':'b-blue')+'">'+timeStr(o.r.check_out)+(o.r.auto_closed?' (تلقائي)':'')+'</span>')).join("");
    if(notYet.length) h+='<div class="sec-h">لسه ما سجّلوش <span class="ln"></span></div>'+notYet.map(o=>card(o,'<span class="badge b-grey">لسه</span>')).join("");
    $("attLogBox").innerHTML=h||'<div class="empty">مفيش موظفين.</div>';
  }catch(e){ $("attLogBox").innerHTML=failBox("معرفناش نجيب السجل.",openAttendanceLog); }
}

async function paintVisitorsToday(){
  const box=$("viBox"); if(!box) return;
  try{
    const start=new Date(); start.setHours(0,0,0,0);
    /* زوار النهاردة + أي زائر لسه مفتوح من أيام فاتت (عشان ميفضلش معلّق للأبد) */
    const [todayRes, openRes]=await Promise.all([
      sb.from("os_visitors").select("*").gte("checked_in_at",start.toISOString()).order("checked_in_at",{ascending:false}).limit(30),
      sb.from("os_visitors").select("*").is("checked_out_at",null).lt("checked_in_at",start.toISOString()).order("checked_in_at",{ascending:false}).limit(20)
    ]);
    const rows=todayRes.data||[], stale=openRes.data||[];
    if(!rows.length&&!stale.length){ box.innerHTML='<div class="empty">مفيش زوار لسه النهاردة.</div>'; return; }
    const card=(v,isStale)=>{
      const out=v.checked_out_at?'<span class="badge b-blue">خرج '+timeStr(v.checked_out_at)+'</span>':'<button class="btn ghost sm" data-viout="'+v.id+'">سجّل خروج</button>';
      const dayLbl=isStale?fmtDate(v.checked_in_at)+" · ":"";
      return '<div class="card flat"'+(isStale?' style="border-right:4px solid #F59E0B"':'')+'><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(v.visitor_name)+'</b>'+out+'</div>'
        +'<div class="muted" style="font-size:11.5px;margin-top:2px">'+(v.host_name?"جاي يقابل: "+esc(v.host_name)+" · ":"")+dayLbl+"دخل "+timeStr(v.checked_in_at)+(v.purpose?" · "+esc(v.purpose):"")+'</div></div>';
    };
    let h="";
    if(stale.length) h+='<div class="sec-h" style="color:#B45309">لسه مفتوحين من أيام فاتت ('+stale.length+') <span class="ln"></span></div>'+stale.map(v=>card(v,true)).join("");
    if(rows.length) h+=(stale.length?'<div class="sec-h">النهاردة <span class="ln"></span></div>':"")+rows.map(v=>card(v,false)).join("");
    else if(stale.length) h+='<div class="empty">مفيش زوار لسه النهاردة.</div>';
    box.innerHTML=h;
    box.querySelectorAll("[data-viout]").forEach(b=>b.onclick=async()=>{
      b.disabled=true; b.textContent="…";
      const { error }=await sb.from("os_visitors").update({ checked_out_at:new Date().toISOString() }).eq("id",b.dataset.viout);
      if(error){ toast("معرفناش نسجّل الخروج","bad"); b.disabled=false; b.textContent="سجّل خروج"; return; }
      paintVisitorsToday();
    });
    if(box._listSearchApply) box._listSearchApply();
  }catch(e){ box.innerHTML=failBox("معرفناش نجيب سجل الزوار.",paintVisitorsToday); }
}

function myTasksSection(d){
  const _now=Date.now();
  const mine=(d.openTasks||[]).filter(t=>t.assignee_id===ME.id).slice().sort((a,b)=>{
    const ad=a.deadline?new Date(a.deadline).getTime():Infinity, bd=b.deadline?new Date(b.deadline).getTime():Infinity;
    const ao=ad<_now?0:1, bo=bd<_now?0:1;
    if(ao!==bo) return ao-bo;
    if(ad!==bd) return ad-bd;
    return (b.priority==="high"?1:0)-(a.priority==="high"?1:0);

  if(!mine.length) return "";
  const late=mine.filter(t=>t.deadline&&new Date(t.deadline)<new Date()).length;

/* ===== محرك رفع ملفات الموظفين + الأرشيف ===== */
const FILE_CATS=[["general","عام"],["contract","عقد"],["license","رخصة"],["drawing","رسمة هندسية"],["invoice","فاتورة"],["report","تقرير"],["photo","صورة موقع"],["other","حاجة تانية"]];
const FILE_MAX=20*1048576;
const FILE_OK=["pdf","jpg","jpeg","png","webp","doc","docx","xls","xlsx"];
async function uploadEmployeeFile(file, onProg){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();
  if(!FILE_OK.includes(ext)) throw new Error("نوع الملف مش مسموح (PDF/صورة/Word/Excel بس)");
  if(file.size>FILE_MAX) throw new Error("الملف أكبر من 20 ميجا");
  const path=ME.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  // رفع مباشر بصلاحية الموظف المسجّل (RLS authenticated)
  const { error }=await sb.storage.from("client-files").upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw new Error(error.message||"فشل الرفع");
  // لينك موقّع 10 سنين للعرض الداخلي
  const { data:signed }=await sb.storage.from("client-files").createSignedUrl(path, 315360000);
  return { url:(signed&&signed.signedUrl)||"", path, size:file.size, mime:file.type||null };
}

  if(error) throw new Error(error.message);
  track("action","file_"+(rec.kind||"file"));
}

        +'<div class="stat"><div class="n">'+(health.locked_docs||0)+'</div><div class="l">مستند مقفول</div></div>'
        +'<div class="stat'+((health.expiring_docs||0)?' stat-hot':'')+'"><div class="n">'+(health.expiring_docs||0)+'</div><div class="l">بينتهي قريب</div></div>'
        +'<div class="stat'+((health.orphans||0)?' stat-hot':'')+'"><div class="n">'+(health.orphans||0)+'</div><div class="l">ملف يتيم</div></div></div>';
    }

    /* 3) تفصيل كل bucket */
    if(ov&&ov.length){
      h+='<div class="sec-h">المخازن <span class="ln"></span></div>';
      const names={"client-files":"ملفات العملاء","os-documents":"المستندات الرسمية"};
      h+='<div class="card flat">'+ov.map(b=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f0f3f7"><b>'+esc(names[b.bucket_id]||b.bucket_id)+'</b><span class="muted">'+b.files+' ملف \u00b7 '+fmtBytes(b.bytes)+'</span></div>').join("")+'</div>';
    }

    /* 4) أكبر الملفات (للتنظيف اليدوي) */
    if(largest&&largest.length){
      h+='<div class="sec-h">أكبر الملفات <span class="ln"></span></div><div class="card flat">'
        +largest.map(f=>'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><b style="margin-right:8px">'+fmtBytes(f.bytes)+'</b></div>').join("")+'</div>';
    }

    /* 5) الملفات اليتيمة + زرار تنظيف */
    if(health&&(health.orphans||0)>0){
      h+='<div class="card" style="border-color:#FDE68A;background:#FFFDF4;margin-top:10px"><b>'+health.orphans+' ملف يتيم</b><div class="muted" style="font-size:11.5px;margin-top:3px">ملفات مرفوعة من أكتر من أسبوع ومش مربوطة بأي عميل أو مستند. ممكن تكون رفعات ناقصة.</div>'
        +'<button class="btn ghost sm" id="stcOrphans" style="margin-top:8px">شوف الملفات اليتيمة</button></div>';
    }

    /* 5.5) ملفات الموظفين حسب القسم */
    if(byDept&&byDept.length){
      const valid=byDept.filter(d=>d.dept);
      if(valid.length){
        h+='<div class="sec-h">ملفات الفرق <span class="ln"></span></div><div class="card flat">'
          +valid.map(d=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f0f3f7"><b>'+esc((DEPT_BY_KEY[d.dept]&&DEPT_BY_KEY[d.dept].name)||d.dept)+'</b><span class="muted">'+d.active+' نشط \u00b7 '+d.archived+' مؤرشف \u00b7 '+fmtBytes(d.bytes)+'</span></div>').join("")+'</div>';
      }
    }
    /* 6) إعدادات الاحتفاظ (retention) */
    if(ret){
      h+='<div class="sec-h">مدة الاحتفاظ بالبيانات <span class="ln"></span></div>'
        +'<div class="card flat"><div style="font-size:11.5px;line-height:2">'
        +'\u2022 الإشعارات المقروءة: <b>'+ret.notifications_days+' يوم</b><br>'
        +'\u2022 سجل النشاط: <b>'+ret.activity_days+' يوم</b><br>'
        +'\u2022 تحليلات الاستخدام: <b>'+ret.ui_events_days+' يوم</b><br>'
        +'\u2022 الأرشيف: <b>'+ret.archive_days+' يوم</b></div>'
        +'<div class="muted" style="font-size:10.5px;margin-top:6px">التنظيف بيشتغل أوتوماتيك كل ليلة 1:30 ص</div></div>';
    }

    $("stcBox").innerHTML=h;
    const orb=$("stcOrphans"); if(orb) orb.onclick=()=>openOrphans();
  }catch(e){ $("stcBox").innerHTML=failBox("معرفناش نجيب بيانات التخزين.",paintStorageCenter); }

async function openUsageInsights(){
  openSheet('<h3>تحليلات الاستخدام</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">آخر 7 أيام — مين بيستخدم إيه وفين الناس بتقف</div>'
    +'<div id="uiW"><div class="skel"></div><div class="skel"></div></div>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  try{
    const [insR,actR,errR]=await Promise.all([
      sb.from("os_usage_insights").select("*"),
      sb.from("os_user_activity_week").select("*"),
      sb.from("os_ui_events").select("user_name,name,at").eq("kind","error").order("at",{ascending:false}).limit(10)
    ]);
    const ins=insR.data||[], act=actR.data||[], errs=errR.data||[];
    let h="";

    /* أنشط الأعضاء + استنتاج مين محتاج مساعدة */
    h+='<div class="sec-h">نشاط الفريق <span class="ln"></span></div>';
    if(act.length){
      const sorted=act.slice().sort((a,b)=>(b.actions+b.screens)-(a.actions+a.screens));
      h+='<div class="card flat">'+sorted.map(u=>{
        const stuck=(u.errors>=3)||(u.screens>=10&&u.actions===0);
        return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px"><b style="flex:1">'+esc(firstName(u.user_name||"عضو"))+(stuck?' <span class="badge b-red">محتاج مساعدة؟</span>':'')+'</b>'
          +'<span class="muted" style="font-size:11px">'+u.actions+' فعل \u00b7 '+u.screens+' شاشة'+(u.voice_uses?' \u00b7'+u.voice_uses:'')+(u.errors?' \u00b7'+u.errors:'')+'</span></div>';
      }).join("")+'</div>';
      const ghosts=PROFILES.filter(p=>p.id!==ME.id&&!act.find(a=>a.user_id===p.id));
      if(ghosts.length) h+='<div class="card" style="border-color:#FDE68A;background:#FFFDF4;font-size:12px;margin-top:6px"><b>مدخلوش المنظومة الأسبوع ده:</b> '+ghosts.map(p=>esc(firstName(p.name))).join("، ")+'</div>';
    } else h+='<div class="empty">لسه مفيش بيانات — هتتجمع تلقائيًا مع الاستخدام.</div>';

    /* أكتر الشاشات */
    const scr=ins.filter(i=>i.kind==="screen").sort((a,b)=>b.hits-a.hits).slice(0,6);
    if(scr.length){
      const mx=scr[0].hits||1;
      h+='<div class="sec-h">أكتر الشاشات استخدامًا <span class="ln"></span></div><div class="card flat">'
        +scr.map(x=>'<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>'+esc(x.name)+'</b><span class="muted">'+x.hits+' \u00b7 '+x.users+' عضو</span></div><div class="prog" style="height:6px;margin-top:3px"><i style="width:'+Math.round(x.hits/mx*100)+'%"></i></div></div>').join("")+'</div>';
    }

    /* أكتر الأفعال */
    const acts=ins.filter(i=>i.kind==="action").sort((a,b)=>b.hits-a.hits).slice(0,5);
    if(acts.length) h+='<div class="sec-h">أكتر الأفعال <span class="ln"></span></div><div class="card flat">'+acts.map(x=>'<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><b>'+esc(x.name)+'</b><span class="muted">'+x.hits+'</span></div>').join("")+'</div>';

    /* الأخطاء الأخيرة = فين الناس بتقف */
    if(errs.length){
      h+='<div class="sec-h">آخر الأخطاء اللي قابلت الناس <span class="ln"></span></div><div class="card flat">'
        +errs.map(e2=>'<div style="font-size:11.5px;padding:3px 0"><b>'+esc(firstName(e2.user_name||""))+':</b> '+esc(e2.name)+' <span class="muted">\u00b7 '+timeAgo(e2.at)+'</span></div>').join("")+'</div>';
    }
    $("uiW").innerHTML=h;
  }catch(e){ $("uiW").innerHTML=failBox("معرفناش نجيب التحليلات.",openUsageInsights); }
}

      +'<div class="row-actions"><button class="btn green" id="pjGo">افتح بيان الأعمال</button></div>':"")
    +'<button class="btn sm" style="margin-top:10px" onclick="openFind()">\ud83d\udd0d بحث في الملفات والقطع</button>'

    function wireNew(selId, inpId, after){

          sv.insertBefore(o, sv.lastElementChild); });

      const _ar=$("pjArea")?$("pjArea").value:"";
      const _pn=$("pjParcel")?$("pjParcel").value.trim():"";

      if(!_sv){ toast("اختار نوع الملف","bad"); return; }

          svcCode=sv.code;
        }
      }catch(e){ toast("حصل خطأ في الإضافة","bad"); go.disabled=false; return; }
      hint("");
      /* ربط بالعميل — بيتعاد استخدامه لو الرقم موجود */
      let clientId=null;
      try{
        const cn=$("pjCli")?$("pjCli").value.trim():"";
        let cp=$("pjPhone")?$("pjPhone").value.trim():"";
        /* توحيد الرقم زي ما الداتابيز بتعمل — عشان ما نعملش عميل مكرر */
        if(cp){
          let d=cp.replace(/[^0-9]/g,"");
          if(d.startsWith("0020")) d="0"+d.slice(4);
          else if(d.startsWith("20")&&d.length===12) d="0"+d.slice(2);
          else if(d.startsWith("1")&&d.length===10) d="0"+d;
          cp=d;
        }
        if(cn&&cp){
          /* limit(1) بدل maybeSingle: مبيقعش لو فيه أكتر من صف */
          const { data:fc }=await sb.from("clients").select("id").eq("phone",cp).limit(1);
          if(fc&&fc.length){ clientId=fc[0].id; }
          else{
            const ins=await sb.from("clients").insert({ name:cn, phone:cp, code:"C-"+Date.now().toString().slice(-8), source:"jobfile" }).select("id").single();
            if(ins.data) clientId=ins.data.id;
            else{
              /* حد تاني سجّل نفس الرقم في نفس اللحظة — هاته */
              const { data:again }=await sb.from("clients").select("id").eq("phone",cp).limit(1);
              if(again&&again.length) clientId=again[0].id;
            }
          }
        }
      }catch(e){}
      /* ربط بقطعة أرض — بتتعمل لو مش موجودة */
      let parcelId=null;
      try{
        const pno=$("pjParcel")?$("pjParcel").value.trim():"";
        const landCode=$("pjLand")?$("pjLand").value.trim():"";
        if(areaId&&pno){
          const { data:found }=await sb.from("os_parcels").select("id").eq("area_id",areaId).eq("parcel_no",pno).limit(1);
          if(found&&found.length){ parcelId=found[0].id; }
          else{
            const mk=await sb.from("os_parcels").insert({ area_id:areaId, authority_id:authId, parcel_no:pno, land_code:landCode||null, client_id:clientId }).select("id").single();
            if(mk.data) parcelId=mk.data.id;
            else{
              const { data:again }=await sb.from("os_parcels").select("id").eq("area_id",areaId).eq("parcel_no",pno).limit(1);
              if(again&&again.length) parcelId=again[0].id;
            }
          }
        }
      }catch(e){}
      const { error }=await sb.from("os_projects").insert({ name, dept:$("pjDept").value, stage:"جديد", value_egp:v, created_by:ME.id, client_id:clientId, parcel_id:parcelId, service_code:svcCode||null, opened_on:todayStr() });
      go.disabled=false;
      if(error){
        const m=error.message||"";
        toast(
          m.includes('row-level')  ? 'صلاحيتك ما تسمحش بفتح ملف' :
          /duplicate|unique/i.test(m) ? 'الملف ده متسجل بالفعل — دوّر عليه في القايمة' :
          /Failed to fetch|NetworkError/i.test(m) ? 'النت فصل — الملف ما اتحفظش، جرّب تاني' :
          "معرفناش نضيف: "+m, "bad");
        return; }
      toast("بيان الأعمال اتفتح \u2713","ok");
      try{ await paintProjects(); }catch(e){}
      ["pjName","pjParcel","pjCli","pjPhone","pjLand","pjVal","pjAuthNew","pjAreaNew","pjSvcNew"].forEach(i=>{ if($(i)) $(i).value=""; });
      openProjects();
    };
  }
  await paintProjects();
  attachListSearch("prjSearch","prjBox","دوّر باسم المشروع أو الكود…");
}

function filterProjects(q){
  const rows=window._PRJ_ROWS||[];
  q=(q||"").trim().toLowerCase();
  const F=q?rows.filter(x=>((x.job_code||"")+" "+(x.name||"")+" "+(x.client_name||"")+" "
    +(x.parcel_no||"")+" "+(x.area||"")+" "+(x.client_phone||"")).toLowerCase().includes(q)):rows;

  paintProjectsList(F);
}

          :x.status==="done"?'<span style="width:22px;height:22px;border-radius:50%;background:#2E7D32;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none">\u2713</span>'

    if(!tsk.length){ h+='<div class="empty">مفيش معالم أو مهام مرتبطة بالمشروع لسه.</div>'; }
    else { h+=tsk.map(t=>{
      const isOverdue=t.deadline&&t.status!=="done"&&new Date(t.deadline)<new Date();
      return '<div class="card flat"'+(isOverdue?' style="border-right:4px solid var(--red)"':'')+'><div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:13px">'+esc(t.title)+'</b>'+statusBadge(t.status)+'</div>'

        if(viewers.length) h+='<div class="card flat" style="margin-bottom:8px"><div class="muted" style="font-size:11.5px">\ud83d\udc41 شافوه: '+viewers.map(v=>esc(v)).join(" \u00b7 ")+'</div></div>';
        h+='<div class="card flat">'+H.map(x=>{
          const ic=x.action==="create"?"\ud83d\udcc2":x.action==="update"?"\u270e":x.action==="view"?"\ud83d\udc41":x.action==="stage_done"?"\u2705":x.action==="money_in"?"\u2b07":x.action==="money_out"?"\u2b06":"\u2022";
          let extra="";
          if(x.changes){ try{ extra=Object.entries(x.changes).map(([k,v])=>esc(k)+': '+esc(v[0]==null?"\u2014":v[0])+' \u2190 '+esc(v[1]==null?"\u2014":v[1])).join(" \u00b7 "); }catch(e){} }

            +'<span style="flex:none;font-size:14px">'+ic+'</span>'

            +'<div style="font-size:12.5px"><b>'+esc(x.actor)+'</b> \u2014 '+esc(x.summary||x.action_ar)+'</div>'
            +(extra?'<div class="muted" style="font-size:11px;margin-top:2px">'+extra+'</div>':'')
            +'<div class="muted" style="font-size:11px;margin-top:2px">'+relativeTime(x.at)+'</div>'
            +'</div></div>';
        }).join("")+'</div>';
      }
    }
    h='<div id="j360Box"><div class="skel"></div></div>'+h;
    setTimeout(()=>paintJob360(id,"j360Box"), 30);
    h+='<div class="sec-h">مرفقات الملف <span class="ln"></span></div>';
    if(canUp){
      h+='<div class="card flat"><div class="field"><label>اسم المرفق</label><input id="pdTitle" placeholder="مثلًا: رسمة معمارية — الدور الأرضي"/></div>'

        +'<option value="__new">\u002b قسم جديد…</option>'
        +'<option value="client">مستندات العميل</option><option value="survey">رفع ومعاينة</option>'
        +'<option value="design" selected>تصميم ورسومات</option><option value="permit">ترخيص وجهاز المدينة</option>'
        +'<option value="exec">تنفيذ وإنشاءات</option><option value="corr">مراسلات</option>'
        +'<option value="photos">صور موقع</option><option value="handover">تسليم ومخالصة</option>'
        +'<option value="other">أخرى</option></select></div>'
        +'<div class="field"><label>وسوم (اختياري — بفاصلة)</label><input id="pdTags" placeholder="واجهات, نسخة نهائية"/></div>'
        +'<div class="field"><label>اختار ملف (أقصى 20 ميجا)</label><input id="pdFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx,.dwg" style="font-size:12px"/></div>'
        +'<div id="pdStatus" class="muted" style="font-size:12px;margin-bottom:8px"></div>'
        +'<div class="row-actions"><button class="btn primary sm" id="pdUp">ارفع للمشروع</button>'
        +'<button class="btn secondary sm" onclick="openJobParties(\''+id+'\')">أطراف الملف</button>'
        +(["owner","coceo","ops","manager"].includes(PROFILE.role)
          ?'<button class="btn secondary sm" onclick="openBuildInstallments(\''+id+'\')">جدول الدفعات</button>':'')
        +'</div></div>';
    }
    h+='<div id="ftBox" style="margin-top:8px"><div class="skel"></div></div>';
    setTimeout(()=>paintFileTree(id,"ftBox"), 40);
    $("pdBox").innerHTML=h;
    const msBtn=$("pdAddMs"); if(msBtn) msBtn.onclick=()=>openProjectMilestoneNew(id,prj);
    const woBtn=$("pdWorkOrder");
    if(woBtn){
      if(isOwnerOps()||PROFILE.role==="manager")
        woBtn.onclick=()=>openWorkOrderNew({ id:id, job_code:(prj&&prj.job_code)||"", name:(prj&&prj.name)||"" });
      else woBtn.remove();
    }
    if(canUp){
      addMicTo("pdTitle");
      $("pdUp").onclick=async()=>{
        const title=$("pdTitle").value.trim(); const fe=$("pdFile");
        if(!title){ toast("اكتب اسم المرفق","bad"); return; }
        if(!fe.files||!fe.files[0]){ toast("اختار ملف الأول","bad"); return; }
        const b=$("pdUp"); b.disabled=true; $("pdStatus").textContent="بيترفع…";
        try{
          const up=await uploadEmployeeFile(fe.files[0]);
          /* تحكم النسخ: لو فيه ملف بنفس الاسم في نفس المشروع، اعتبره نسخة قديمة واحفظه كأرشيف */
          let revision=1;
          const { data:dupes }=await sb.from("os_files").select("id,revision").eq("project_id",id).eq("archived",false).ilike("title",title);
          if(dupes&&dupes.length){
            revision=Math.max(...dupes.map(d=>d.revision||1))+1;
            await sb.from("os_files").update({ archived:true, archived_at:new Date().toISOString(), archived_by:ME.id }).in("id",dupes.map(d=>d.id));
          }
          const folder=$("pdFolder")?(await resolveFolder("pdFolder")):"other";
          const tags=($("pdTags")&&$("pdTags").value.trim())
            ? $("pdTags").value.split(",").map(t=>t.trim()).filter(Boolean) : null;
          let organized=up.path;
          try{
            const { data:np }=await sb.rpc("os_build_storage_path",
              { p_project:id, p_folder:folder, p_filename:(fe.files[0].name||title) });
            if(np) organized=np;
          }catch(e){}
          await registerFile({ title, kind:"file", project_id:id, dept:prj.dept||null, folder,
            tags, url:up.url, storage_path:organized, size_bytes:up.size, mime:up.mime, revision });
          toast(revision>1?"اترفعت نسخة جديدة (Rev "+revision+") — النسخة القديمة اتأرشفت أوتوماتيك":"اترفع واتربط بالمشروع","ok");
          paintProjectDetail(id);
        }catch(e){ $("pdStatus").textContent=""+(e.message||"فشل"); toast(e.message||"فشل الرفع","bad"); b.disabled=false; }
      };
    }
  }catch(e){ $("pdBox").innerHTML=failBox("حصل خطأ.",()=>paintProjectDetail(id)); }
}

const SE_STAGE={arch_received:"معماري مستلم",statical_system:"ستاتيكال سيستم",exported:"اتصدّر لـSAFE/ETABS",analysis_done:"التحليل (Run) خلص",design_done:"التصميم خلص",execution_ready:"لوحات تنفيذ جاهزة"};
const SE_SW={SAFE:"SAFE",ETABS:"ETABS",both:"الاتنين"};
function isStructUser(){ return isOwnerOps()||PROFILE.dept==="engineering"; }

async function openStructEng(){
  openSheet('<h3>الهندسة الإنشائية</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">دورة التصميم من المعماري للتنفيذ — مدخلات، تحليل SAFE/ETABS، وتشيكات العناصر</div>'
    +'<div id="seBox"><div class="skel"></div><div class="skel"></div></div>'
    +(isStructUser()?'<div class="row-actions" style="margin-top:10px"><button class="btn green sm" id="seNew">مشروع إنشائي جديد</button></div>':"")
    +'<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">قفل</button>');
  if(isStructUser()) $("seNew").onclick=()=>openStructNew();
  await paintStructProjects();
}

async function paintStructProjects(){
  try{
    const { data }=await sb.from("os_struct_overview").select("*").order("updated_at",{ascending:false});
    const rows=data||[];
    if(!rows.length){ $("seBox").innerHTML='<div class="empty">مفيش مشاريع إنشائية لسه. ابدأ بمشروع جديد.</div>'; return; }
    const failed=rows.filter(r=>(r.failed_checks||0)>0);
    let h="";
    if(failed.length){
      h+='<div class="sec-h" style="color:var(--red)">تشيكات فاشلة — محتاجة مراجعة <span class="ln"></span></div>';
      h+=failed.map(seCard).join("");
      const rest=rows.filter(r=>(r.failed_checks||0)===0);
      if(rest.length){ h+='<div class="sec-h">باقي المشاريع <span class="ln"></span></div>'+rest.map(seCard).join(""); }
    } else { h+=rows.map(seCard).join(""); }
    $("seBox").innerHTML=h;
    $("seBox").querySelectorAll("[data-se]").forEach(el=>el.onclick=()=>openStructProjectDetail(el.getAttribute("data-se")));
  }catch(e){ $("seBox").innerHTML=failBox("معرفناش نجيب المشاريع الإنشائية.",paintStructProjects); }
}

function seCard(p){
  const fail=(p.failed_checks||0);
  const stale=(p.days_since_update||0)>=7;
  return '<div class="card flat" data-se="'+p.id+'" style="cursor:pointer'+(fail?';border-right:4px solid var(--red)':'')+'">'
    +'<div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(p.name)+'</b>'
    +'<span class="badge b-blue">'+(SE_STAGE[p.stage]||esc(p.stage))+'</span></div>'
    +'<div class="meta" style="margin-top:6px"><span>'+(SE_SW[p.software]||esc(p.software||""))+'</span>'
    +(p.engineer_name?'<span class="dot"></span><span>'+esc(p.engineer_name)+'</span>':'')
    +'<span class="dot"></span><span>'+(p.elements_total||0)+' عنصر</span>'
    +(fail?'<span class="dot"></span><span style="color:var(--red);font-weight:800">'+fail+' تشيك فاشل</span>':'')
    +(stale?'<span class="dot"></span><span style="color:#F59E0B">واقف '+p.days_since_update+' يوم</span>':'')
    +'</div></div>';
}

async function paintStructProjectDetail(id){
  try{
    const { data:p, error }=await sb.from("os_struct_projects").select("*").eq("id",id).single();
    if(error||!p){ $("sdBox").innerHTML=failBox("معرفناش نجيب المشروع.",()=>paintStructProjectDetail(id)); return; }
    const { data:els }=await sb.from("os_struct_element_status").select("*").eq("project_id",id).order("created_at",{ascending:false});
    const rows=els||[];
    let h='<div class="card">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge b-blue">'+(SE_STAGE[p.stage]||esc(p.stage))+'</span><span class="badge" style="background:#eef2f7;color:#0D47A1">'+(SE_SW[p.software]||esc(p.software||""))+'</span></div>'
      +'<b style="display:block;margin-top:8px;font-size:15px">'+esc(p.name)+'</b>'
      +'<div class="meta" style="margin-top:6px">'+(p.architect_name?'<span>معماري: '+esc(p.architect_name)+'</span><span class="dot"></span>':'')+(p.engineer_name?'<span>إنشائي: '+esc(p.engineer_name)+'</span>':'')+'</div>'
      +'<div class="muted" style="font-size:11.5px;margin-top:6px">'+(p.fc?'fc='+p.fc+' N/mm² · ':'')+(p.fy?'fy='+p.fy+' N/mm² · ':'')+(p.num_floors?p.num_floors+' دور':'')+'</div></div>';
    h+='<div class="sec-h">العناصر ('+rows.length+') <span class="ln"></span></div>';

async function paintGovCases(){
  const box=$("govBox"); if(!box) return;
  try{
    let q=sb.from("os_gov_cases").select("*").order("created_at",{ascending:false}).limit(60);
    q = _govView==="archived" ? q.eq("status","archived") : q.neq("status","archived");
    const { data }=await q;
    const rows=data||[];
    if(!rows.length){ box.innerHTML='<div class="empty">'+(_govView==="archived"?"مفيش معاملات مؤرشفة لسه.":"مفيش معاملات شغّالة. ابدأ بمعاملة جديدة.")+'</div>'; return; }
    box.innerHTML=rows.map(c=>{
      const st=GOV_STATUS[c.status]||["—","b-grey"];
      const pr=Math.max(0,Math.min(100,c.progress||0));
      let dd="";
      if(c.target_date&&c.status!=="archived"){
        const days=Math.ceil((new Date(c.target_date)-new Date())/86400000);
        dd = days<0?'<span style="color:var(--red);font-weight:800">متأخرة '+Math.abs(days)+' يوم</span>':days<=3?'<span style="color:#B45309;font-weight:700">خلال '+days+' يوم</span>':'خلال '+days+' يوم';
      }
      return '<div class="card flat" data-gov="'+c.id+'" style="cursor:pointer">'
        +'<div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(c.title)+'</b><span class="badge" style="background:'+(st[1][0]==="#"?st[1]:"")+'" class="badge '+(st[1][0]==="#"?"":st[1])+'">'+st[0]+'</span></div>'
        +'<div class="prog" style="margin:8px 0 4px"><i style="width:'+pr+'%"></i></div>'
        +'<div class="meta"><span>'+(GOV_TYPE[c.case_type]||c.case_type)+'</span>'+(c.government_body?'<span class="dot"></span><span>'+esc(c.government_body)+'</span>':'')+(dd?'<span class="dot"></span><span>'+dd+'</span>':'')+'</div></div>';
    }).join("");
    box.querySelectorAll("[data-gov]").forEach(el=>el.onclick=()=>openGovCaseDetail(el.getAttribute("data-gov")));
    if(box._listSearchApply) box._listSearchApply();
  }catch(e){ box.innerHTML=failBox("معرفناش نجيب المعاملات.",paintGovCases); }
}

async function paintMinutes(){
  try{
    const { data }=await sb.from("os_minutes").select("*").order("created_at",{ascending:false}).limit(20);
    const rows=data||[];
    let decsBy={};
    if(rows.length){
      try{
        const dr=await sb.from("os_minute_decisions").select("*").in("minute_id",rows.map(m=>m.id)).order("created_at",{ascending:true});
        (dr.data||[]).forEach(d=>{ (decsBy[d.minute_id]=decsBy[d.minute_id]||[]).push(d); });
      }catch(e){}
    }
    $("minBox").innerHTML= rows.length? rows.map(m=>{
      const ds=decsBy[m.id]||[];
      const decHtml=ds.length? '<div style="margin-top:8px;font-size:11px;font-weight:800;color:var(--blue-d)">القرارات ('+ds.length+')</div>'+ds.map(d=>{
        const txt=d.decision||d.title||d.text||d.body||"قرار";
        const own=d.owner_name||nameOf(d.owner_id)||"";
        return '<div style="display:flex;gap:7px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px;flex-wrap:wrap">'
          +'<span style="flex:1;min-width:55%">'+esc(txt)+'</span>'
          +(own?'<span class="muted" style="font-size:11px;white-space:nowrap">'+esc(own)+'</span>':'')
          +(d.deadline?'<span class="muted" style="font-size:11px;white-space:nowrap">'+fmtDate(d.deadline)+'</span>':'')
          +(d.task_id?'<button class="lnk" data-dtask="'+esc(d.task_id)+'" style="font-size:11.5px;white-space:nowrap">المهمة المرتبطة ↗</button>':'')
          +'</div>';
      }).join("") : "";
      const addForm = (typeof canWrite==="function"?canWrite():true)? '<details style="margin-top:7px"><summary class="lnk" style="font-size:11.5px;cursor:pointer;list-style:none">+ أضف قرار</summary>'
        +'<div style="margin-top:7px;display:grid;gap:6px">'
        +'<input class="dcTxt" placeholder="نص القرار…" style="padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"/>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
        +'<select class="dcOwn" style="flex:1;min-width:130px;padding:8px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"><option value="">المسؤول…</option>'+PROFILES.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")+'</select>'
        +'<input class="dcDl" type="date" style="padding:8px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"/>'
        +'<button class="btn green sm dcGo" data-min="'+m.id+'">سجّل القرار</button></div>'
        +'<div class="muted" style="font-size:10.5px">لو حددت مسؤول وموعد — هتتولد مهمة تلقائيًا وهيظهر رابطها هنا</div>'
        +'</div></details>' : "";
      return '<div class="card flat"><b>'+esc(m.title)+'</b>'+(m.attendees?'<div class="muted" style="font-size:11.5px;margin-top:3px">'+esc(m.attendees)+'</div>':'')+'<div style="font-size:12.5px;margin-top:5px;white-space:pre-wrap">'+esc((m.body||"").slice(0,300))+((m.body||"").length>300?"\u2026":"")+'</div>'+decHtml+addForm+'<div class="meta"><span>'+esc(m.by_name||"")+'</span><span class="dot"></span><span>'+timeAgo(m.created_at)+'</span></div></div>';
    }).join("") : '<div class="empty">مفيش محاضر لسه.</div>';
    $("minBox").querySelectorAll("[data-dtask]").forEach(b=>b.onclick=()=>openLinkedTask(b.dataset.dtask));
    $("minBox").querySelectorAll(".dcGo").forEach(b=>b.onclick=async()=>{
      const box=b.closest("details");
      const txt=box.querySelector(".dcTxt").value.trim(); if(!txt){ toast("اكتب نص القرار","bad"); return; }
      const own=box.querySelector(".dcOwn").value||null;
      const dl=box.querySelector(".dcDl").value||null;
      const payload={ minute_id:b.dataset.min, decision:txt, by_id:ME.id, by_name:PROFILE.name };
      if(own){ payload.owner_id=own; const p=PROFILES.find(x=>String(x.id)===String(own)); if(p) payload.owner_name=p.name; }
      if(dl) payload.deadline=dl;
      b.disabled=true; b.textContent="بيتسجل…";
      let { error }=await sb.from("os_minute_decisions").insert(payload);
      if(error && /column|schema/i.test(String(error.message||""))){
        const min={ minute_id:b.dataset.min, decision:txt };
        if(own) min.owner_id=own; if(dl) min.deadline=dl;
        ({ error }=await sb.from("os_minute_decisions").insert(min));
      }
      b.disabled=false; b.textContent="سجّل القرار";
      if(error){ toast("معرفناش نسجل القرار: "+error.message,"bad"); return; }
      toast("القرار اتسجل"+(own&&dl?" — والمهمة بتتولد دلوقتي":""),"ok");
      setTimeout(paintMinutes, 1200);
    });
  }catch(e){ $("minBox").innerHTML=failBox("معرفناش نجيبها.",paintMinutes); }
}

/* === مرحلة جديدة من أي فورم === */
async function resolveStage(selId){
  const sel=$(selId); if(!sel) return null;
  if(sel.value!=="__new") return sel.value||null;
  const nm=prompt("اسم المرحلة الجديدة؟"); if(!nm||!nm.trim()) return null;
  const { data:mx }=await sb.from("os_stage_defs").select("seq").order("seq",{ascending:false}).limit(1);
  const nxt=(mx&&mx.length?Number(mx[0].seq):0)+1;
  const { error }=await sb.from("os_stage_defs").insert({ seq:nxt, name:nm.trim() });
  if(error){ toast(/duplicate|unique/i.test(error.message)?"المرحلة دي موجودة":error.message,"bad"); return null; }
  const o=document.createElement("option"); o.value=nm.trim(); o.textContent=nxt+". "+nm.trim();
  sel.insertBefore(o, sel.lastElementChild); sel.value=nm.trim();
  toast("المرحلة اتضافت \u2713","ok");
  return nm.trim();
}

async function resolveFolder(selId){

  if(sel.value!=="__new") return sel.value||"other";
  const nm=prompt("اسم القسم الجديد؟"); if(!nm||!nm.trim()){ sel.value="other"; return "other"; }
  const { data, error }=await sb.from("os_file_folders").insert({ name:nm.trim() }).select("code,name").single();
  if(error||!data){ toast("معرفناش نضيف القسم","bad"); sel.value="other"; return "other"; }
  const o=document.createElement("option"); o.value=data.code; o.textContent=data.name;
  sel.appendChild(o); sel.value=data.code;
  toast("القسم اتضاف \u2713","ok");
  return data.code;
}

/* === شجرة اختيار الملف: عام أو قطعة ← ملف === */
let _pickCB=null, _pickTree=null, _pickRestore=null, _pickRebind=null;
async function loadJobTree(){
  if(_pickTree) return _pickTree;
  const { data }=await sb.from("os_job_picker").select("*").order("parcel_code").order("job_code");
  const byParcel={};
  (data||[]).forEach(r=>{
    if(!byParcel[r.parcel_id]) byParcel[r.parcel_id]={ id:r.parcel_id, label:r.parcel_label,
      code:r.parcel_code, land:r.land_code, client:r.client_name, jobs:[] };
    if(r.project_id) byParcel[r.parcel_id].jobs.push(r);
  });
  _pickTree=Object.values(byParcel);
  return _pickTree;
}
/* يفتح الشجرة ويرجّع {id,label} أو null للعام */
async function pickJob(cb, opts){
  opts=opts||{}; _pickCB=cb;
  /* الشيت واحد — نحفظ الفورم اللي تحت ونرجّعه بعد الاختيار */
  const prevHTML=$("sheet").innerHTML;
  const prevVals={};
  $("sheet").querySelectorAll("input,select,textarea").forEach(el=>{
    if(el.id) prevVals[el.id]=el.value;
  });
  const prevTexts={};
  $("sheet").querySelectorAll("button[id$='Btn']").forEach(el=>{
    if(el.id) prevTexts[el.id]=el.textContent;
  });
  _pickRestore=()=>{
    $("sheet").innerHTML=prevHTML;
    Object.entries(prevVals).forEach(([k,v])=>{ const el=$(k); if(el) el.value=v; });
    Object.entries(prevTexts).forEach(([k,v])=>{ const el=$(k); if(el) el.textContent=v; });
    if(typeof _pickRebind==="function") try{ _pickRebind(); }catch(e){}
  };
  const tree=await loadJobTree();
  openSheet('<h3>'+(opts.title||"اختار الملف")+'</h3>'
    +(opts.allowGeneral!==false?'<button class="btn sm" style="width:100%;margin-bottom:10px" onclick="pickDone(null,null)">'
      +'\u2014 عام (مش على ملف) \u2014</button>':'')
    +'<button class="btn green sm" style="width:100%;margin-bottom:10px" onclick="quickJobFromPicker()">\u002b افتح ملف جديد</button>'
    +'<div class="field"><input id="pkQ" placeholder="دوّر بكود القطعة أو الملف أو العميل…"/></div>'
    +'<div id="pkTree"></div>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="pickCancel()">رجوع من غير اختيار</button>');
  const paint=(q)=>{
    q=(q||"").trim().toLowerCase();
    const T=tree.filter(p=>{
      if(!q) return true;
      if((p.label+" "+(p.code||"")+" "+(p.land||"")+" "+(p.client||"")).toLowerCase().includes(q)) return true;
      return p.jobs.some(j=>(j.job_label||"").toLowerCase().includes(q));
    });
    if(!T.length){ $("pkTree").innerHTML='<div class="empty">مفيش نتايج.</div>'; return; }
    $("pkTree").innerHTML=T.map(p=>
      '<div class="card flat" style="margin-bottom:8px">'
      +'<div style="font-size:12.5px;font-weight:700">'+esc(p.label||"")+'</div>'
      +'<div class="muted" style="font-size:11px;margin-bottom:5px">'
      +esc(p.client||"—")+(p.land?' · '+esc(p.land):'')+'</div>'
      +(p.jobs.length?p.jobs.map(j=>
        '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #eef2f7">'
        +'<div style="flex:1;min-width:0"><div style="font-size:12.5px">'+esc(j.job_code||"")+'</div>'
        +'<div class="muted" style="font-size:10.5px">'+esc(j.job_name||"")
        +(j.service_name?' · '+esc(j.service_name):'')
        +(Number(j.expenses)?' · مصروف '+egp(j.expenses):'')+'</div></div>'
        +'<button class="btn sm" style="flex:none" onclick="pickDone(\''+j.project_id+'\',\''
        +esc((j.job_code||"")+" — "+(j.job_name||""))+'\')">اختار</button></div>').join("")
        :'<div class="muted" style="font-size:11px;padding:5px 0;border-top:1px solid #eef2f7">مفيش ملفات على القطعة دي.</div>')
      +'</div>').join("");
  };
  $("pkQ").oninput=(e)=>paint(e.target.value);
  paint("");
}
function pickCancel(){
  const rs=_pickRestore; _pickCB=null; _pickRestore=null;

function pickDone(id, label){

async function quickCash(id, jobCode){

      +'</div>').join("")+'</div>';
  }catch(e){ box.innerHTML='<div class="empty">تعذّر التحميل.</div>'; }

async function addCOA(){
  const code=prompt("كود الحساب؟ (مثلاً 5950)"); if(!code||!code.trim()) return;
  const name=prompt("اسم الحساب؟"); if(!name||!name.trim()) return;
  const types=["asset","liability","equity","income","expense"];
  const ar=["أصل","التزام","حقوق ملكية","إيراد","مصروف"];
  const t=prompt("النوع؟\n"+ar.map((a,i)=>(i+1)+") "+a).join("\n"),"5");
  const ti=parseInt(t)-1; if(!(ti>=0&&ti<5)) return;
  const type=types[ti];
  const normal=(type==="asset"||type==="expense")?"debit":"credit";
  const parent=({asset:"1",liability:"2",equity:"3",income:"4",expense:"5"})[type];
  const { error }=await sb.from("os_coa").insert({ code:code.trim(), name:name.trim(), type, normal, parent });
  if(error){ toast(/duplicate|unique/i.test(error.message)?"الكود ده موجود":error.message,"bad"); return; }
  toast("الحساب اتضاف \u2713","ok"); paintCOA();
}
async function renameCOA(code, cur){
  const nm=prompt("الاسم الجديد؟", cur); if(!nm||!nm.trim()||nm===cur) return;
  const { error }=await sb.from("os_coa").update({ name:nm.trim() }).eq("code",code);
  if(error){ toast(error.message,"bad"); return; }
  toast("اتعدّل \u2713","ok"); paintCOA();
}

    $("jvSum").innerHTML='مدين <b>'+egp(d)+'</b> · دائن <b>'+egp(c)+'</b> · '
      +(Math.abs(d-c)<0.01&&d>0?'<b style="color:var(--green-d)">متوازن \u2713</b>'
        :'<b style="color:var(--red)">فرق '+egp(Math.abs(d-c))+'</b>');

    if(d>0&&c>0){ toast("السطر يبقى مدين أو دائن — مش الاتنين","bad"); return; }

    _jvLines.push({ coa:sel.value, name:sel.options[sel.selectedIndex].textContent, debit:d, credit:c });

  };

    const memo=$("jvMemo").value.trim();
    if(!memo){ toast("اكتب البيان","bad"); return; }
    if(_jvLines.length<2){ toast("القيد محتاج سطرين على الأقل","bad"); return; }

    const c=_jvLines.reduce((a,b)=>a+Number(b.credit||0),0);
    if(Math.abs(d-c)>0.01){ toast("القيد مش متوازن","bad"); return; }

      p_lines:_jvLines.map(x=>({ coa:x.coa, debit:x.debit, credit:x.credit })),
      p_source:"manual", p_source_id:null, p_project:null });
    if(error){ toast(error.message,"bad"); b.disabled=false; return; }
    toast("القيد اترحّل \u2713","ok"); _jvLines=[]; openJournal();
  };
  paint();
}

/* ═══════════ إضافة تصنيف من أي فورم ═══════════ */
async function catOptions(kind){
  try{
    const { data }=await sb.from("os_fin_categories").select("code,name")
      .eq("kind",kind).eq("active",true).order("sort_order");
    return (data||[]).map(c=>'<option value="'+esc(c.code||c.name)+'">'+esc(c.name)+'</option>').join("")
      +'<option value="__new">\u002b تصنيف جديد…</option>';
  }catch(e){ return '<option value="other">أخرى</option>'; }
}
/* لو اتختار «جديد» بيطلب الاسم ويسجّله ويرجّع كوده */
async function resolveCat(selId, kind){
  const sel=$(selId); if(!sel) return null;
  if(sel.value!=="__new") return sel.value||null;
  const nm=prompt("اسم التصنيف الجديد؟"); if(!nm||!nm.trim()) return null;
  let { data, error }=await sb.from("os_fin_categories")
    .insert({ kind, name:nm.trim() }).select("code,name").single();
  if(error){
    const { data:ex }=await sb.from("os_fin_categories").select("code,name")
      .eq("kind",kind).eq("name",nm.trim()).limit(1);
    data = ex&&ex.length ? ex[0] : null;
  }
  if(!data){ toast("معرفناش نضيف التصنيف","bad"); return null; }
  const v=data.code||data.name;
  const o=document.createElement("option"); o.value=v; o.textContent=data.name;
  sel.insertBefore(o, sel.lastElementChild); sel.value=v;
  return v;
}

let _setLines=[];
async function openSettleAdvance(profileId, staffName, balance){
  if(!isFinanceUser()&&!isOwnerOps()){ toast("تصفية العهد للمالية","bad"); return; }
  _setLines=[];
  const [cats, prjs]=await Promise.all([
    catOptions("expense"),
    sb.from("os_projects").select("id,job_code,name").neq("status","closed").order("created_at",{ascending:false}).limit(200)
  ]);
  const prjOpts='<option value="">\u2014 مصروف عام \u2014</option>'
    +((prjs.data)||[]).map(p=>'<option value="'+p.id+'">'+esc((p.job_code?p.job_code+' — ':'')+p.name)+'</option>').join("");
  openSheet('<h3>تصفية عهدة '+esc(staffName||"")+'</h3>'
    +'<div class="card flat" style="text-align:center"><b style="display:block;font-size:20px">'+egp(balance)+'</b>'
    +'<span class="muted" style="font-size:11.5px">العهدة المفتوحة</span></div>'
    +'<div class="sec-h">اتصرفت في إيه؟ <span class="ln"></span></div>'
    +'<div id="slList"></div>'
    +'<div class="card flat">'
    +'<div class="field"><label>البند</label><input id="slTitle" placeholder="مثلاً: رسوم استمارة"/></div>'
    +'<div class="field"><label>المبلغ</label><input id="slAmt" type="number" inputmode="numeric" min="1"/></div>'
    +'<div class="field"><label>التصنيف</label><select id="slCat">'+cats+'</select></div>'
    +jobPickerField("slPrj","على ملف؟ (من بيان الأعمال)")
    +'<button class="btn sm" id="slAdd">\u002b ضيف البند</button></div>'
    +'<div class="field" style="margin-top:10px"><label>الباقي النقدي المرتجع</label>'
    +'<input id="slCash" type="number" inputmode="numeric" min="0" value="0"/></div>'
    +'<div id="slSum" class="muted" style="font-size:12px;margin:6px 0"></div>'
    +'<div class="row-actions"><button class="btn green" id="slGo">صفّي العهدة</button>'
    +'<button class="btn ghost" onclick="openAdvances()">إلغاء</button></div>');
  addMicTo("slTitle");
  const recalc=()=>{
    const spent=_setLines.reduce((a,b)=>a+Number(b.amount||0),0);
    const cash=parseFloat($("slCash").value)||0;
    const left=Number(balance)-spent-cash;
    $("slSum").innerHTML='مصروف: <b>'+egp(spent)+'</b> · باقي نقدي: <b>'+egp(cash)+'</b> · '
      +(Math.abs(left)<0.01?'<b style="color:var(--green-d)">مظبوطة \u2713</b>'
        :left>0?'<b style="color:#B45309">لسه '+egp(left)+' مش متفسّرة</b>'
        :'<b style="color:var(--red)">زيادة '+egp(-left)+'</b>');
  };
  const paint=()=>{
    $("slList").innerHTML=_setLines.length? _setLines.map((x,i)=>
      '<div class="card flat" style="display:flex;align-items:center;gap:8px;padding:8px">'
      +'<div style="flex:1;min-width:0"><div style="font-size:12.5px">'+esc(x.title)+'</div>'
      +'<div class="muted" style="font-size:11px">'+esc(x.catName||"")+(x.prjName?' · '+esc(x.prjName):' · عام')+'</div></div>'
      +'<b style="font-size:12.5px">'+egp(x.amount)+'</b>'
      +'<button class="btn ghost sm" onclick="rmSettleLine('+i+')" style="color:var(--red)">\u2715</button></div>').join("")
      :'<div class="muted" style="font-size:12px;margin-bottom:6px">مفيش بنود لسه.</div>';
    recalc();
  };
  window.rmSettleLine=(i)=>{ _setLines.splice(i,1); paint(); };
  _pickRebind=()=>{ addMicTo("slTitle"); bindSl(); paint(); };
  function bindSl(){
  $("slCash").oninput=recalc;
  $("slAdd").onclick=async()=>{
    const t=$("slTitle").value.trim(), a=parseFloat($("slAmt").value);
    if(!t){ toast("اكتب البند","bad"); return; }
    if(!(a>0)){ toast("اكتب المبلغ","bad"); return; }
    const cat=await resolveCat("slCat","expense");
    const cs=$("slCat");
    _setLines.push({ title:t, amount:a, category:cat,
      catName:cs.options[cs.selectedIndex]?cs.options[cs.selectedIndex].textContent:"",
      project_id:$("slPrj").value||null,
      prjName:$("slPrj").value?($("slPrjBtn").textContent||""):"" });
    $("slTitle").value=""; $("slAmt").value="";
    $("slPrj").value=""; $("slPrjBtn").textContent="— عام —"; paint();
  };
  $("slGo").onclick=async()=>{
    const cash=parseFloat($("slCash").value)||0;
    if(!_setLines.length&&!(cash>0)){ toast("ضيف بنود أو باقي نقدي","bad"); return; }
    const b=$("slGo"); b.disabled=true;
    const { data, error }=await sb.rpc("os_settle_advance",{
      p_profile:profileId,
      p_lines:_setLines.map(x=>({ title:x.title, amount:x.amount, category:x.category, project_id:x.project_id })),
      p_cash_back:cash, p_notes:null });
    if(error){ toast(error.message,"bad"); b.disabled=false; return; }
    _setLines=[];
    afterMoney("advance_back",(data&&(data.settle_id||data.id))||null,"العهدة اتصفّت \u2713",()=>openAdvances());
  };
  }
  bindSl();
  paint();
}

        +'<span style="flex:none;font-size:13px;color:'+(ok?'var(--green-d)':'#b9b9b4')+'">'+(ok?'\u2714':'\u25cb')+'</span>'
        +'<div style="flex:1;min-width:0">'

        +(ok&&x.delivered_at?'<div class="muted" style="font-size:10.5px;margin-top:1px">اتسلّم '+fmtDate(x.delivered_at)+'</div>':'')
        +'</div>'

async function addScopeItem(id){
  const it=prompt("البند؟"); if(!it||!it.trim()) return;

  const inc=confirm("البند ده داخل في الاتفاق؟\nموافق = داخل · إلغاء = مستثنى");
  const { data:mx }=await sb.from("os_job_scope").select("seq_no").eq("project_id",id)
    .order("seq_no",{ascending:false}).limit(1);

    item:it.trim(), deliverable:dv, included:inc, created_by:ME.id });

async function newJobOnParcel(parcelId, parcelCode){
  let svcOpts='';
  try{ const { data }=await sb.from("os_service_types").select("code,name").eq("active",true).order("sort_order");
    svcOpts=(data||[]).map(x=>'<option value="'+x.code+'">'+esc(x.name)+'</option>').join(""); }catch(e){}

    +'<div class="muted" style="margin:-6px 0 12px;font-size:12px">الجهاز والمنطقة والعميل هيتاخدوا من القطعة تلقائي.</div>'
    +'<div class="field"><label>نوع الملف</label><select id="npSvc">'+svcOpts+'</select></div>'
    +'<div class="field"><label>اسم الملف</label><input id="npName" placeholder="مثلاً: إنشاءات الفيلا"/></div>'
    +'<div class="field"><label>القيمة (جنيه — اختياري)</label><input id="npVal" type="number" inputmode="numeric" min="0"/></div>'
    +'<div class="row-actions"><button class="btn green" id="npGo">افتح الملف</button>'
    +'<button class="btn ghost" onclick="openParcelHistory(\''+parcelId+'\')">إلغاء</button></div>');
  addMicTo("npName");
  $("npGo").onclick=async()=>{
    const nm=$("npName").value.trim(); if(!nm){ toast("اكتب اسم الملف","bad"); return; }
    const b=$("npGo"); b.disabled=true;
    const { data, error }=await sb.rpc("os_new_job_on_parcel",{
      p_parcel:parcelId, p_name:nm, p_service:$("npSvc").value||"O",
      p_value:parseFloat($("npVal").value)||null, p_dept:PROFILE.dept||null });
    if(error){ toast(error.message,"bad"); b.disabled=false; return; }
    toast("الملف اتفتح \u2713","ok"); openProjectDetail(data);
  };
}

async function buildPlan(id){
  const { data:p }=await sb.from("os_projects").select("value_egp,name").eq("id",id).maybeSingle();
  let val=p&&p.value_egp;
  if(!val){
    const v=prompt("قيمة الملف بالجنيه؟"); val=parseFloat(v);
    if(!(val>0)) return;
    await sb.from("os_projects").update({ value_egp:val }).eq("id",id);
  }
  const { error }=await sb.rpc("os_build_payment_plan",{ p_project:id, p_value:val });
  if(error){ toast(error.message,"bad"); return; }
  toast("خطة الدفع اتولدت \u2713","ok"); paintProjectDetail(id);
}
async function collectInst(payId, remaining, prjId){
  const v=prompt("المبلغ المحصّل (المتبقي "+remaining+")", String(remaining));
  const a=parseFloat(v); if(!(a>0)) return;
  const { data:cur }=await sb.from("os_project_payments").select("amount,paid_amount").eq("id",payId).maybeSingle();
  const paid=(Number(cur&&cur.paid_amount||0))+a;
  const full=paid >= Number(cur&&cur.amount||0);
  const { error }=await sb.from("os_project_payments").update({
    paid_amount:paid, status: full?'paid':'partial', paid_at: full?todayStr():null }).eq("id",payId);
  if(error){ toast(error.message.includes('مقفلة')?'الفترة المالية مقفلة':error.message,"bad"); return; }
  afterMoney("receipt", payId, full?"الدفعة اتحصّلت \u2713":"تحصيل جزئي \u2713", ()=>openProjectDetail(prjId));
}

async function openFind(pre){
  openSheet('<h3>بحث</h3>'
    +'<div class="field"><input id="fqBox" placeholder="اسم العميل · تليفون · رقم قطعة · كود ملف · اسم مرفق" autocomplete="off"/></div>'
    +'<div class="muted" style="font-size:11.5px;margin:-6px 0 10px">مثال: 0145 أو ZY-03-0145 أو اسم العميل</div>'
    +'<div id="fqRes"></div>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  const box=$("fqBox"); let t=null;
  box.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>runFind(box.value), 280); };
  box.onkeydown=(e)=>{ if(e.key==="Enter"){ clearTimeout(t); runFind(box.value); } };
  if(pre){ box.value=pre; runFind(pre); }
  setTimeout(()=>box.focus(), 120);
}
async function runFind(q){
  const res=$("fqRes"); if(!res) return;
  if(!q||q.trim().length<2){ res.innerHTML='<div class="empty">اكتب حرفين على الأقل.</div>'; return; }
  res.innerHTML='<div class="skel"></div>';
  try{
    const { data, error }=await sb.rpc("os_find",{ q:q.trim() });
    if(error) throw error;
    const R=data||[];
    if(!R.length){ res.innerHTML='<div class="empty">مفيش نتايج لـ «'+esc(q)+'».</div>'; return; }
    const ic={'ملف':'\ud83d\udcc1','قطعة':'\ud83d\udccd','مرفق':'\ud83d\udcce'};
    res.innerHTML=R.map(x=>{
      const click = x.kind==='ملف'   ? 'openProjectDetail(\''+x.ref+'\')'
                  : x.kind==='قطعة'  ? 'openParcelHistory(\''+x.ref+'\')'
                  : 'toast("المرفق جوه الملف — افتح الملف","ok")';
      return '<div class="card flat" style="cursor:pointer;margin-bottom:8px" onclick="'+click+'">'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span style="flex:none;font-size:15px">'+ic[x.kind]+'</span>'
        +'<b style="flex:1;font-size:13.5px;min-width:0">'+esc(x.title||'—')+'</b>'
        +(x.code?'<span class="badge" style="background:#eef2f7;color:#0D47A1;font-weight:800;letter-spacing:.3px">'+esc(x.code)+'</span>':'')
        +'</div>'
        +'<div class="meta" style="margin-top:5px">'
        +(x.subtitle?'<span>'+esc(x.subtitle)+'</span>':'')
        +(x.area?'<span class="dot"></span><span>'+esc(x.area)+'</span>':'')
        +(x.parcel_no?'<span class="dot"></span><span>قطعة '+esc(x.parcel_no)+'</span>':'')
        +(Number(x.attachments)>0?'<span class="dot"></span><span>'+x.attachments+(x.kind==='قطعة'?' ملف':' مرفق')+'</span>':'')
        +(x.opened?'<span class="dot"></span><span>'+fmtDate(x.opened)+'</span>':'')
        +'</div></div>';
    }).join("");
  }catch(e){ res.innerHTML='<div class="empty">تعذّر البحث.</div>'; }
}

async function paintFileTree(projectId, mountId){
  const box=$(mountId); if(!box) return;
  try{
    const { data }=await sb.from("os_file_tree").select("*").eq("project_id",projectId)
      .order("folder_order").order("created_at",{ascending:false});
    const R=data||[];
    if(!R.length){ box.innerHTML='<div class="empty">مفيش مرفقات — ارفع أول ملف.</div>'; return; }
    const groups={};

async function payPayable(id, remaining){
  const v=prompt("المبلغ المدفوع (المتبقي "+remaining+")", String(remaining));
  const a=parseFloat(v); if(!(a>0)) return;
  const { data, error }=await sb.rpc("os_pay_payable",{ p_id:id, p_amount:a });
  if(error){ toast(error.message,"bad"); return; }
  afterMoney("payable", id, "اتدفع \u2713", ()=>openPayables());
}

  let prjOpts='<option value="">\u2014 مصروف عام (مش على ملف) \u2014</option>';
  let catOpts='';
  try{
    const [{ data:prjs },{ data:cats }]=await Promise.all([
      sb.from("os_projects").select("id,job_code,name").neq("status","closed").order("created_at",{ascending:false}).limit(200),
      sb.from("os_fin_categories").select("code,name").eq("kind","expense").eq("active",true).order("sort_order")
    ]);
    prjOpts+=(prjs||[]).map(p=>'<option value="'+p.id+'">'+esc((p.job_code?p.job_code+' — ':'')+p.name)+'</option>').join("");
    catOpts=(cats||[]).map(c=>'<option value="'+esc(c.code||c.name)+'">'+esc(c.name)+'</option>').join("");
  }catch(e){}
  if(!catOpts) catOpts=Object.entries(COST_CAT).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join("");
  catOpts+='<option value="__new">\u002b تصنيف جديد…</option>';
  openSheet('<h3>سجّل مصروف</h3>'
    +'<div class="muted" style="margin:-6px 0 12px;font-size:12px">لو المصروف على ملف معيّن اختاره — ولو مصروف عام (إيجار، كهرباء، رواتب) سيبه زي ما هو.</div>'
    +(preJobId?'<input type="hidden" id="csPrj" value="'+esc(preJobId)+'"/>'
        +'<div class="card flat" style="padding:9px 13px;margin-bottom:10px"><b style="font-size:12.5px">المصروف على الملف المفتوح</b></div>'
       :jobPickerField("csPrj","على ملف؟ (من بيان الأعمال)"))
    +'<div class="field"><label>البند</label><input id="csTitle" placeholder="مثلاً: رسوم جهاز المدينة"/></div>'
    +'<div class="field"><label>التصنيف</label><select id="csCat">'+catOpts+'</select></div>'
    +'<div class="field"><label>المبلغ (ج)</label><input id="csAmt" type="number" min="0" inputmode="numeric"/></div>'
    +'<div class="field"><label>تاريخ الصرف</label><input id="csDate" type="date" value="'+todayStr()+'"/></div>'
    +'<div class="row-actions"><button class="btn green" id="csGo">سجّل المصروف</button>'
    +'<button class="btn ghost" onclick="openFinance()">إلغاء</button></div>');
  addMicTo("csTitle");
  _pickRebind=()=>{ addMicTo("csTitle"); bindCs(); };
  function bindCs(){
  $("csGo").onclick=async()=>{
    const prj=$("csPrj").value||null, title=$("csTitle").value.trim(), amt=parseFloat($("csAmt").value);
    if(!title){ toast("اكتب البند","bad"); return; }
    if(!amt||amt<=0){ toast("اكتب المبلغ","bad"); return; }
    const btn=$("csGo"); btn.disabled=true; btn.textContent="بيسجّل…";
    const cat=await resolveCat("csCat","expense");
    const { data, error }=await sb.from("os_project_costs").insert({ project_id:prj, title,
      category:cat||readSelect("csCat"), amount:amt, spent_on:$("csDate").value||todayStr(), created_by:ME.id }).select("id,approved");
    if(error){
      const m=error.message||"";
      toast(m.includes('مقفلة')?'الفترة المالية مقفلة':("معرفناش نسجّل: "+m),"bad");
      btn.disabled=false; btn.textContent="سجّل المصروف"; return;
    }
    const _r=data&&data[0];
    if(_r&&_r.approved) afterMoney("payment",_r.id,prj?"المصروف اتسجّل على الملف \u2713":"المصروف العام اتسجّل \u2713",()=>openFinance());
    else { toast("اتسجّل — مستني اعتماد المالية \u2713","ok"); openFinance(); }
  };
  }
  bindCs();
}
/* ===== بينتهي قريب — تدرج 30/60/90 يوم (معيار عالمي) ===== */
async function openExpiring(){
  openSheet('<h3>بينتهي قريب</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">عقود، تراخيص، ومستندات — مرتّبة بالأولوية عشان تلحق تجدّدها في وقتها.</div><div id="expBox"><div class="skel"></div></div><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  try{
    const { data }=await sb.from("os_expiring_soon").select("*").order("days_left",{ascending:true});
    const rows=data||[];
    if(!rows.length){ $("expBox").innerHTML='<div class="empty">مفيش حاجة بتنتهي خلال 90 يوم — مطمّن.</div>'; return; }
    const KIND_LBL={document:"مستند",contract:"عقد عمل",probation:"فترة اختبار"};
    const canGov=isOwnerOps()||PROFILE.position==="gov";
    const card=(x)=>{
      const d=x.days_left!=null?x.days_left:Math.ceil((new Date(x.expires)-Date.now())/86400000);
      const badge=d<=7?"b-red":d<=30?"b-amber":"b-blue";
      const govBtn=(canGov&&x.kind==="document")?'<div class="row-actions" style="margin-top:8px"><button class="btn ghost sm" data-mkgov="'+esc(x.item)+'" data-days="'+d+'">حوّلها لمعاملة تجديد</button></div>':"";
      return '<div class="card flat"'+(d<=7?' style="border-right:4px solid var(--red)"':'')+'><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(x.item)+'</b><span class="badge '+badge+'">'+(d<=0?"انتهى!":"باقي "+d+" يوم")+'</span></div><div class="meta"><span>'+(KIND_LBL[x.kind]||esc(x.kind||""))+'</span>'+(x.dept&&DEPT_BY_KEY[x.dept]?'<span class="dot"></span><span>'+esc(DEPT_BY_KEY[x.dept].name)+'</span>':'')+'<span class="dot"></span><span>'+fmtDate(x.expires)+'</span></div>'+govBtn+'</div>';
    };
    const groups=[["urgent","خلال 30 يوم — لازم تتحرك دلوقتي","var(--red)"],["soon","خلال 60 يوم — جهّز نفسك","#B45309"],["watch","خلال 90 يوم — تحت النظر","var(--ink-soft)"]];
    let h="";
    groups.forEach(([key,label,color])=>{
      const g=rows.filter(r=>r.urgency===key);
      if(g.length) h+='<div class="sec-h" style="color:'+color+'">'+label+' ('+g.length+') <span class="ln"></span></div>'+g.map(card).join("");
    });
    $("expBox").innerHTML=h||rows.map(card).join("");
    $("expBox").querySelectorAll("[data-mkgov]").forEach(b=>b.onclick=async()=>{
      const item=b.dataset.mkgov, days=parseInt(b.dataset.days,10)||30;
      b.disabled=true; b.textContent="بينشئ…";
      const d=new Date(); d.setDate(d.getDate()+Math.max(7,Math.min(days,60)));
      const target=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const { error }=await sb.from("os_gov_cases").insert({
        title:"تجديد: "+item, case_type:"renewal", dept:PROFILE.dept||null,
        status:"new", progress:0, target_date:target,
        assigned_to:ME.id, assigned_to_name:PROFILE.name, created_by:ME.id, created_by_name:PROFILE.name,
        notes:"اتعملت أوتوماتيك من تنبيه الانتهاء — باقي "+days+" يوم"
      });
      if(error){ toast("معرفناش ننشئ: "+error.message,"bad"); b.disabled=false; b.textContent="حوّلها لمعاملة تجديد"; return; }
      toast("اتعملت معاملة تجديد ✓ — موعدها "+target,"ok");
      b.textContent="✓ اتعملت"; b.disabled=true;
    });
  }catch(e){ $("expBox").innerHTML=failBox("معرفناش نجيبها.",openExpiring); }
}

async function openApprovals(){
  openSheet('<h3>الموافقات</h3><div id="apBox"><div class="skel"></div></div>'
    +'<div class="sec-h">اطلب موافقة <span class="ln"></span></div>'
    +'<div class="field"><label>النوع</label><select id="apKind">'+APPROVAL_KINDS.map(k=>'<option value="'+k[0]+'">'+k[1]+'</option>').join("")+'</select></div>'
    +'<div class="field"><label>العنوان</label><input id="apTitle" placeholder="مثلًا: شراء طابعة للقسم"/></div>'
    +'<div class="field"><label>المبلغ (بالجنيه) *</label><input id="apAmt" type="number" inputmode="numeric" min="0" placeholder="مثلاً: 3500"/><div class="muted" id="apAmtHint" style="font-size:12px;display:none;margin-top:4px"></div></div>'
    +'<div class="field"><label>تفاصيل</label><textarea id="apDet" placeholder="ليه محتاجها؟"></textarea></div>'
    +'<div class="row-actions"><button class="btn green" id="apGo">ابعت للموافقة</button><button class="btn ghost" onclick="closeSheet()">قفل</button></div>');
  addMicTo("apDet");
  $("apAmt").oninput=()=>{
    const h=$("apAmtHint"); const v=parseFloat($("apAmt").value);
    if(!$("apAmt").value){ h.style.display="none"; return; }
    h.style.display="block";
    if(isNaN(v)||v<=0){ h.style.color="var(--red)"; h.textContent="المبلغ لازم يكون رقم موجب"; return; }
    h.style.color="var(--blue)";
    if(v<=5000) h.textContent=(PROFILE.role==="manager"||PROFILE.role==="owner")?"هيتوجّه للمدير المالي (مفيش موافقة ذاتية)":"هيتوجّه لمدير قسمك (ضمن حد المدير)";
    else if(v<=100000) h.textContent="هيتوجّه للمدير المالي (فوق 5,000ج)";
    else h.textContent="هيتوجّه للمالك مباشرة (فوق 100,000ج)";
  };
  $("apGo").onclick=async()=>{
    const title=$("apTitle").value.trim(); if(!title){ toast("اكتب عنوان","bad"); return; }
    const amtRaw=parseFloat($("apAmt").value);
    if(isNaN(amtRaw)||amtRaw<=0){ $("apAmt").style.borderColor="var(--red)"; toast("اكتب المبلغ — الموافقات هنا مالية. لو طلبك مش مالي ابعته من شاشة الطلبات","bad"); setTimeout(()=>$("apAmt").style.borderColor="",2500); return; }
    const amt=amtRaw;
    const { error }=await sb.from("os_approvals").insert({ kind:$("apKind").value, title, details:$("apDet").value.trim()||null, amount:amt, requester_id:ME.id, requester_name:PROFILE.name, status:"pending" });
    if(error){ toast("معرفناش نبعت: "+error.message,"bad"); return; }
    toast("اتبعتت للموافقة","ok"); paintApprovals();
    $("apTitle").value=""; $("apAmt").value=""; $("apDet").value="";
  };
  await paintApprovals();
}
async function paintApprovals(){
  try{
    let q=sb.from("os_approvals").select("*").order("created_at",{ascending:false}).limit(25);
    if(!isOwnerOps()) q=q.or("requester_id.eq."+ME.id+",approver_id.eq."+ME.id);
    const { data }=await q; const rows=data||[];
    if(!rows.length){ $("apBox").innerHTML='<div class="empty">مفيش طلبات موافقة لسه.</div>'; return; }
    const stb=(st)=> st==="approved"?'<span class="badge b-green">اتوافق \u2713</span>': st==="rejected"?'<span class="badge b-red">اترفض</span>':'<span class="badge b-amber">مستنية</span>';
    $("apBox").innerHTML=rows.map(a=>{
      const kn=(APPROVAL_KINDS.find(k=>k[0]===a.kind)||["","طلب"])[1];
      const canDecide=a.status==="pending"&&(isOwnerOps()||a.approver_id===ME.id);
      const atWho=a.status==="pending"?({manager:"عند المدير",finance:"عند المالي",owner:"عند المالك"})[a.approver_role]||null:null;
      return '<div class="card flat"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(a.title)+'</b>'+stb(a.status)+'</div>'
        +'<div class="meta"><span>'+esc(kn)+'</span><span class="dot"></span><span>'+esc(a.requester_name||"")+'</span>'+(a.amount?'<span class="dot"></span><span>'+Number(a.amount).toLocaleString("ar-EG")+' ج</span>':'')+(atWho?'<span class="dot"></span><span style="color:var(--blue);font-weight:800;font-size:11px">'+atWho+'</span>':'')+'<span class="dot"></span><span>'+relativeTime(a.created_at)+'</span></div>'
        +(a.decision_note?'<div class="muted" style="font-size:12px;margin-top:4px">'+esc(a.decision_note)+'</div>':'')
        +(canDecide?'<div class="row-actions" style="margin-top:8px"><button class="btn green sm" data-apok="'+a.id+'">وافق \u2713</button><button class="btn ghost sm" data-apno="'+a.id+'" style="color:var(--red)">ارفض</button></div>':'')
        +'</div>';
    }).join("");
    $("apBox").querySelectorAll("[data-apok]").forEach(b=>b.onclick=()=>decideApproval(b.dataset.apok,"approved"));
    $("apBox").querySelectorAll("[data-apno]").forEach(b=>b.onclick=()=>decideApproval(b.dataset.apno,"rejected"));
  }catch(e){ $("apBox").innerHTML=failBox("معرفناش نجيب الموافقات.",paintApprovals); }
}
async function decideApproval(id,st){
  const note=prompt(st==="approved"?"ملاحظة مع الموافقة؟ (اختياري)":"سبب الرفض؟")||null;
  const { error }=await sb.from("os_approvals").update({ status:st, decided_at:new Date().toISOString(), decision_note:note, approver_id:ME.id }).eq("id",id);
  if(error){ toast("معرفناش نسجل القرار: "+error.message,"bad"); return; }
  toast(st==="approved"?"اتوافق":"اترفض","ok"); paintApprovals();
}

async function openLeaves(){
  openSheet('<h3>الإجازات</h3><div id="lvBal" class="card flat" style="margin-bottom:10px"><div class="skel" style="height:20px"></div></div><div id="lvBox"><div class="skel"></div></div>'
    +'<div class="sec-h">اطلب إجازة <span class="ln"></span></div>'
    +'<div class="field"><label>النوع</label><select id="lvKind">'+LEAVE_KINDS.map(k=>'<option value="'+k[0]+'">'+k[1]+'</option>').join("")+'</select></div>'
    +'<div class="field"><label>من</label><input id="lvFrom" type="date" min="'+todayStr()+'"/></div>'
    +'<div class="field"><label>إلى</label><input id="lvTo" type="date" min="'+todayStr()+'"/></div>'
    +'<div class="row-actions" style="margin:-4px 0 8px"><button class="btn ghost sm" data-lvq="1">يوم</button><button class="btn ghost sm" data-lvq="3">3 أيام</button><button class="btn ghost sm" data-lvq="7">أسبوع</button></div>'
    +'<div id="lvCalc" class="muted" style="font-size:12.5px;margin-bottom:10px"></div>'
    +'<div class="field"><label>السبب (اختياري)</label><input id="lvWhy" placeholder=""/></div>'
    +'<div class="row-actions"><button class="btn green" id="lvGo">ابعت الطلب</button><button class="btn ghost" onclick="closeSheet()">قفل</button></div>');
  addMicTo("lvWhy"); allowCustom("lvKind","نوع إجازة تاني — اكتبه");
  let _lvBal=null;
  const lvCalc=()=>{
    const f=$("lvFrom").value, t=$("lvTo").value, box=$("lvCalc");
    if(!box) return;
    if(!f||!t){ box.innerHTML=""; return; }
    const days=Math.round((new Date(t)-new Date(f))/86400000)+1;
    if(days<1){ box.innerHTML='<span style="color:var(--red);font-weight:700">تاريخ النهاية قبل البداية</span>'; return; }
    const over=(_lvBal!=null&&days>_lvBal);
    box.innerHTML='<b style="color:'+(over?"var(--red)":"var(--green-d)")+'">'+days+' يوم</b>'
      +(_lvBal!=null?'<span class="muted"> — رصيدك '+_lvBal+' يوم'+(over?' (مش كفاية!)':' · هيتبقى '+(_lvBal-days))+'</span>':'');
  };
  $("lvFrom").onchange=()=>{ if($("lvTo").value&&$("lvTo").value<$("lvFrom").value) $("lvTo").value=$("lvFrom").value; $("lvTo").min=$("lvFrom").value||todayStr(); lvCalc(); };
  $("lvTo").onchange=lvCalc;
  document.querySelectorAll("[data-lvq]").forEach(b=>b.onclick=()=>{
    const n=parseInt(b.dataset.lvq,10);
    const from=$("lvFrom").value||todayStr();
    const d=new Date(from); d.setDate(d.getDate()+n-1);
    $("lvFrom").value=from;
    $("lvTo").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    lvCalc();
  });
  (async()=>{ try{
    const { data }=await sb.from("os_profiles").select("leave_balance").eq("id",ME.id).single();
    const bal=(data&&data.leave_balance!=null)?data.leave_balance:"\u2014";
    _lvBal=(data&&data.leave_balance!=null)?data.leave_balance:null;
    $("lvBal").innerHTML='<b>رصيدك: '+bal+' يوم</b><span class="muted" style="font-size:11.5px"> — بيتخصم أوتوماتيك مع كل موافقة</span>';
    lvCalc();
  }catch(e){ $("lvBal").innerHTML=""; } })();
  $("lvGo").onclick=async()=>{
    const f=$("lvFrom").value, t=$("lvTo").value;
    if(!f||!t){ toast("حدد التواريخ","bad"); return; }
    const days=Math.round((new Date(t)-new Date(f))/86400000)+1;
    if(days<1){ toast("التواريخ مش مظبوطة","bad"); return; }
    try{
      const { data:bp }=await sb.from("os_profiles").select("leave_balance").eq("id",ME.id).single();
      const bal=(bp&&bp.leave_balance!=null)?bp.leave_balance:21;
      if(days>bal){ toast("رصيدك "+bal+" يوم بس وطلبت "+days+"","bad"); return; }
    }catch(e){}
    const { error }=await sb.from("os_leaves").insert({ user_id:ME.id, user_name:PROFILE.name, dept:PROFILE.dept||null, kind:readSelect("lvKind"), from_date:f, to_date:t, days, reason:$("lvWhy").value.trim()||null, status:"pending" });
    if(error){ toast("معرفناش نبعت: "+error.message,"bad"); return; }
    toast("اتبعت — في انتظار الاعتماد","ok"); paintLeaves();
  };
  await paintLeaves();
}

  try{

    if(PROFILE.role==="employee") q=q.eq("user_id",ME.id);

    $("lvBox").innerHTML=rows.map(l=>{

        +(canDecide?'<div class="row-actions" style="margin-top:8px"><button class="btn green sm" data-lvok="'+l.id+'">اعتمد \u2713</button><button class="btn ghost sm" data-lvno="'+l.id+'" style="color:var(--red)">ارفض</button></div>':'')
        +'</div>';

    $("lvBox").querySelectorAll("[data-lvok]").forEach(b=>b.onclick=()=>decideLeave(b.dataset.lvok,"approved"));
    $("lvBox").querySelectorAll("[data-lvno]").forEach(b=>b.onclick=()=>decideLeave(b.dataset.lvno,"rejected"));
  }catch(e){ $("lvBox").innerHTML=failBox("معرفناش نجيب الإجازات.",paintLeaves); }

async function decideLeave(id,st){
  const { error }=await sb.from("os_leaves").update({ status:st, decided_by:ME.id, decided_at:new Date().toISOString() }).eq("id",id);
  if(error){ toast("معرفناش نسجل: "+error.message,"bad"); return; }

}

async function openDocsVault(){
  openSheet('<h3>خزنة المستندات</h3>'
    +'<div class="field" style="margin-bottom:8px"><input id="dvSearch" placeholder="دوّر باسم المستند…" value="'+esc(_dvSearch)+'"/></div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="dvFilters"><button class="chip on" data-df="all">الكل</button><button class="chip" data-df="contract">عقود</button><button class="chip" data-df="license">تراخيص</button><button class="chip" data-df="expiring">بتنتهي</button><button class="chip" data-df="locked">مقفولة</button><button class="chip" data-df="mine">بتاعتي</button></div>'
    +'<div id="dvBox"><div class="skel"></div></div>'
    +((canWrite()||PROFILE.dept==="reception")?'<div class="sec-h">ضيف مستند <span class="ln"></span></div>'
    +'<div class="field"><label>الاسم</label><input id="dvTitle" placeholder="مثلًا: رخصة فيلا زايد — نسخة نهائية"/></div>'
    +'<div class="field"><label>نوع المستند</label><select id="dvKind"><option value="general">عام</option><option value="contract">عقد</option><option value="license">ترخيص</option><option value="letter">خطاب رسمي</option><option value="report">تقرير</option></select></div>'
    +'<div class="field"><label>القسم</label><select id="dvDept"><option value="">— عام —</option>'+DEPTS.map(d=>'<option value="'+d.key+'">'+esc(d.name)+'</option>').join("")+'</select></div>'
    +'<div class="field"><label>ارفع ملف (PDF أو صورة — أقصى 20 ميجا)</label><input id="dvFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" style="font-size:12px"/><div id="dvUpStatus" class="muted" style="font-size:11px;margin-top:4px"></div></div>'
    +'<div class="field"><label>أو اكتب لينك جاهز (Drive…)</label><input id="dvUrl" placeholder="https://…"/></div>'
    +'<div class="field"><label>تاريخ الانتهاء (لو ليه صلاحية)</label><input id="dvExp" type="date"/></div>'
    +'<div class="row-actions"><button class="btn green" id="dvGo">احفظ المستند</button><button class="btn ghost" onclick="closeSheet()">قفل</button></div>':'<button class="btn ghost" onclick="closeSheet()">قفل</button>'));
  $("dvSearch").addEventListener("input",(e)=>{ _dvSearch=e.target.value; paintDocs(); });
  $("dvFilters").querySelectorAll("[data-df]").forEach(b=>b.onclick=()=>{ _dvFilter=b.dataset.df; $("dvFilters").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); paintDocs(); });
  const go=$("dvGo");
  if(go) go.onclick=async()=>{
    const title=$("dvTitle").value.trim(); if(!title){ toast("اكتب اسم المستند","bad"); return; }
    let url=$("dvUrl").value.trim()||null;
    const fileEl=$("dvFile");
    if(fileEl&&fileEl.files&&fileEl.files[0]){
      const f=fileEl.files[0];
      if(f.size>20*1048576){ toast("الملف أكبر من 20 ميجا","bad"); return; }
      $("dvUpStatus").textContent="بيترفع…"; go.disabled=true;
      try{
        const fd=new FormData(); fd.append("file",f,f.name);
        const r=await fetch(SUPABASE_URL+"/functions/v1/lead-upload",{ method:"POST", body:fd, headers:{ "Authorization":"Bearer "+SUPABASE_KEY } });
        const j=await r.json();
        if(!r.ok||!j.ok) throw new Error(j.error||"فشل الرفع");
        url=j.url; $("dvUpStatus").textContent="اترفع";
      }catch(e){ $("dvUpStatus").textContent=""+(e.message||"فشل الرفع"); toast("معرفناش نرفع الملف","bad"); go.disabled=false; return; }
    }
    const dvKind=$("dvKind")?$("dvKind").value:"general";
    if((dvKind==="contract"||dvKind==="license")&&!$("dvExp").value){
      if(!confirm((dvKind==="contract"?"العقد":"الترخيص")+" من غير تاريخ انتهاء — مراقب الانتهاء مش هيقدر ينبّهك عليه. تكمل من غيره؟")) return;
    }
    const { error }=await sb.from("os_documents").insert({ title, kind:dvKind, dept:$("dvDept")?($("dvDept").value||null):(PROFILE.dept||null), file_url:url, expires_at:$("dvExp").value||null, added_by:ME.id });
    if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); go.disabled=false; return; }
    track("action","doc_add");
    toast("المستند اتحفظ","ok"); paintDocs();
    $("dvTitle").value=""; $("dvUrl").value=""; if(fileEl) fileEl.value=""; $("dvUpStatus").textContent=""; go.disabled=false;
  };
  await paintDocs();
}
async function paintDocs(){
  try{
    const { data }=await sb.from("os_documents").select("*").order("created_at",{ascending:false}).limit(80);
    let rows=data||[];
    const soon=Date.now()+30*86400000;
    // فلاتر
    if(_dvSearch.trim()){ const q=_dvSearch.trim(); rows=rows.filter(d=>(d.title||"").includes(q)); }
    if(_dvFilter==="expiring") rows=rows.filter(d=>d.expires_at&&new Date(d.expires_at).getTime()<soon);
    else if(_dvFilter==="locked") rows=rows.filter(d=>d.locked);
    else if(_dvFilter==="mine") rows=rows.filter(d=>d.added_by===ME.id);
    else if(_dvFilter==="contract"||_dvFilter==="license") rows=rows.filter(d=>d.kind===_dvFilter);
    if(!rows.length){ $("dvBox").innerHTML='<div class="empty">'+(_dvSearch||_dvFilter!=="all"?"مفيش مستندات بالفلتر ده.":"الخزنة فاضية لسه.")+'</div>'; return; }
    const KIND_BADGE={contract:["عقد","b-green"],license:["ترخيص","b-amber"],letter:["خطاب","b-blue"],report:["تقرير","b-grey"]};
    $("dvBox").innerHTML=rows.map(d=>{
      const exp=d.expires_at?new Date(d.expires_at).getTime():null;
      const win=(d.kind==="license"||d.kind==="contract")?60:30;
      const danger=exp&&exp<Date.now()+win*86400000;
      const daysLeft=exp?Math.ceil((exp-Date.now())/86400000):null;
      const expTxt= exp? (daysLeft<=0?"انتهى!":daysLeft<=win?"باقي "+daysLeft+" يوم":"تنتهي "+fmtDate(d.expires_at)) : "";
      const kb=KIND_BADGE[d.kind];
      return '<div class="card flat" data-doc="'+d.id+'"'+(danger?' style="border-right:4px solid var(--red);background:#FFF8F8"':'')+'><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(d.title)+'</b>'+(kb?'<span class="badge '+kb[1]+'">'+kb[0]+'</span>':'')+(d.locked?'<span class="badge b-grey">مقفول</span>':'')+'</div>'
        +'<div class="meta">'+(d.dept&&DEPT_BY_KEY[d.dept]?'<span>'+esc(DEPT_BY_KEY[d.dept].name)+'</span><span class="dot"></span>':'')+'<span>v'+(d.version||1)+'</span>'+(expTxt?'<span class="dot"></span><span'+(danger?' style="color:var(--red);font-weight:800"':'')+'>'+expTxt+'</span>':'')+'</div>'
        +'<div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap">'
        +(d.file_url?'<a href="'+esc(d.file_url)+'" target="_blank" class="lnk" style="font-size:12px">افتح</a><button class="lnk" data-dcopy="'+esc(d.file_url)+'" style="font-size:12px">انسخ اللينك</button>':'<span class="muted" style="font-size:11px">مفيش ملف مرفوع</span>')
        +(canWrite()&&!d.locked?'<button class="lnk" data-dlock="'+d.id+'" style="font-size:12px;color:var(--red)">قفل نهائي</button>':'')
        +'</div></div>';
    }).join("");
    // نسخ لينك
    $("dvBox").querySelectorAll("[data-dcopy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.dcopy); toast("اتنسخ","ok"); }catch(e){ toast("معرفناش ننسخ","bad"); } });
    // قفل نهائي
    $("dvBox").querySelectorAll("[data-dlock]").forEach(b=>b.onclick=async()=>{
      if(!confirm("قفل المستند نهائيًا؟ بعد القفل مفيش حد يقدر يعدّله أو يمسحه — حتى الإدارة.")) return;
      const { error }=await sb.from("os_documents").update({ locked:true }).eq("id",b.dataset.dlock);
      if(error){ toast("معرفناش نقفل: "+error.message,"bad"); return; }
      track("action","doc_lock"); toast("اتقفل نهائي","ok"); paintDocs();
    });
  }catch(e){ $("dvBox").innerHTML=failBox("معرفناش نجيب المستندات.",paintDocs); }
}

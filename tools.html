<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>بيت الخبرة — أدوات المنظومة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --green:#4CAF50; --green-d:#2E7D32; --green-l:#E8F5E9;
  --blue:#1E88E5; --blue-d:#0D47A1; --blue-l:#E7F0FB;
  --red:#E53935; --red-l:#FDECEA;
  --amber:#F59E0B;
  --ink:#16263a; --muted:#6b7a8d; --line:#e6edf4;
  --bg:#f4f8fc; --card:#ffffff; --soft:#eef4fa;
  --shadow:0 1px 2px rgba(13,71,161,.05), 0 10px 30px rgba(13,71,161,.07);
  --shadow-sm:0 1px 2px rgba(13,71,161,.06);
  --r:18px; --r-sm:12px;
  --font:'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --tabh:72px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--font); background:var(--bg); color:var(--ink); line-height:1.65; font-size:15px; overflow-x:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
a{color:var(--blue-d);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cfdcea;border-radius:8px;}

/* ---- blueprint accent (signature, subtle) ---- */
.grid-accent{
  position:fixed; inset:0 0 auto 0; height:220px; z-index:0; pointer-events:none; opacity:.55;
  background-image:linear-gradient(rgba(30,136,229,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(30,136,229,.06) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:linear-gradient(#000,transparent); mask-image:linear-gradient(#000,transparent);
}

/* ---- boot / error ---- */
#boot{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);padding:24px;text-align:center;}
#boot .sp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- login ---- */
#login{min-height:100dvh;display:none;align-items:center;justify-content:center;padding:22px;position:relative;z-index:1;}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;}
.login-head{padding:30px 24px 18px;text-align:center;background:linear-gradient(180deg,#fff,#f7fbff);}
.login-head .logo{width:84px;height:84px;border-radius:20px;object-fit:contain;background:#fff;padding:8px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.login-head h1{font-size:21px;font-weight:800;color:var(--blue-d);}
.login-head p{font-size:12px;letter-spacing:.5px;color:var(--green-d);font-weight:700;margin-top:3px;}
.login-body{padding:22px 22px 26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:var(--r-sm);outline:none;background:#fff;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:84px;line-height:1.7;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--r-sm);font-weight:800;font-size:15.5px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 8px 20px rgba(30,136,229,.28);transition:transform .1s,opacity .15s;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.55;}
.btn.green{background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 8px 20px rgba(76,175,80,.28);}
.btn.ghost{background:var(--soft);color:var(--blue-d);box-shadow:none;}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:10px;}
.btn.danger{background:linear-gradient(135deg,#ef5350,var(--red));box-shadow:0 8px 20px rgba(229,57,53,.25);}
.err{background:var(--red-l);color:var(--red);font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none;}

/* ---- app shell ---- */
#app{display:none;min-height:100dvh;position:relative;z-index:1;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar .logo{width:40px;height:40px;border-radius:11px;object-fit:contain;background:#fff;padding:4px;box-shadow:var(--shadow-sm);}
.topbar .ttl{font-weight:800;font-size:16px;color:var(--blue-d);line-height:1.15;}
.topbar .ttl small{display:block;font-size:11px;font-weight:600;color:var(--muted);}
.topbar .sp{flex:1;}
.uchip{display:flex;align-items:center;gap:8px;}
.uchip .nm{font-size:12.5px;font-weight:700;text-align:left;line-height:1.2;}
.uchip .rl{font-size:11px;color:var(--muted);}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--blue-d);}

.wrap{max-width:760px;margin:0 auto;padding:16px 14px 26px;}
.view{display:none;animation:rise .25s ease both;}
.view.active{display:block;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 16px;}
.page-h h2{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
.page-h .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}

.sec-h{display:flex;align-items:center;gap:8px;margin:24px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--muted);}
.sec-h .ln{flex:1;height:1px;background:var(--line);}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:15px;margin-bottom:11px;}
.card.flat{box-shadow:none;}
.req-top{display:flex;align-items:flex-start;gap:9px;}
.req-top .t{flex:1;font-weight:800;font-size:15px;line-height:1.4;}
.muted{color:var(--muted);font-size:13px;}
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);}
.dot{width:3px;height:3px;border-radius:50%;background:#c4d1df;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.b-blue{background:var(--blue-l);color:var(--blue-d);}
.b-green{background:var(--green-l);color:var(--green-d);}
.b-amber{background:#FEF3E2;color:#B45309;}
.b-red{background:var(--red-l);color:var(--red);}
.b-grey{background:var(--soft);color:var(--muted);}

.resp-box{margin-top:11px;background:var(--green-l);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--green-d);white-space:pre-wrap;}
.row-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}

.empty{text-align:center;color:var(--muted);padding:30px 16px;}
.empty .big{font-size:30px;margin-bottom:6px;}

/* tasks */
.prog{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:10px;}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));border-radius:999px;transition:width .4s;}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chips .chip{flex:0 0 auto;white-space:nowrap;}
#v-chat .composer{position:fixed;right:12px;left:12px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 6px);z-index:60;margin-top:0;box-shadow:0 -2px 18px rgba(15,23,42,.10);}
#v-chat{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 84px);}
.chip{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--soft);color:var(--muted);}
.chip.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;}
.dept-chip{transition:transform .08s ease,background .15s ease,border-color .15s ease;}
.dept-chip:active{transform:scale(.96);background:var(--blue-l);border-color:var(--blue);}
.dept-chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.qbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.qbtn{padding:7px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px;color:var(--blue-d);}
.qbtn.on{background:var(--blue);color:#fff;}

/* contract / voice */
.banner{display:flex;gap:9px;align-items:flex-start;background:#FEF3E2;border:1px solid #FCD9A1;color:#92500c;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:14px;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 14px;}
.mic{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 12px 30px rgba(30,136,229,.32);transition:transform .12s;}
.mic:active{transform:scale(.96);}
.mic.rec{background:linear-gradient(135deg,#ef5350,var(--red));box-shadow:0 0 0 0 rgba(229,57,53,.5);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.45);}70%{box-shadow:0 0 0 18px rgba(229,57,53,0);}100%{box-shadow:0 0 0 0 rgba(229,57,53,0);}}
.mic-hint{font-size:13px;color:var(--muted);font-weight:600;}
.contract-out{white-space:pre-wrap;background:#fff;border:1px dashed #b9c9da;border-radius:14px;padding:16px;font-size:13.5px;line-height:1.9;margin-top:6px;}

/* ask / chat */
.chat{display:flex;flex-direction:column;gap:13px;min-height:42vh;padding:6px 2px 8px;}
#chBox{padding-bottom:84px;overflow-y:auto;}
#chBox .msg .lnk{color:var(--muted);font-weight:600;opacity:.78;}
#chBox .msg.me .lnk{color:rgba(255,255,255,.85);}
#chBox .msg .lnk:active{opacity:1;}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--shadow-sm);}
.msg.ai{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:5px;}
.msg.me{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;align-self:flex-end;border-bottom-left-radius:5px;}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;font-weight:700;box-shadow:none;text-align:center;max-width:100%;}
.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bd 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes bd{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}
.msg.ai.warn{background:#FFFBF0;border-color:#F3D9A4;}
.warn-tag{font-size:11.5px;font-weight:800;color:#92500c;margin-bottom:6px;}
.deep-tg{padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:var(--soft);color:var(--muted);}
.deep-tg.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 6px 14px rgba(30,136,229,.25);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;box-shadow:var(--shadow-sm);}
.stat{transition:transform .1s ease,box-shadow .15s ease;}
.stat:active{transform:scale(.97);}
.tabbar .tab{transition:opacity .1s ease;}
.tabbar .tab:active{opacity:.55;}
.btn:focus-visible,.btn.sm:focus-visible,.stat:focus-visible,.chip:focus-visible,.dept-chip:focus-visible,.card[data-go]:focus-visible,.card[data-task]:focus-visible,.card[data-dept]:focus-visible,.tabbar .tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;}}
.stat .n{font-size:24px;font-weight:900;color:var(--blue-d);line-height:1.2;}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;}
.dept-card{display:flex;align-items:center;gap:11px;}
button.stat,button.dept-card{font-family:inherit;cursor:pointer;}
.stat-hot{border-color:#FBCFE8;background:linear-gradient(135deg,#FFF1F2,#fff);}
.stat-hot .n{color:var(--red);}
.lnk{background:none;border:none;color:var(--blue-d);font-weight:700;cursor:pointer;padding:0;font-family:inherit;}
/* آيفون: منع الزوم التلقائي عند الكتابة + احترام منطقة الهوم بار */
@media (max-width:640px){ input,textarea,select{ font-size:16px !important; } }
#tabbar{ padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
/* مؤشر "بيفكر" — نقط متحركة */
.thinking-dots{ display:inline-flex; gap:4px; align-items:center; }
.thinking-dots i{ width:7px;height:7px;border-radius:50%;background:var(--blue);animation:tdots 1.2s infinite; }
.thinking-dots i:nth-child(2){ animation-delay:.2s } .thinking-dots i:nth-child(3){ animation-delay:.4s }
@keyframes tdots{ 0%,80%,100%{opacity:.25;transform:scale(.85)} 40%{opacity:1;transform:scale(1.1)} }
/* offline / error banners */
#offlineBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;}
/* loading skeleton */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:10px;height:56px;margin-bottom:10px;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* unread chat badge */
.chat-badge{display:none;position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:900;align-items:center;justify-content:center;}
.chat-badge.on{display:flex;}
/* confirm dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8888;display:flex;align-items:center;justify-content:center;}
.confirm-box{background:#fff;border-radius:20px;padding:28px 22px;max-width:320px;width:90%;text-align:center;}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px;background:rgba(244,248,252,.95);backdrop-filter:blur(8px);border-radius:16px;border:1px solid var(--line);margin-top:8px;}
.composer input{flex:1;padding:12px 14px;border:1.6px solid var(--line);border-radius:999px;outline:none;background:#fff;}
.composer input:focus{border-color:var(--blue);}
.composer .send{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(76,175,80,.3);}
.composer .send:disabled{opacity:.5;}
.composer .send.sendmsg{background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 6px 16px rgba(30,136,229,.32);}
.composer .send.sendmsg:active{transform:scale(.93);}
.composer .send.sendmsg svg{margin-right:-2px;}
.composer .send.mic-sec{width:42px;height:42px;background:#EAF2FB;color:var(--blue);box-shadow:none;border:1.5px solid #CFE2F7;}
.composer .send.mic-sec.on{background:linear-gradient(135deg,#ef5350,var(--red));color:#fff;border-color:transparent;}
.msg-more{display:none;gap:14px;align-items:center;margin-top:7px;flex-wrap:wrap;}
.msg-more.open{display:flex;}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;position:relative;}
.tabbar .tab .ic{font-size:21px;line-height:1;}
.tabbar .tab.on{color:var(--blue-d);}
.tabbar .tab.on .ic{transform:translateY(-1px);}
.tabbar .tab .nbadge{position:absolute;top:9px;inset-inline-end:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(13,38,58,.45);backdrop-filter:blur(3px);}
.modal.open{display:flex;animation:fade .2s both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1) both;}
.sheet > .row-actions:last-child{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-bottom:calc(-20px - env(safe-area-inset-bottom));box-shadow:0 -10px 20px -12px rgba(0,0,0,.18);z-index:5;}
@keyframes up{from{transform:translateY(40px);}to{transform:none;}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--blue-d);}
.sheet .x{position:absolute;}
.fab{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);inset-inline-start:18px;z-index:25;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(76,175,80,.4);}

/* toast */
.toast{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green-d);} .toast.bad{background:var(--red);}

.note-line{font-size:12px;color:var(--amber);font-weight:700;margin-top:8px;}
</style>
</head>
<body>
  <div id="offlineBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;">انقطع الاتصال — بنحاول نرجع...</div>
<div class="grid-accent"></div>

<!-- BOOT -->
<div id="boot"><div class="sp"></div><div>بيحمّل المنظومة…</div></div>

<!-- LOGIN -->
<section id="login">

async function boot(){
  var _bootSafety = setTimeout(function(){ try{ var b=$("boot"), a=$("app"); if(b && b.style.display!=="none" && (!a || a.style.display!=="block")){ showLogin(); } }catch(_e){} }, 12000);
  if(!window.supabase || !window.supabase.createClient){
    clearTimeout(_bootSafety);
    $("boot").innerHTML='<div style="color:var(--red);font-weight:700">معرفناش نحمّل مكتبة Supabase. اتأكد إن النت شغّال وجرّب تاني.</div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ storage:safeStorage, persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });
  let session=null;
  try{ const r=await Promise.race([ sb.auth.getSession(), new Promise(function(res){ setTimeout(function(){ res({data:{session:null}}); },5000); }) ]); session=r.data.session; }catch(e){}
  try{
    if(session && session.user){ await startApp(session.user); }
    else{ showLogin(); }
  }catch(_e){ showLogin(); }
  clearTimeout(_bootSafety);
}
function showLogin(){ $("boot").style.display="none"; $("app").style.display="none"; $("login").style.display="flex"; }

async function doLogin(){
  const email=$("inEmail").value.trim(), pass=$("inPass").value;
  const e=$("loginErr"); e.style.display="none";
  if(!email||!pass){ e.textContent="اكتب الإيميل والباسوورد."; e.style.display="block"; return; }
  const btn=$("btnLogin"); btn.disabled=true; btn.textContent="بيدخل…";
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error){ throw error; }
    await startApp(data.user);
  }catch(err){
    e.textContent = "الإيميل أو الباسوورد غلط."; e.style.display="block";
    btn.disabled=false; btn.textContent="دخول";
  }
}

async function startApp(user){
  ME=user;
  // load profile + lookups
  try{
    const [{data:prof}, {data:profs}, {data:depts}] = await Promise.race([
      Promise.all([
        sb.from("os_profiles").select("*").eq("id",user.id).maybeSingle(),
        sb.from("os_profiles").select("id,name,email,role,dept,manager_id,position"),
        sb.from("os_departments").select("*").order("sort_order",{ascending:true}).order("name"),
      ]),
      new Promise(function(res){ setTimeout(function(){ res([{data:null},{data:null},{data:null}]); },6000); })
    ]);
    PROFILE = prof || { id:user.id, name:(user.email||"مستخدم").split("@")[0], role:"employee", dept:null, email:user.email };
    PROFILES = profs || [];
    BY_ID={}; PROFILES.forEach(p=>BY_ID[p.id]=p);
    const _allDepts = depts || [];
    DEPT_BY_KEY={}; _allDepts.forEach(d=>DEPT_BY_KEY[d.key]=d);
    DEPTS = _allDepts.filter(d=> d.sort_order==null || d.sort_order < 900);
  }catch(e){
    PROFILE = { id:user.id, name:(user.email||"مستخدم").split("@")[0], role:"employee", dept:null };
  }
  $("boot").style.display="none"; $("login").style.display="none"; $("app").style.display="block";
  $("uName").textContent=PROFILE.name;
  $("uRole").textContent=userTitle(PROFILE);

  av.style.cursor="pointer"; av.title="حسابي"; av.onclick=openMyAccount;
  const nb=$("notifBell"); if(nb) nb.onclick=()=>{ askNotifPermission(); openNotifications(); };
  const gs=$("globalSearchBtn"); if(gs) gs.onclick=()=>openGlobalSearch();
  refreshNotifBadge();
  const col={owner:"#0D47A1",ops:"#1E88E5",manager:"#2E7D32",employee:"#6b7a8d"}[PROFILE.role]||"#1E88E5";
  av.style.background="linear-gradient(135deg,"+col+","+col+"cc)";
  buildTabs();
  switchTab("home");
  subscribeRealtime();
  initOfflineDetect(); initPullRefresh();
  let _lastErrT=0;
  window.addEventListener("unhandledrejection",(e)=>{
    try{
      const now=Date.now(); if(now-_lastErrT<8000) return; _lastErrT=now;
      const msg=String((e&&e.reason&&e.reason.message)||"");
      try{ track("error","unhandled:"+msg.slice(0,60)); }catch(ex){}
      if(msg.indexOf("Failed to fetch")>=0||msg.indexOf("NetworkError")>=0||msg.indexOf("Load failed")>=0){ toast("النت متقلقل — هنعيد المحاولة لوحدنا","bad"); }
    }catch(x){}
  });
  /* تحديث تلقائي هادي للرئيسية كل 90 ثانية */
  setInterval(()=>{ if(activeTab==="home" && !document.hidden && !sRecOn && !recording) renderHome(); },90000);
  // session watch: every 10 min check session is still valid
  _sessionWatchId=setInterval(async()=>{ try{ const r=await sb.auth.getSession(); if(!r.data.session){ clearInterval(_sessionWatchId); toast("انتهت الجلسة — سجّل دخول تاني","bad"); setTimeout(()=>location.reload(),2500); } }catch(e){} },600000);
}

async function askAI(opts){

  if(error) throw new Error(error.message||"AI error");

    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t||"").replace(/[#*_>]/g," ").replace(/[.،؛]/g," ، "));
    u.lang="ar-EG"; u.rate=0.88; u.pitch=1.05; u.volume=1;

    if(arVoice) u.voice=arVoice;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("القراءة الصوتية مش متاحة","bad"); }
}

function relTime(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date(), diff=(d-now)/86400000;
  if(diff<0) return "(فات)";
  if(diff<1 && d.getDate()===now.getDate()) return "النهارده "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  if(diff<2) return "بكرة "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
}
function relativeTime(iso){
  if(!iso) return "";
  const sec=(Date.now()-new Date(iso).getTime())/1000;
  if(sec<0) return relTime(iso);
  if(sec<60) return "دلوقتي";
  if(sec<3600) return "من "+Math.max(1,Math.floor(sec/60))+" دقيقة";
  if(sec<86400) return "من "+Math.floor(sec/3600)+" ساعة";
  const d=new Date(iso), y=new Date(Date.now()-86400000);
  if(d.getDate()===y.getDate()&&d.getMonth()===y.getMonth()&&d.getFullYear()===y.getFullYear())
    return "أمس "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  return "من "+Math.floor(sec/86400)+" يوم";
}

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function timeStr(iso){ return iso?new Date(iso).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):""; }
async function paintAttendance(){
  const box=$("attWidget"); if(!box) return;

    const { data }=await sb.from("os_attendance").select("*").eq("user_id",ME.id).eq("work_date",todayStr()).maybeSingle();
    if(!data){
      box.innerHTML='<div class="card flat" style="background:linear-gradient(135deg,#E3F2FD,#E8F5E9);border:none;text-align:center"><b style="font-size:13px">لسه ما سجّلتش حضورك النهارده</b><button class="btn green sm" id="attIn" style="margin-top:8px;width:100%">سجّل حضورك دلوقتي</button></div>';
      const b=$("attIn"); if(b) b.onclick=async()=>{ b.disabled=true; b.textContent="بيسجّل…";
        const { error }=await sb.from("os_attendance").upsert({ user_id:ME.id, user_name:PROFILE.name, dept:PROFILE.dept||null, work_date:todayStr(), check_in:new Date().toISOString() },{onConflict:"user_id,work_date"});
        if(error){ toast("معرفناش نسجّل: "+error.message,"bad"); b.disabled=false; b.textContent="سجّل حضورك دلوقتي"; return; }
        toast("اتسجّل حضورك ✓","ok"); paintAttendance();
      };
    } else if(!data.check_out){
      box.innerHTML='<div class="card flat" style="background:#F1F8F2;border-color:#A5D6A7;text-align:center"><b style="font-size:13px">✅ حضرت الساعة '+timeStr(data.check_in)+'</b><button class="btn ghost sm" id="attOut" style="margin-top:8px;width:100%">سجّل انصرافك</button></div>';
      const b=$("attOut"); if(b) b.onclick=async()=>{ b.disabled=true; b.textContent="بيسجّل…";
        const { error }=await sb.from("os_attendance").update({ check_out:new Date().toISOString() }).eq("user_id",ME.id).eq("work_date",todayStr());
        if(error){ toast("معرفناش نسجّل: "+error.message,"bad"); b.disabled=false; b.textContent="سجّل انصرافك"; return; }
        toast("اتسجّل انصرافك ✓ يوم سعيد","ok"); paintAttendance();
      };
    } else {
      box.innerHTML='<div class="card flat" style="background:#F4F9FF;text-align:center"><b style="font-size:13px">تمام لدلوقتي — حضرت '+timeStr(data.check_in)+' وانصرفت '+timeStr(data.check_out)+'</b></div>';
    }
  }catch(e){ box.innerHTML=""; }
}
async function openAttendanceLog(){
  const isReception=PROFILE.dept==="reception";
  if(!["owner","ops","manager"].includes(PROFILE.role)&&!isReception){ toast("الشاشة دي للإدارة بس","bad"); return; }
  openSheet('<h3>سجل الحضور — النهاردة</h3><div id="attLogBox"><div class="skel"></div><div class="skel"></div></div><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  try{
    const wide=isOwnerOps()||isReception;
    const scope=wide?PROFILES:PROFILES.filter(p=>p.dept===PROFILE.dept);
    const { data }=await sb.from("os_attendance").select("*").eq("work_date",todayStr());
    const byUser={}; (data||[]).forEach(r=>byUser[r.user_id]=r);

      +(wide?'<div class="muted" style="font-size:11px;margin-top:2px">'+esc((DEPT_BY_KEY[o.p.dept]&&DEPT_BY_KEY[o.p.dept].name)||o.p.dept||"—")+'</div>':'')+'</div>';
    let h='<div class="card flat" style="background:linear-gradient(135deg,#E8F5E9,#E3F2FD);border:none;margin-bottom:10px"><div style="display:flex;gap:14px;text-align:center">'
      +'<div style="flex:1"><b style="font-size:19px;color:var(--green-d)">'+inNow.length+'</b><div class="muted" style="font-size:11px">موجود دلوقتي</div></div>'

    if(leftNow.length) h+='<div class="sec-h">انصرفوا <span class="ln"></span></div>'+leftNow.map(o=>card(o,'<span class="badge b-blue">'+timeStr(o.r.check_out)+'</span>')).join("");

  }catch(e){ $("attLogBox").innerHTML=failBox("معرفناش نجيب السجل.",openAttendanceLog); }

async function openCallLog(){
  const deptOpts=DEPTS.map(d=>'<option value="'+d.key+'">'+esc(d.name)+'</option>').join("");
  openSheet('<h3>تسجيل مكالمة</h3>'
    +'<div class="field"><label>اسم المتصل</label><input id="clName" placeholder="اسم المتصل"/></div>'
    +'<div class="field"><label>رقم التليفون</label><input id="clPhone" type="tel" placeholder="01xxxxxxxxx"/></div>'
    +'<div class="field"><label>سبب الاتصال</label><textarea id="clReason" placeholder="اكتب أو سجّل بصوتك…"></textarea></div>'
    +'<div class="row-actions" style="margin:-6px 0 12px"><button class="btn ghost sm" id="clMic">سجّل بصوتك</button><button class="btn sm" id="clSuggest" style="background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff">🧠 اقترح القسم</button></div>'
    +'<div class="field"><label>موجّهة لأي قسم؟</label><select id="clDept"><option value="">بدون تحديد</option>'+deptOpts+'</select></div>'
    +'<div class="row-actions"><button class="btn green" id="clGo">سجّل المكالمة ✓</button><button class="btn ghost" onclick="closeSheet()">إلغاء</button></div>'
    +'<div class="sec-h" style="margin-top:16px">آخر المكالمات <span class="ln"></span></div>'
    +'<div id="clBox"><div class="skel"></div></div>');
  addMicTo("clName"); bindSheetMic("clMic","clReason");
  $("clSuggest").onclick=async()=>{
    const reason=$("clReason").value.trim();
    if(!reason){ toast("اكتب سبب الاتصال الأول","bad"); return; }
    const btn=$("clSuggest"); btn.disabled=true; btn.textContent="بيفكّر…";
    try{
      const names=DEPTS.map(d=>d.key+":"+d.name).join("، ");
      const prompt=`مكتب استشارات هندسية مصري. متصل قال السبب ده: "${reason}". أنهي قسم من القايمة دي الأنسب يستلم المكالمة؟ القايمة: ${names}. رجّع الـkey بس من غير أي شرح، مثال: engineering`;
      const res=await askAI({prompt,dept:null,mode:"fast",max_tokens:20});
      const key=res.trim().replace(/[^a-z_]/g,"");
      if(DEPT_BY_KEY[key]){ $("clDept").value=key; toast("اقترحنا: "+DEPT_BY_KEY[key].name,"ok"); }
      else toast("معرفناش نحدد — اختار بنفسك","bad");
    }catch(e){ toast("معرفناش نقترح دلوقتي","bad"); }
    btn.disabled=false; btn.textContent="🧠 اقترح القسم";
  };
  $("clGo").onclick=async()=>{
    await stopSheetMic();
    const btn=$("clGo");
    const name=$("clName").value.trim(), phone=$("clPhone").value.trim(), reason=$("clReason").value.trim(), dept=$("clDept").value||null;
    if(!name){ toast("اكتب اسم المتصل","bad"); return; }
    btn.disabled=true; btn.textContent="بيسجّل…";
    const mgr=dept?PROFILES.find(p=>p.dept===dept&&p.role==="manager"):null;

async function paintVisitorsToday(){
  const box=$("viBox"); if(!box) return;
  try{
    const start=new Date(); start.setHours(0,0,0,0);
    /* زوار النهاردة + أي زائر لسه مفتوح من أيام فاتت (عشان ميفضلش معلّق للأبد) */
    const [todayRes, openRes]=await Promise.all([
      sb.from("os_visitors").select("*").gte("checked_in_at",start.toISOString()).order("checked_in_at",{ascending:false}).limit(30),
      sb.from("os_visitors").select("*").is("checked_out_at",null).lt("checked_in_at",start.toISOString()).order("checked_in_at",{ascending:false}).limit(20)
    ]);
    const rows=todayRes.data||[], stale=openRes.data||[];

    const card=(v,isStale)=>{
      const out=v.checked_out_at?'<span class="badge b-blue">خرج '+timeStr(v.checked_out_at)+'</span>':'<button class="btn ghost sm" data-viout="'+v.id+'">سجّل خروج</button>';

    };
    let h="";
    if(stale.length) h+='<div class="sec-h" style="color:#B45309">لسه مفتوحين من أيام فاتت ('+stale.length+') <span class="ln"></span></div>'+stale.map(v=>card(v,true)).join("");
    if(rows.length) h+=(stale.length?'<div class="sec-h">النهاردة <span class="ln"></span></div>':"")+rows.map(v=>card(v,false)).join("");
    else if(stale.length) h+='<div class="empty">مفيش زوار لسه النهاردة.</div>';
    box.innerHTML=h;
    box.querySelectorAll("[data-viout]").forEach(b=>b.onclick=async()=>{

/* ---------- my own tasks (home, owner/ops) ---------- */
function myTasksSection(d){
  const _now=Date.now();
  const mine=(d.openTasks||[]).filter(t=>t.assignee_id===ME.id).slice().sort((a,b)=>{
    const ad=a.deadline?new Date(a.deadline).getTime():Infinity, bd=b.deadline?new Date(b.deadline).getTime():Infinity;
    const ao=ad<_now?0:1, bo=bd<_now?0:1;
    if(ao!==bo) return ao-bo;
    if(ad!==bd) return ad-bd;
    return (b.priority==="high"?1:0)-(a.priority==="high"?1:0);
  });
  if(!mine.length) return "";
  const late=mine.filter(t=>t.deadline&&new Date(t.deadline)<new Date()).length;
  let h=`<div class="sec-h">مهامي أنا <span class="muted" style="font-weight:700;font-size:11px">${mine.length}</span>${late?` <span class="badge b-red" style="font-size:10px">${late} متأخرة</span>`:""} <span class="ln"></span></div>`;
  h+=mine.slice(0,5).map(t=>`<button class="card flat" data-task="${t.id}" style="width:100%;text-align:right;cursor:pointer${t.deadline&&new Date(t.deadline)<new Date()?';border-right:4px solid var(--red)':''}"><b>${esc(t.title)}</b><div class="meta">${t.deadline?`<span>${fmtDate(t.deadline)}</span>`:`<span class="muted">من غير موعد</span>`}${t.priority==="high"?'<span class="dot"></span>'+prioBadge("high"):""}<span class="dot"></span><span class="muted">${t.progress||0}%</span></div></button>`).join("");
  if(mine.length>5) h+=`<button class="btn ghost sm" data-task="more" style="margin-top:6px">شوف كل مهامي (${mine.length})</button>`;
  return h;
}

/* ===== محرك رفع ملفات الموظفين + الأرشيف ===== */
const FILE_CATS=[["general","عام"],["contract","عقد"],["license","رخصة"],["drawing","رسمة هندسية"],["invoice","فاتورة"],["report","تقرير"],["photo","صورة موقع"],["other","حاجة تانية"]];
const FILE_MAX=20*1048576;
const FILE_OK=["pdf","jpg","jpeg","png","webp","doc","docx","xls","xlsx"];
async function uploadEmployeeFile(file, onProg){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();
  if(!FILE_OK.includes(ext)) throw new Error("نوع الملف مش مسموح (PDF/صورة/Word/Excel بس)");
  if(file.size>FILE_MAX) throw new Error("الملف أكبر من 20 ميجا");
  const path=ME.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  // رفع مباشر بصلاحية الموظف المسجّل (RLS authenticated)
  const { error }=await sb.storage.from("client-files").upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw new Error(error.message||"فشل الرفع");
  // لينك موقّع 10 سنين للعرض الداخلي
  const { data:signed }=await sb.storage.from("client-files").createSignedUrl(path, 315360000);
  return { url:(signed&&signed.signedUrl)||"", path, size:file.size, mime:file.type||null };
}

/* ===== مركز التخزين (20 تطوير) ===== */
function fmtBytes(b){ b=Number(b)||0; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; if(b<1073741824) return (b/1048576).toFixed(1)+" MB"; return (b/1073741824).toFixed(2)+" GB"; }
async function openStorageCenter(){
  openSheet('<h3>مركز التخزين</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">مراقبة المساحة والملفات والأرشيف — للإدارة بس</div><div id="stcBox"><div class="skel"></div><div class="skel"></div></div><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  await paintStorageCenter();
}
async function paintStorageCenter(){
  try{
    const [{data:stats},{data:ov},{data:health},{data:largest},{data:ret},{data:byDept}]=await Promise.all([
      sb.rpc("os_storage_stats"),
      sb.from("os_storage_overview").select("*"),
      sb.from("os_storage_health").select("*").single(),
      sb.from("os_storage_largest").select("*").limit(8),
      sb.from("os_retention_policy").select("*").single(),
      sb.from("os_files_by_dept").select("*")
    ]);
    const st=stats||{}; let h="";

    /* 1) مؤشر المساحة البصري (gauge) */
    const pct=Math.min(100, Number(st.used_pct)||0);
    const barCol = pct>80?"var(--red)": pct>50?"#F59E0B":"var(--green-d)";
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">المساحة المستخدمة</b><span style="font-weight:800;color:'+barCol+'">'+fmtBytes(st.total_bytes)+' / 1 GB</span></div>'
      +'<div class="prog" style="height:12px;margin-top:8px;background:#eef2f7"><i style="width:'+Math.max(2,pct)+'%;background:'+barCol+'"></i></div>'
      +'<div class="muted" style="font-size:11px;margin-top:5px">'+pct+'% من الحد المجاني \u00b7 '+(st.total_files||0)+' ملف \u00b7 قاعدة البيانات: '+fmtBytes(st.db_bytes)+'</div>'
      +(pct>80?'<div style="color:var(--red);font-weight:800;font-size:12px;margin-top:6px">المساحة قربت تخلص — نظّف الملفات اليتيمة أو فعّل خطة مدفوعة</div>':'')
      +'</div>';

    /* 2) صحة التخزين — مؤشرات سريعة */
    if(health){
      h+='<div class="stats" style="margin-top:10px">'
        +'<div class="stat"><div class="n">'+(health.locked_docs||0)+'</div><div class="l">مستند مقفول</div></div>'
        +'<div class="stat'+((health.expiring_docs||0)?' stat-hot':'')+'"><div class="n">'+(health.expiring_docs||0)+'</div><div class="l">بينتهي قريب</div></div>'
        +'<div class="stat'+((health.orphans||0)?' stat-hot':'')+'"><div class="n">'+(health.orphans||0)+'</div><div class="l">ملف يتيم</div></div></div>';
    }

    /* 3) تفصيل كل bucket */
    if(ov&&ov.length){
      h+='<div class="sec-h">المخازن <span class="ln"></span></div>';
      const names={"client-files":"ملفات العملاء","os-documents":"المستندات الرسمية"};
      h+='<div class="card flat">'+ov.map(b=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f0f3f7"><b>'+esc(names[b.bucket_id]||b.bucket_id)+'</b><span class="muted">'+b.files+' ملف \u00b7 '+fmtBytes(b.bytes)+'</span></div>').join("")+'</div>';
    }

    /* 4) أكبر الملفات (للتنظيف اليدوي) */
    if(largest&&largest.length){
      h+='<div class="sec-h">أكبر الملفات <span class="ln"></span></div><div class="card flat">'
        +largest.map(f=>'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><b style="margin-right:8px">'+fmtBytes(f.bytes)+'</b></div>').join("")+'</div>';
    }

    /* 5) الملفات اليتيمة + زرار تنظيف */
    if(health&&(health.orphans||0)>0){
      h+='<div class="card" style="border-color:#FDE68A;background:#FFFDF4;margin-top:10px"><b>'+health.orphans+' ملف يتيم</b><div class="muted" style="font-size:11.5px;margin-top:3px">ملفات مرفوعة من أكتر من أسبوع ومش مربوطة بأي عميل أو مستند. ممكن تكون رفعات ناقصة.</div>'
        +'<button class="btn ghost sm" id="stcOrphans" style="margin-top:8px">شوف الملفات اليتيمة</button></div>';
    }

    /* 5.5) ملفات الموظفين حسب القسم */
    if(byDept&&byDept.length){
      const valid=byDept.filter(d=>d.dept);
      if(valid.length){
        h+='<div class="sec-h">ملفات الفرق <span class="ln"></span></div><div class="card flat">'
          +valid.map(d=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f0f3f7"><b>'+esc((DEPT_BY_KEY[d.dept]&&DEPT_BY_KEY[d.dept].name)||d.dept)+'</b><span class="muted">'+d.active+' نشط \u00b7 '+d.archived+' مؤرشف \u00b7 '+fmtBytes(d.bytes)+'</span></div>').join("")+'</div>';
      }
    }
    /* 6) إعدادات الاحتفاظ (retention) */
    if(ret){
      h+='<div class="sec-h">مدة الاحتفاظ بالبيانات <span class="ln"></span></div>'
        +'<div class="card flat"><div style="font-size:11.5px;line-height:2">'
        +'\u2022 الإشعارات المقروءة: <b>'+ret.notifications_days+' يوم</b><br>'
        +'\u2022 سجل النشاط: <b>'+ret.activity_days+' يوم</b><br>'
        +'\u2022 تحليلات الاستخدام: <b>'+ret.ui_events_days+' يوم</b><br>'
        +'\u2022 الأرشيف: <b>'+ret.archive_days+' يوم</b></div>'
        +'<div class="muted" style="font-size:10.5px;margin-top:6px">التنظيف بيشتغل أوتوماتيك كل ليلة 1:30 ص</div></div>';
    }

    $("stcBox").innerHTML=h;
    const orb=$("stcOrphans"); if(orb) orb.onclick=()=>openOrphans();
  }catch(e){ $("stcBox").innerHTML=failBox("معرفناش نجيب بيانات التخزين.",paintStorageCenter); }
}

async function openUsageInsights(){
  openSheet('<h3>تحليلات الاستخدام</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">آخر 7 أيام — مين بيستخدم إيه وفين الناس بتقف</div>'
    +'<div id="uiW"><div class="skel"></div><div class="skel"></div></div>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  try{
    const [insR,actR,errR]=await Promise.all([
      sb.from("os_usage_insights").select("*"),
      sb.from("os_user_activity_week").select("*"),
      sb.from("os_ui_events").select("user_name,name,at").eq("kind","error").order("at",{ascending:false}).limit(10)
    ]);
    const ins=insR.data||[], act=actR.data||[], errs=errR.data||[];
    let h="";

    /* أنشط الأعضاء + استنتاج مين محتاج مساعدة */
    h+='<div class="sec-h">نشاط الفريق <span class="ln"></span></div>';
    if(act.length){
      const sorted=act.slice().sort((a,b)=>(b.actions+b.screens)-(a.actions+a.screens));
      h+='<div class="card flat">'+sorted.map(u=>{
        const stuck=(u.errors>=3)||(u.screens>=10&&u.actions===0);
        return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px"><b style="flex:1">'+esc(firstName(u.user_name||"عضو"))+(stuck?' <span class="badge b-red">محتاج مساعدة؟</span>':'')+'</b>'
          +'<span class="muted" style="font-size:11px">'+u.actions+' فعل \u00b7 '+u.screens+' شاشة'+(u.voice_uses?' \u00b7'+u.voice_uses:'')+(u.errors?' \u00b7'+u.errors:'')+'</span></div>';
      }).join("")+'</div>';
      const ghosts=PROFILES.filter(p=>p.id!==ME.id&&!act.find(a=>a.user_id===p.id));
      if(ghosts.length) h+='<div class="card" style="border-color:#FDE68A;background:#FFFDF4;font-size:12px;margin-top:6px"><b>مدخلوش المنظومة الأسبوع ده:</b> '+ghosts.map(p=>esc(firstName(p.name))).join("، ")+'</div>';
    } else h+='<div class="empty">لسه مفيش بيانات — هتتجمع تلقائيًا مع الاستخدام.</div>';

    /* أكتر الشاشات */
    const scr=ins.filter(i=>i.kind==="screen").sort((a,b)=>b.hits-a.hits).slice(0,6);
    if(scr.length){
      const mx=scr[0].hits||1;
      h+='<div class="sec-h">أكتر الشاشات استخدامًا <span class="ln"></span></div><div class="card flat">'
        +scr.map(x=>'<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>'+esc(x.name)+'</b><span class="muted">'+x.hits+' \u00b7 '+x.users+' عضو</span></div><div class="prog" style="height:6px;margin-top:3px"><i style="width:'+Math.round(x.hits/mx*100)+'%"></i></div></div>').join("")+'</div>';
    }

    /* أكتر الأفعال */
    const acts=ins.filter(i=>i.kind==="action").sort((a,b)=>b.hits-a.hits).slice(0,5);
    if(acts.length) h+='<div class="sec-h">أكتر الأفعال <span class="ln"></span></div><div class="card flat">'+acts.map(x=>'<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><b>'+esc(x.name)+'</b><span class="muted">'+x.hits+'</span></div>').join("")+'</div>';

    /* الأخطاء الأخيرة = فين الناس بتقف */
    if(errs.length){
      h+='<div class="sec-h">آخر الأخطاء اللي قابلت الناس <span class="ln"></span></div><div class="card flat">'
        +errs.map(e2=>'<div style="font-size:11.5px;padding:3px 0"><b>'+esc(firstName(e2.user_name||""))+':</b> '+esc(e2.name)+' <span class="muted">\u00b7 '+timeAgo(e2.at)+'</span></div>').join("")+'</div>';
    }
    $("uiW").innerHTML=h;
  }catch(e){ $("uiW").innerHTML=failBox("معرفناش نجيب التحليلات.",openUsageInsights); }
}

const PRJ_STAGE={"جديد":"جديد","تسعير":"تسعير","تنفيذ":"تنفيذ","تسليم":"تسليم","مغلق":"مغلق"};
async function paintProjects(){
  try{
    const [{ data },{ data:meta },{ data:fls }]=await Promise.all([
      sb.from("os_project_overview").select("*").order("name"),
      sb.from("os_projects").select("id,code,status"),
      sb.from("os_files").select("project_id").not("project_id","is",null)
    ]);
    const rows=data||[];
    const M={}; (meta||[]).forEach(m=>{ M[m.id]=m; });
    const FC={}; (fls||[]).forEach(f=>{ if(f.project_id) FC[f.project_id]=(FC[f.project_id]||0)+1; });
    if(!rows.length){ $("prjBox").innerHTML='<div class="empty">مفيش مشاريع متسجلة لسه.</div>'; return; }
    $("prjBox").innerHTML=rows.map(p=>{
      const pr=Math.max(0,Math.min(100,p.progress||0)); const mm=M[p.id]||{}; const nf=FC[p.id]||0;
      return '<div class="card flat" data-prj="'+p.id+'" style="cursor:pointer">'
        +'<div style="display:flex;align-items:center;gap:8px">'+(mm.code?'<span class="badge" style="background:#eef2f7;color:#0D47A1;font-weight:800;letter-spacing:.3px">'+esc(mm.code)+'</span>':'')+'<b style="flex:1">'+esc(p.name)+'</b><span class="badge b-blue">'+(PRJ_STAGE[p.stage]||esc(p.stage||"\u2014"))+'</span></div>'
        +'<div class="prog" style="margin:8px 0 4px"><i style="width:'+pr+'%"></i></div>'
        +'<div class="meta"><span>'+pr+'%</span><span class="dot"></span><span>'+(p.tasks_done||0)+'/'+(p.tasks_total||0)+' مهمة</span>'
        +((p.tasks_overdue||0)?'<span class="dot"></span><span style="color:var(--red);font-weight:800">'+p.tasks_overdue+' متأخرة</span>':'')
        +(p.value_egp?'<span class="dot"></span><span>'+Number(p.value_egp).toLocaleString("en")+' ج</span>':'')
        +((DEPT_BY_KEY[p.dept]&&'<span class="dot"></span><span>'+esc(DEPT_BY_KEY[p.dept].name)+'</span>')||'')
        +'<span class="dot"></span><span style="color:var(--green-d);font-weight:800">📎 '+nf+' • افتح للملفات ‹</span>'

        const wl={}; (tk||[]).forEach(x=>{ if(x.assignee_id) wl[x.assignee_id]=(wl[x.assignee_id]||0)+1; });
        const mates=PROFILES.filter(p=>p.dept===dk);
        if(mates.length){ mates.sort((a,b)=>(wl[a.id]||0)-(wl[b.id]||0)); assId=mates[0].id; }

      created_by:ME.id, created_by_name:PROFILE.name

    /* سجّل التسليم على المهمتين */

  };

    /* معالم ومهام المشروع */
    h+='<div class="sec-h">معالم ومهام المشروع <span class="ln"></span></div>';

        try{

          let revision=1;

  openSheet('<h3>تفاصيل المشروع الإنشائي</h3><div id="sdBox"><div class="skel"></div><div class="skel"></div></div><button class="btn ghost" style="margin-top:10px" onclick="openStructEng()">رجوع للمشاريع الإنشائية</button>');
  await paintStructProjectDetail(id);
}
async function paintStructProjectDetail(id){
  try{
    const { data:p, error }=await sb.from("os_struct_projects").select("*").eq("id",id).single();
    if(error||!p){ $("sdBox").innerHTML=failBox("معرفناش نجيب المشروع.",()=>paintStructProjectDetail(id)); return; }
    const { data:els }=await sb.from("os_struct_element_status").select("*").eq("project_id",id).order("created_at",{ascending:false});
    const rows=els||[];
    let h='<div class="card">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge b-blue">'+(SE_STAGE[p.stage]||esc(p.stage))+'</span><span class="badge" style="background:#eef2f7;color:#0D47A1">'+(SE_SW[p.software]||esc(p.software||""))+'</span></div>'
      +'<b style="display:block;margin-top:8px;font-size:15px">'+esc(p.name)+'</b>'
      +'<div class="meta" style="margin-top:6px">'+(p.architect_name?'<span>معماري: '+esc(p.architect_name)+'</span><span class="dot"></span>':'')+(p.engineer_name?'<span>إنشائي: '+esc(p.engineer_name)+'</span>':'')+'</div>'
      +'<div class="muted" style="font-size:11.5px;margin-top:6px">'+(p.fc?'fc='+p.fc+' N/mm² · ':'')+(p.fy?'fy='+p.fy+' N/mm² · ':'')+(p.num_floors?p.num_floors+' دور':'')+'</div></div>';
    h+='<div class="sec-h">العناصر ('+rows.length+') <span class="ln"></span></div>';
    if(isStructUser()) h+='<div class="row-actions" style="margin:-4px 0 10px"><button class="btn green sm" id="seAddEl">➕ أضف عنصر</button></div>';
    if(!rows.length){ h+='<div class="empty">مفيش عناصر متسجّلة لسه.</div>'; }
    else { h+=rows.map(e=>{
      const cs=e.check_status;
      const csBadge=cs==="fail"?'<span class="badge b-red">فشل ✕</span>':cs==="pass"?'<span class="badge b-green">تمام ✓</span>':'<span class="badge b-grey">من غير تشيك</span>';
      const rv=REVIEW_LBL[e.review_status]||REVIEW_LBL.pending;
      const canReview=isStructUser()&&e.review_status==="pending";
      return '<div class="card flat" data-el="'+e.id+'"'+(cs==="fail"?' style="border-right:4px solid var(--red)"':'')+'>'
        +'<div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(e.label)+' — '+(ETYPE_LBL[e.etype]||e.etype)+'</b>'+csBadge+'</div>'
        +'<div class="meta">'+(e.level?'<span>الدور: '+esc(e.level)+'</span><span class="dot"></span>':'')+'<span class="badge" style="background:transparent;color:var(--ink-soft);padding:0">'+rv[0]+'</span>'+(e.worst_ratio!=null?'<span class="dot"></span><span>أسوأ نسبة: '+Number(e.worst_ratio).toFixed(2)+'</span>':'')+'</div>'
        +(canReview?'<div class="row-actions" style="margin-top:8px"><button class="btn green sm" data-elok="'+e.id+'">اعتماد</button><button class="btn ghost sm" data-eledit="'+e.id+'">محتاجة تعديل</button></div>':'')
        +'</div>';
    }).join(""); }
    $("sdBox").innerHTML=h;
    const addBtn=$("seAddEl"); if(addBtn) addBtn.onclick=()=>openStructElementNew(id);
    $("sdBox").querySelectorAll("[data-elok]").forEach(b=>b.onclick=async()=>{
      const { error }=await sb.from("os_struct_elements").update({ review_status:"approved", reviewed_by:ME.id, reviewed_at:new Date().toISOString() }).eq("id",b.dataset.elok);
      if(error){ toast("معرفناش نعتمد: "+error.message,"bad"); return; }
      toast("اتعتمد ✓","ok"); paintStructProjectDetail(id);
    });
    $("sdBox").querySelectorAll("[data-eledit]").forEach(b=>b.onclick=async()=>{
      const note=prompt("اكتب ملاحظة التعديل المطلوب")||null;
      const { error }=await sb.from("os_struct_elements").update({ review_status:"needs_edit", reviewed_by:ME.id, reviewed_at:new Date().toISOString(), review_note:note }).eq("id",b.dataset.eledit);
      if(error){ toast("معرفناش نحدّث: "+error.message,"bad"); return; }
      toast("اترجعت للتعديل","ok"); paintStructProjectDetail(id);
    });
  }catch(e){ $("sdBox").innerHTML=failBox("حصل خطأ.",()=>paintStructProjectDetail(id)); }
}

/* ===================== العلاقات الحكومية — متابعة المعاملات ===================== */
const GOV_TYPE={permit:"تصريح",license:"ترخيص",renewal:"تجديد",registration:"تسجيل",inspection:"معاينة",other:"تانية"};
const GOV_STATUS={new:["جديدة","b-amber"],in_progress:["شغّالة","b-blue"],submitted:["مقدّمة للجهة","#7C3AED"],pending_govt:["قيد المراجعة الحكومية","#F59E0B"],approved:["معتمدة","b-green"],rejected:["مرفوضة","b-red"],archived:["مؤرشفة","b-grey"]};
function isGovUser(){ return isOwnerOps()||PROFILE.position==="gov"; }
let _govView="active";
async function openGovCases(){
  if(!isGovUser()){ toast("الشاشة دي للعلاقات الحكومية والإدارة","bad"); return; }
  openSheet('<h3>المعاملات الحكومية</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">من التقديم للاعتماد — كل معاملة بتاريخها وكودها وحالتها</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:10px" id="govFilters"><button class="chip on" data-gf="active">شغّالة</button><button class="chip" data-gf="archived">الأرشيف</button></div>'
    +'<div id="govBox"><div class="skel"></div><div class="skel"></div></div>'
    +'<div class="row-actions" style="margin-top:10px"><button class="btn green sm" id="govNew">معاملة جديدة</button><button class="btn ghost sm" onclick="closeSheet()">قفل</button></div>');
  _govView="active";
  $("govFilters").querySelectorAll("[data-gf]").forEach(b=>b.onclick=()=>{ _govView=b.dataset.gf; $("govFilters").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); paintGovCases(); });
  $("govNew").onclick=()=>openGovCaseNew();
  await paintGovCases();
  attachListSearch("govSearch","govBox","دوّر بعنوان المعاملة أو الجهة…");
}
async function paintGovCases(){
  const box=$("govBox"); if(!box) return;
  try{
    let q=sb.from("os_gov_cases").select("*").order("created_at",{ascending:false}).limit(60);
    q = _govView==="archived" ? q.eq("status","archived") : q.neq("status","archived");
    const { data }=await q;
    const rows=data||[];
    if(!rows.length){ box.innerHTML='<div class="empty">'+(_govView==="archived"?"مفيش معاملات مؤرشفة لسه.":"مفيش معاملات شغّالة. ابدأ بمعاملة جديدة.")+'</div>'; return; }
    box.innerHTML=rows.map(c=>{
      const st=GOV_STATUS[c.status]||["—","b-grey"];
      const pr=Math.max(0,Math.min(100,c.progress||0));
      let dd="";
      if(c.target_date&&c.status!=="archived"){
        const days=Math.ceil((new Date(c.target_date)-new Date())/86400000);
        dd = days<0?'<span style="color:var(--red);font-weight:800">متأخرة '+Math.abs(days)+' يوم</span>':days<=3?'<span style="color:#B45309;font-weight:700">خلال '+days+' يوم</span>':'خلال '+days+' يوم';
      }
      return '<div class="card flat" data-gov="'+c.id+'" style="cursor:pointer">'
        +'<div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(c.title)+'</b><span class="badge" style="background:'+(st[1][0]==="#"?st[1]:"")+'" class="badge '+(st[1][0]==="#"?"":st[1])+'">'+st[0]+'</span></div>'
        +'<div class="prog" style="margin:8px 0 4px"><i style="width:'+pr+'%"></i></div>'
        +'<div class="meta"><span>'+(GOV_TYPE[c.case_type]||c.case_type)+'</span>'+(c.government_body?'<span class="dot"></span><span>'+esc(c.government_body)+'</span>':'')+(dd?'<span class="dot"></span><span>'+dd+'</span>':'')+'</div></div>';
    }).join("");
    box.querySelectorAll("[data-gov]").forEach(el=>el.onclick=()=>openGovCaseDetail(el.getAttribute("data-gov")));
    if(box._listSearchApply) box._listSearchApply();
  }catch(e){ box.innerHTML=failBox("معرفناش نجيب المعاملات.",paintGovCases); }
}

  let prjOpts='<option value="">بدون ربط بمشروع</option>';

    const { error }=await sb.from("os_gov_cases").insert(payload);
    if(error){ toast("معرفناش نضيف: "+error.message,"bad"); btn.disabled=false; btn.textContent="أضف المعاملة"; return; }
    toast("المعاملة اتضافت","ok"); openGovCases();
  };

  try{

    const st=GOV_STATUS[c.status]||["—","b-grey"];
    let h='<div class="card">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge" style="'+(st[1][0]==="#"?"background:"+st[1]+";color:#fff":"")+'" class="badge '+(st[1][0]==="#"?"":st[1])+'">'+st[0]+'</span><span class="badge" style="background:#eef2f7;color:#0D47A1">'+(GOV_TYPE[c.case_type]||c.case_type)+'</span></div>'

      +prjLine+'</div>';
    h+='<div class="sec-h">نسبة الإنجاز <span class="ln"></span></div>';
    h+='<div class="prog" style="margin-bottom:6px"><i style="width:'+(c.progress||0)+'%"></i></div><div class="muted" style="font-size:12px;margin-bottom:8px">'+(c.progress||0)+'%</div>';
    h+='<div class="qbtns" id="gdProg">'+[0,25,50,75,100].map(p=>'<button class="qbtn'+((c.progress||0)===p?" on":"")+'" data-gp="'+p+'">'+p+'%</button>').join("")+'</div>';
    h+='<div class="sec-h">الحالة <span class="ln"></span></div>';
    h+='<div class="field"><select id="gdStatus">'+Object.entries(GOV_STATUS).filter(([k])=>k!=="archived").map(([k,v])=>'<option value="'+k+'"'+(c.status===k?" selected":"")+'>'+v[0]+'</option>').join("")+'</select></div>';
    h+='<div class="field"><label>الرقم المرجعي الرسمي</label><input id="gdRef" value="'+esc(c.reference_code||"")+'" placeholder="رقم المعاملة عند الجهة"/></div>';
    h+='<div class="field"><label>مرجع الختم/البصمة (عند الاعتماد)</label><input id="gdStamp" value="'+esc(c.stamp_ref||"")+'" placeholder="رقم الختم أو الاعتماد"/></div>';
    h+='<div class="field"><label>ملاحظات</label><textarea id="gdNotes">'+esc(c.notes||"")+'</textarea></div>';

          +(d.deadline?'<span class="muted" style="font-size:11px;white-space:nowrap">'+fmtDate(d.deadline)+'</span>':'')
          +(d.task_id?'<button class="lnk" data-dtask="'+esc(d.task_id)+'" style="font-size:11.5px;white-space:nowrap">المهمة المرتبطة ↗</button>':'')
          +'</div>';
      }).join("") : "";
      const addForm = (typeof canWrite==="function"?canWrite():true)? '<details style="margin-top:7px"><summary class="lnk" style="font-size:11.5px;cursor:pointer;list-style:none">+ أضف قرار</summary>'

        +'<input class="dcTxt" placeholder="نص القرار…" style="padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"/>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap">'

        +'<input class="dcDl" type="date" style="padding:8px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"/>'
        +'<button class="btn green sm dcGo" data-min="'+m.id+'">سجّل القرار</button></div>'
        +'<div class="muted" style="font-size:10.5px">لو حددت مسؤول وموعد — هتتولد مهمة تلقائيًا وهيظهر رابطها هنا</div>'
        +'</div></details>' : "";
      return '<div class="card flat"><b>'+esc(m.title)+'</b>'+(m.attendees?'<div class="muted" style="font-size:11.5px;margin-top:3px">'+esc(m.attendees)+'</div>':'')+'<div style="font-size:12.5px;margin-top:5px;white-space:pre-wrap">'+esc((m.body||"").slice(0,300))+((m.body||"").length>300?"\u2026":"")+'</div>'+decHtml+addForm+'<div class="meta"><span>'+esc(m.by_name||"")+'</span><span class="dot"></span><span>'+timeAgo(m.created_at)+'</span></div></div>';
    }).join("") : '<div class="empty">مفيش محاضر لسه.</div>';
    $("minBox").querySelectorAll("[data-dtask]").forEach(b=>b.onclick=()=>openLinkedTask(b.dataset.dtask));
    $("minBox").querySelectorAll(".dcGo").forEach(b=>b.onclick=async()=>{
      const box=b.closest("details");
      const txt=box.querySelector(".dcTxt").value.trim(); if(!txt){ toast("اكتب نص القرار","bad"); return; }
      const own=box.querySelector(".dcOwn").value||null;
      const dl=box.querySelector(".dcDl").value||null;
      const payload={ minute_id:b.dataset.min, decision:txt, by_id:ME.id, by_name:PROFILE.name };
      if(own){ payload.owner_id=own; const p=PROFILES.find(x=>String(x.id)===String(own)); if(p) payload.owner_name=p.name; }
      if(dl) payload.deadline=dl;
      b.disabled=true; b.textContent="بيتسجل…";
      let { error }=await sb.from("os_minute_decisions").insert(payload);
      if(error && /column|schema/i.test(String(error.message||""))){

      toast("القرار اتسجل"+(own&&dl?" — والمهمة بتتولد دلوقتي":""),"ok");
      setTimeout(paintMinutes, 1200);
    });
  }catch(e){ $("minBox").innerHTML=failBox("معرفناش نجيبها.",paintMinutes); }

function openCollect(id,maxAmt){
  openSheet('<h3>تسجيل تحصيل</h3>'
    +'<div class="field"><label>المبلغ المحصّل</label><input id="clAmt" type="number" min="0" value="'+maxAmt+'"/><div class="muted" style="font-size:11.5px;margin-top:3px">المتبقي: '+egp(maxAmt)+'</div></div>'
    +'<div class="field"><label>تاريخ التحصيل</label><input id="clDate" type="date" value="'+todayStr()+'"/></div>'
    +'<div class="field"><label>رقم الفاتورة (اختياري)</label><input id="clInv" placeholder="INV-2026-..."/></div>'
    +'<div class="row-actions"><button class="btn green" id="clGo">سجّل التحصيل</button><button class="btn ghost" onclick="openReceivables()">إلغاء</button></div>');
  $("clGo").onclick=async()=>{
    const amt=parseFloat($("clAmt").value); if(!amt||amt<=0){ toast("اكتب المبلغ","bad"); return; }
    const btn=$("clGo"); btn.disabled=true; btn.textContent="بيسجّل…";
    const full=amt>=parseFloat(maxAmt);
    const { data:cur }=await sb.from("os_project_payments").select("paid_amount,amount").eq("id",id).single();
    const newPaid=Number(cur&&cur.paid_amount||0)+amt;
    const upd={ paid_amount:newPaid, paid_at:$("clDate").value||todayStr(), status:(newPaid>=Number(cur.amount)?"paid":"partial"), updated_at:new Date().toISOString() };
    if($("clInv").value.trim()) upd.invoice_no=$("clInv").value.trim();
    const { error }=await sb.from("os_project_payments").update(upd).eq("id",id);
    if(error){ toast("معرفناش نسجّل: "+error.message,"bad"); btn.disabled=false; btn.textContent="سجّل التحصيل"; return; }
    toast(full?"اتحصّلت كاملة ✓":"اتسجّل تحصيل جزئي ✓","ok"); openReceivables();
  };
}

    +'<div class="field"><label>أو اكتب لينك جاهز (Drive…)</label><input id="dvUrl" placeholder="https://…"/></div>'

async function paintDocs(){
  try{
    const { data }=await sb.from("os_documents").select("*").order("created_at",{ascending:false}).limit(80);
    let rows=data||[];
    const soon=Date.now()+30*86400000;
    // فلاتر
    if(_dvSearch.trim()){ const q=_dvSearch.trim(); rows=rows.filter(d=>(d.title||"").includes(q)); }
    if(_dvFilter==="expiring") rows=rows.filter(d=>d.expires_at&&new Date(d.expires_at).getTime()<soon);
    else if(_dvFilter==="locked") rows=rows.filter(d=>d.locked);
    else if(_dvFilter==="mine") rows=rows.filter(d=>d.added_by===ME.id);
    else if(_dvFilter==="contract"||_dvFilter==="license") rows=rows.filter(d=>d.kind===_dvFilter);
    if(!rows.length){ $("dvBox").innerHTML='<div class="empty">'+(_dvSearch||_dvFilter!=="all"?"مفيش مستندات بالفلتر ده.":"الخزنة فاضية لسه.")+'</div>'; return; }
    const KIND_BADGE={contract:["عقد","b-green"],license:["ترخيص","b-amber"],letter:["خطاب","b-blue"],report:["تقرير","b-grey"]};
    $("dvBox").innerHTML=rows.map(d=>{
      const exp=d.expires_at?new Date(d.expires_at).getTime():null;
      const win=(d.kind==="license"||d.kind==="contract")?60:30;
      const danger=exp&&exp<Date.now()+win*86400000;
      const daysLeft=exp?Math.ceil((exp-Date.now())/86400000):null;
      const expTxt= exp? (daysLeft<=0?"انتهى!":daysLeft<=win?"باقي "+daysLeft+" يوم":"تنتهي "+fmtDate(d.expires_at)) : "";
      const kb=KIND_BADGE[d.kind];
      return '<div class="card flat" data-doc="'+d.id+'"'+(danger?' style="border-right:4px solid var(--red);background:#FFF8F8"':'')+'><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(d.title)+'</b>'+(kb?'<span class="badge '+kb[1]+'">'+kb[0]+'</span>':'')+(d.locked?'<span class="badge b-grey">مقفول</span>':'')+'</div>'
        +'<div class="meta">'+(d.dept&&DEPT_BY_KEY[d.dept]?'<span>'+esc(DEPT_BY_KEY[d.dept].name)+'</span><span class="dot"></span>':'')+'<span>v'+(d.version||1)+'</span>'+(expTxt?'<span class="dot"></span><span'+(danger?' style="color:var(--red);font-weight:800"':'')+'>'+expTxt+'</span>':'')+'</div>'
        +'<div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap">'
        +(d.file_url?'<a href="'+esc(d.file_url)+'" target="_blank" class="lnk" style="font-size:12px">افتح</a><button class="lnk" data-dcopy="'+esc(d.file_url)+'" style="font-size:12px">انسخ اللينك</button>':'<span class="muted" style="font-size:11px">مفيش ملف مرفوع</span>')
        +(canWrite()&&!d.locked?'<button class="lnk" data-dlock="'+d.id+'" style="font-size:12px;color:var(--red)">قفل نهائي</button>':'')
        +'</div></div>';
    }).join("");
    // نسخ لينك
    $("dvBox").querySelectorAll("[data-dcopy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.dcopy); toast("اتنسخ","ok"); }catch(e){ toast("معرفناش ننسخ","bad"); } });
    // قفل نهائي
    $("dvBox").querySelectorAll("[data-dlock]").forEach(b=>b.onclick=async()=>{
      if(!confirm("قفل المستند نهائيًا؟ بعد القفل مفيش حد يقدر يعدّله أو يمسحه — حتى الإدارة.")) return;
      const { error }=await sb.from("os_documents").update({ locked:true }).eq("id",b.dataset.dlock);
      if(error){ toast("معرفناش نقفل: "+error.message,"bad"); return; }
      track("action","doc_lock"); toast("اتقفل نهائي","ok"); paintDocs();
    });
  }catch(e){ $("dvBox").innerHTML=failBox("معرفناش نجيب المستندات.",paintDocs); }
}

async function paintRoadmap(){
  try{
    const { data }=await sb.from("os_improvements").select("*").order("id");
    let rows=data||[];
    if(_impCat!=="all") rows=rows.filter(r=>(r.category||"quality")===_impCat);
    if(_impSt!=="all") rows=rows.filter(r=>(r.status||"approved")===_impSt);
    if(!rows.length){ $("impBox").innerHTML='<div class="empty">مفيش بنود بالفلتر ده.</div>'; return; }
    const cats={};
    rows.forEach(r=>{ (cats[r.category||"quality"]=cats[r.category||"quality"]||[]).push(r); });
    let h="";
    Object.keys(cats).forEach(c=>{
      h+='<div class="sec-h">'+(IMP_CAT[c]||esc(c))+' <span class="ln"></span></div>';
      h+=cats[c].map(r=>{
        const st=IMP_STATUS[r.status]||IMP_STATUS.approved;
        return '<div class="card flat imp-row" data-imp="'+r.id+'" data-st="'+esc(r.status||"approved")+'" style="cursor:'+(isOwnerOps()?"pointer":"default")+'"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(r.title)+'</b><span class="badge '+st[1]+'">'+st[0]+'</span></div>'+(r.details?'<div class="muted" style="font-size:12px;margin-top:4px">'+esc(r.details)+'</div>':'')+'</div>';
      }).join("");
    });
    $("impBox").innerHTML=h;
    if(isOwnerOps()){
      $("impBox").querySelectorAll(".imp-row").forEach(el=>el.onclick=async()=>{
        const cur=el.dataset.st;
        const nxt= cur==="approved"?"in_progress" : cur==="in_progress"?"done" : "approved";
        const { error }=await sb.from("os_improvements").update({ status:nxt }).eq("id",el.dataset.imp);
        if(error){ toast("معرفناش نحدّث: "+error.message,"bad"); return; }
        if(nxt==="done") toast("بند خلص!","ok");
        paintRoadmap();
      });
    }
  }catch(e){ $("impBox").innerHTML=failBox("معرفناش نجيب الخطة.",paintRoadmap); }
}

function validateReqFields(kind){
  const fs=REQ_SCHEMAS[kind]||[]; let ok=true;
  for(const f of fs){
    const el=$(f.id); if(!el) continue;
    const err=$(f.id+"Err"); const v=el.value.trim();

    if(f.req&&!v){ fail("الحقل ده مطلوب"); continue; }
    if(!v) continue;
    if(f.type==="number"){ const n=parseFloat(v); if(isNaN(n)||n<=0){ fail("لازم رقم موجب"); continue; } }
    if(f.type==="date"&&f.future){ if(v<today()){ fail("التاريخ ده فات — اختار تاريخ جاي"); continue; } }
    if(err) err.style.display="none";
  }
  return ok;
}
function collectReqFields(kind){
  const fs=REQ_SCHEMAS[kind]||[]; const data={}; const parts=[];
  for(const f of fs){
    const el=$(f.id); if(!el) continue; const v=el.value.trim(); if(!v) continue;
    let disp=v;
    if(f.type==="select"){ const o=f.opts.find(x=>x[0]===v); if(o) disp=o[1]; }
    if(f.id==="fAmount") disp=parseFloat(v).toLocaleString("ar-EG")+" ج";
    data[f.id.slice(1).toLowerCase()]=v;
    parts.push(REQ_FIELD_LABELS[f.id]+": "+disp);
  }
  return { data: Object.keys(data).length?data:null, summary: parts.join(" · ") };
}

function attachListSearch(inputId, boxId, placeholder){
  const box=$(boxId); if(!box) return;
  const host=box.parentNode;
  if(document.getElementById(inputId)) return;
  const inp=document.createElement("input");
  inp.id=inputId; inp.type="search"; inp.placeholder=placeholder||"دوّر…";
  inp.setAttribute("inputmode","search");
  inp.style.cssText="width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:13.5px;margin-bottom:10px";
  host.insertBefore(inp,box);
  const apply=()=>{
    const q=inp.value.trim();
    let shown=0, hiddenHeads=[];
    [...box.children].forEach(el=>{
      if(el.classList&&el.classList.contains("sec-h")){ hiddenHeads.push(el); el.style.display=""; return; }
      const txt=el.textContent||"";
      const ok=!q||txt.includes(q);
      el.style.display=ok?"":"none";
      if(ok) shown++;
    });
    /* اخفي عناوين الأقسام اللي مبقاش تحتها حاجة */
    hiddenHeads.forEach(h=>{
      let any=false;
      let n=h.nextElementSibling;
      while(n&&!(n.classList&&n.classList.contains("sec-h"))){ if(n.style.display!=="none"){ any=true; break; } n=n.nextElementSibling; }
      h.style.display=any?"":"none";
    });
    let empty=document.getElementById(inputId+"__none");
    if(!shown&&q){
      if(!empty){ empty=document.createElement("div"); empty.id=inputId+"__none"; empty.className="empty"; empty.textContent="مفيش نتايج للبحث ده."; box.appendChild(empty); }
      empty.style.display="";
    } else if(empty) empty.style.display="none";
  };
  inp.oninput=apply;
  box._listSearchApply=apply;   /* عشان يتنادى بعد إعادة الرسم */
}
function makeSearchable(selectId, placeholder){
  const sel=$(selectId); if(!sel) return;

  if(sel.dataset.searchable==="1") return;

  inp.setAttribute("inputmode","search");
  inp.style.cssText="width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;margin-bottom:6px";
  sel.parentNode.insertBefore(inp,sel);
  const all=[...sel.options].map(o=>({v:o.value,t:o.textContent,g:o.dataset||{}}));
  inp.oninput=()=>{

    sel.innerHTML=keep.map(o=>'<option value="'+esc(o.v)+'"'+(o.v===cur?" selected":"")+'>'+esc(o.t)+'</option>').join("");

  };
}

function bindSheetMic(btnId, taId, opts){

    }

    sRec=new SR(); sRec.lang="ar-EG"; sRec.continuous=true; sRec.interimResults=true;
    const ta=$(taId); sCommit=ta.value?(ta.value+" "):"";
    sRec.onresult=(e)=>{ let it=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) sCommit+=t+" "; else it+=t; } ta.value=(sCommit+it).trim(); };
    sRec.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("لازم تسمح بالميكروفون","bad"); stopSheetMic(); } };
    sRec.onend=()=>{ if(sRecOn&&sEngine==="dict"){ try{ sRec.start(); }catch(_e){} } };
    try{ sRec.start(); sRecOn=true; sEngine="dict"; b.innerHTML=sOpts.recDict; b.classList.add("on"); }
    catch(e){ toast("معرفناش نبدأ التسجيل","bad"); }
  };
}
async function stopSheetMic(discard){
  if(!sRecOn) return;
  sRecOn=false;
  const _svadRef=sVad;
  try{ sVad&&sVad.stop(); }catch(e){} sVad=null;
  const _noSpeechS = noRealSpeech(_svadRef);
  const o=sOpts||S_DEFAULT;
  const b=sBtnId?$(sBtnId):null; if(b){ b.innerHTML=o.idle; b.classList.remove("on"); b.style.boxShadow=""; }
  if(sEngine==="gemini"){
    const blob=await new Promise((res)=>{ try{ sMediaRec.onstop=()=>{ const bl=new Blob(sChunks,{type:(sMediaRec&&sMediaRec.mimeType)||"audio/mp4"}); try{ sStream.getTracks().forEach(t=>t.stop()); }catch(_e){} res(bl); }; sMediaRec.stop(); }catch(e){ res(null); } });
    if(discard||!blob||!blob.size) return;
    if(_noSpeechS){ toast("مسمعتش كلام واضح — جرّب تاني","bad"); return; }
    if(b){ b.disabled=true; b.innerHTML=o.busy; }
    let okDone=false;
    try{
      let text=await geminiTranscribe(blob);
      text=stripHallucination(text);
      if(!text){ toast("مطلعش كلام مفهوم من التسجيل","bad"); throw new Error("EMPTY"); }
      const recSecs=window._sRecStartT?(performance.now()-window._sRecStartT)/1000:0;
      transcriptQualityGate(text,recSecs);
      text=await autoPolish(text);
      try{ sb.rpc("os_track",{ p_kind:"voice", p_name:sTaId||"mic" }).then(()=>{}); }catch(e){}
      const ta=$(sTaId);
      if(ta){
        const prev=ta.value;
        ta.value=(prev?prev+" ":"")+text;
        showVoiceUndo(ta,prev);
      }
      okDone=true;
      /* عبقرية: في نموذج الطلب — وزّع على الخانات أوتوماتيك من غير زرار */
      if(sTaId==="rDet" && $("rTitle") && !$("rTitle").value.trim() && $("rSmartFill")){
        toast("بوزّع كلامك على النموذج أوتوماتيك…","ok");
        setTimeout(()=>{ try{ $("rSmartFill").click(); }catch(e){} },200);
      }
    }catch(e){ transErrToast(e); }
    if(b){ b.disabled=false; b.innerHTML=o.idle; }
    if(okDone&&typeof o.onDone==="function"){ try{ o.onDone(); }catch(_e){} }
  } else {
    try{ sRec&&sRec.stop(); }catch(e){}
    if(!discard&&typeof o.onDone==="function"){ try{ o.onDone(); }catch(_e){} }
  }
}
async function createUserViaFn(payload){

function decState(d,tasks){
  const t=d.task_id?tasks[d.task_id]:null;

    if(t.status==="done") return ["done","اتنفذ","var(--green-d)"];
    if(late) return ["late","متأخر","var(--red)"];
    if(t.status==="review") return ["open","في المراجعة","#7C3AED"];
    return ["open","شغّال","var(--blue)"];
  }
  if(!d.owner_id) return ["noowner","بلا مسؤول","#F59E0B"];
  return ["open","مسجّل","#94a3b8"];

async function paintSysDiag(){

    const groups={}; const order=[];

let _beepCtx=null;
function notifBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    _beepCtx=_beepCtx||new AC();
    if(_beepCtx.state==="suspended") return; /* iOS: مفيش صوت من غير تفاعل — هيشتغل بعد أول لمسة */
    const o=_beepCtx.createOscillator(), g=_beepCtx.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.06;
    o.connect(g); g.connect(_beepCtx.destination);
    o.start(); o.frequency.exponentialRampToValueAtTime(1320,_beepCtx.currentTime+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001,_beepCtx.currentTime+0.22);
    o.stop(_beepCtx.currentTime+0.25);
  }catch(e){}
}

function initPullRefresh(){
  let sy=0, pulling=false, fired=false;
  const ind=document.createElement("div");
  ind.id="ptrInd";
  ind.style.cssText="position:fixed;top:-46px;left:0;right:0;text-align:center;z-index:9998;transition:top .2s;font-size:13px;font-weight:700;color:#0D47A1;background:rgba(255,255,255,.95);padding:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)";

  document.addEventListener("touchstart",(e)=>{
    if(window.scrollY>2||$("modal").classList.contains("open")) return;
    sy=e.touches[0].clientY; pulling=true; fired=false;
  },{passive:true});
  document.addEventListener("touchmove",(e)=>{
    if(!pulling) return;
    const dy=e.touches[0].clientY-sy;
    if(dy>26&&window.scrollY<=2){ ind.style.top="0px"; ind.textContent=dy>78?"سيب عشان نحدّث":"اسحب للتحديث…"; fired=dy>78; }
    else{ ind.style.top="-46px"; fired=false; }
  },{passive:true});
  document.addEventListener("touchend",()=>{
    if(!pulling) return; pulling=false;
    if(fired){ ind.textContent="بنحدّث…"; try{ switchTab(activeTab); }catch(_e){ renderHome(); } setTimeout(()=>{ ind.style.top="-46px"; },700); }
    else ind.style.top="-46px";

/* ===== Smart silence detector (VAD): يحس إن الكلام خلص ويقفل لوحده ===== */
let _lastNoise=null, _lastNoiseAt=0;
function startVAD(stream, onSilence, onLevel){
  let ctx=null, raf=null, stopped=false, _spokeMs=0;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    if(ctx.state==="suspended"){ try{ ctx.resume(); }catch(e){} }
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser(); an.fftSize=2048;
    src.connect(an);
    const buf=new Float32Array(an.fftSize);
    /* تكيفي: أول 0.9 ثانية بنقيس ضوضاء المكان، والعتبات بتتحسب نسبةً ليها */
    let noiseFloor=0, calSamples=0, calibrated=false, warnedNoSound=false;
    /* لو اتعايرنا من أقل من 5 دقايق نبدأ بالقيمة المحفوظة — معايرة أسرع */
    const cachedOK=_lastNoise!=null && (Date.now()-_lastNoiseAt)<300000;
    const CAL_MS=cachedOK?300:900;
    if(cachedOK){ noiseFloor=_lastNoise; }
    let hadSpeech=false, speechMs=0, silentMs=0, last=performance.now(), startT=last;
    const SILENCE_LIMIT=4000;      /* سكوت 4 ثواني = خلصت */
    const MIN_SPEECH_MS=1200;      /* لازم يكون اتكلم 1.2 ثانية فعلًا قبل ما الأوتو-ستوب يشتغل */
    const MIN_REC_MS=2500;         /* وأول 2.5 ثانية من التسجيل محمية بالكامل */
    const tick=()=>{
      if(stopped) return;
      an.getFloatTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
      const rms=Math.sqrt(sum/buf.length);
      const now=performance.now(); const dt=now-last; last=now;
      if(!calibrated){
        noiseFloor+=rms; calSamples++;
        if(now-startT>=CAL_MS){
          const fresh=Math.max(noiseFloor/Math.max(1,calSamples),0.0035);
          noiseFloor=cachedOK?Math.max((fresh+_lastNoise)/2,0.0035):fresh;
          _lastNoise=noiseFloor; _lastNoiseAt=Date.now();
          calibrated=true;
        }
        raf=setTimeout(tick,150); return;
      }
      const SPEECH_T=Math.max(noiseFloor*3.2,0.014);   /* كلام = أعلى بوضوح من ضوضاء المكان */
      const SILENCE_T=Math.max(noiseFloor*1.7,0.009);  /* سكوت = قريب من أرضية الضوضاء */
      if(typeof onLevel==="function"){ try{ onLevel(rms, SPEECH_T); }catch(e){} }
      /* إنذار "مش سامعك": 6 ثواني من البداية ومفيش أي كلام واصل */
      if(!hadSpeech && !warnedNoSound && (now-startT)>=6000){ warnedNoSound=true; toast("مش سامعك — اتأكد إن المايك شغال ومش مكتوم","bad"); }
      if(rms>SPEECH_T){ hadSpeech=true; speechMs+=dt; _spokeMs=speechMs; silentMs=0; }
      else if(rms<SILENCE_T && hadSpeech && speechMs>=MIN_SPEECH_MS && (now-startT)>=MIN_REC_MS){
        silentMs+=dt;
        if(silentMs>=SILENCE_LIMIT){ stopped=true; try{ ctx.close(); }catch(e){} onSilence(); return; }
      }
      else { silentMs=Math.max(0,silentMs-dt*0.5); }
      raf=setTimeout(tick,150);
    };
    raf=setTimeout(tick,150);
  }catch(e){ /* مفيش VAD؟ التسجيل شغال عادي بالحد الأقصى 3 دقايق */ }
  return { stop:()=>{ stopped=true; try{ clearTimeout(raf); }catch(e){} try{ ctx&&ctx.close(); }catch(e){} },
           spoke:()=>_spokeMs };
}

async function geminiTranscribe(blob){
  let lastErr=null;
  for(let attempt=0; attempt<3; attempt++){
    if(attempt>0) await new Promise(r=>setTimeout(r, attempt*1200));
    try{ return await _geminiOnce(blob); }
    catch(e){ lastErr=e; if(String(e&&e.message)!=="NET") throw e; }
  }

}
async function _geminiOnce(blob){
  const audio_b64=await blobToB64(blob);
  const { data, error }=await sb.functions.invoke("os-transcribe",{ body:{ audio_b64, mime:blob.type||"audio/mp4" } });
  if(error) throw new Error("NET");
  if(data&&data.error==="MISSING_KEY"){ VOICE_GEMINI=false; throw new Error("MISSING_KEY"); }
  if(!data||data.error||!data.text) throw new Error((data&&data.error)||"EMPTY");
  return String(data.text).trim();
}

const HALLU=["اشترك في القناة","اشتركوا في القناة","شكرا للمشاهدة","شكراً للمشاهدة","لا تنسى الاشتراك","فعّل الجرس","ترجمة نانسي قنقر","المزيد من الفيديوهات","سبحان الله وبحمده","إلى اللقاء","See you next time","Thanks for watching","المرجو الاشتراك"];
function stripHallucination(text){

}

function transcriptQualityGate(text, recSecs){
  const words=String(text||"").trim().split(/\s+/).filter(Boolean).length;

${f.subject||"................"}

الطرف الأول: ${f.party_a||""}        التوقيع: ......................
الطرف الثاني: ${f.party_b||""}        التوقيع: ......................`;

async function sendAsk(){
  track("action","ask_send");
  const inp=$("askIn"); const q=inp.value.trim(); if(!q) return;

  const c=$("chat"); const tp=document.createElement("div"); tp.className="msg ai";

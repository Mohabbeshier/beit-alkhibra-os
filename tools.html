async function paintCustody(){
  try{
    let q=sb.from("os_custody").select("*").order("handed_at",{ascending:false}).limit(30);
    if(!isOwnerOps()) q=q.eq("assigned_to",ME.id);
    const { data }=await q; const rows=data||[];
    if(!rows.length){ $("cuBox").innerHTML='<div class="empty">مفيش عهدة مسجلة'+(isOwnerOps()?'':' عليك')+'.</div>'; return; }
    $("cuBox").innerHTML=rows.map(c=>'<div class="card flat"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(c.item)+'</b>'+(c.status==="مسلَّمة"?'<span class="badge b-blue">في العهدة</span>':c.status==="تالفة"?'<span class="badge b-red">تالفة</span>':'<span class="badge b-green">اترجعت \u2713</span>')+'</div>'
      +'<div class="meta"><span>'+esc(c.assigned_name||"")+'</span>'+(c.serial_no?'<span class="dot"></span><span>#'+esc(c.serial_no)+'</span>':'')+'<span class="dot"></span><span>'+relativeTime(c.handed_at)+'</span></div>'
      +(isOwnerOps()&&c.status==="مسلَّمة"?'<div class="row-actions" style="margin-top:8px"><button class="btn ghost sm" data-cur="'+c.id+'">استرجاع</button></div>':'')
      +'</div>').join("");
    $("cuBox").querySelectorAll("[data-cur]").forEach(b=>b.onclick=async()=>{
      const { error }=await sb.from("os_custody").update({ status:"مُرجَعة", returned_at:new Date().toISOString() }).eq("id",b.dataset.cur);
      if(error){ toast("معرفناش نسجل الاسترجاع","bad"); return; }
      toast("اترجعت","ok"); paintCustody();
    });
  }catch(e){ $("cuBox").innerHTML=failBox("معرفناش نجيب العهدة.",paintCustody); }
}

async function paintDelegations(){

    $("dgBox").innerHTML=rows.map(d=>{
      const active=new Date(d.starts)<=new Date()&&new Date(d.ends)>=new Date();

      return '<div class="card flat"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+(meMgr?("\u2190 "+esc(nameOf(d.deputy_id)||"نائب")):(esc(nameOf(d.manager_id)||"مدير")+" فوّضك"))+'</b>'+(active?'<span class="badge b-green">نشط</span>':'<span class="badge b-grey">منتهي/قادم</span>')+'</div>'

async function openSalesFunnel(){
  openSheet('<h3>المبيعات والليدز</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">قمع المبيعات الحيّ ومؤشر الاستجابة خلال 24 ساعة لعملاء الموقع</div><div id="sfBox"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div><button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');

    let h='<div class="stats">'
      +'<div class="stat"><div class="n">'+(f.leads_total||0)+'</div><div class="l">إجمالي الليدز</div></div>'
      +'<div class="stat"><div class="n">'+(f.website_clients_total||0)+'</div><div class="l">عميل من الموقع</div></div>'

    h+='<div class="sec-h">تصنيف الليدز <span class="ln"></span></div><div class="card flat">'
      +bar(hot,"var(--red)","ساخن — يحتاج تواصل فوري","")
      +bar(warm,"#F59E0B","دافي — متابعة خلال الأسبوع","")
      +bar(cold,"var(--blue)","بارد — متابعة على المدى الطويل","")+'</div>';
    if(f.pipeline_value_egp) h+='<div class="card flat" style="text-align:center"><div class="muted" style="font-size:11.5px">قيمة الـpipeline</div><b style="font-size:19px;color:var(--green-d)">'+Number(f.pipeline_value_egp).toLocaleString("ar-EG")+' جنيه</b></div>';
    /* وعد الـ24 ساعة */
    const broken=k.broken_promise||0;
    h+='<div class="sec-h">الاستجابة خلال 24 ساعة <span class="ln"></span></div>';
    h+='<div class="card flat"'+(broken?' style="border-color:#FCA5A5;background:#FFF5F5"':'')+'>'
      +'<div class="stats" style="margin-bottom:0">'
      +'<div class="stat"><div class="n">'+(k.total_website_clients||0)+'</div><div class="l">عميل موقع</div></div>'

function paintPresence(){
  const box=$("presBox"); if(!box) return;
  const ppl=PROFILES.filter(p=>p.id!==ME.id);
  const on=ppl.filter(p=>presState(p.id)==="on");
  const away=ppl.filter(p=>presState(p.id)==="away");
  const off=ppl.filter(p=>!presState(p.id)).sort((a,b)=>new Date(b.last_seen_at||0)-new Date(a.last_seen_at||0));
  const pill=(p,bg,bd,dot,glow)=>'<span style="display:inline-flex;align-items:center;gap:6px;background:'+bg+';border:1px solid '+bd+';border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800"><span style="width:8px;height:8px;border-radius:50%;background:'+dot+';box-shadow:0 0 0 3px '+glow+'"></span>'+esc(p.name)+'</span>';
  let h='<div class="sec-h">الفريق دلوقتي <span class="ln"></span></div><div class="card flat">';
  if(on.length||away.length){
    h+='<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:'+(off.length?'10px':'0')+'">'
      +on.map(p=>pill(p,"#EAFBEF","#BBE7C6","var(--green-d)","rgba(46,125,50,.15)")).join("")
      +away.map(p=>pill(p,"#FFFBEB","#FDE68A","#F59E0B","rgba(245,158,11,.15)")).join("")
      +'</div>';
    if(away.length) h+='<div class="muted" style="font-size:10.5px;margin:-4px 0 8px">= فاتح المنظومة بس مش قدام الشاشة دلوقتي</div>';
  } else {
    h+='<div class="muted" style="font-size:12px;margin-bottom:'+(off.length?'8px':'0')+'">محدش تاني فاتح دلوقتي</div>';
  }
  h+=off.slice(0,6).map(p=>'<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:#cbd5e1"></span><span style="font-weight:700;flex:1">'+esc(p.name)+'</span><span class="muted" style="font-size:11px">'+esc(lastSeenTxt(p))+'</span></div>').join("");

async function paintRoadmap(){

function validateReqFields(kind){
  const fs=REQ_SCHEMAS[kind]||[]; let ok=true;
  for(const f of fs){
    const el=$(f.id); if(!el) continue;
    const err=$(f.id+"Err"); const v=el.value.trim();
    const fail=(msg)=>{ ok=false; el.style.borderColor="var(--red)"; if(err){ err.style.display="block"; err.style.color="var(--red)"; err.textContent=msg; } setTimeout(()=>el.style.borderColor="",2500); };
    if(f.req&&!v){ fail("الحقل ده مطلوب"); continue; }
    if(!v) continue;
    if(f.type==="number"){ const n=parseFloat(v); if(isNaN(n)||n<=0){ fail("لازم رقم موجب"); continue; } }
    if(f.type==="date"&&f.future){ if(v<today()){ fail("التاريخ ده فات — اختار تاريخ جاي"); continue; } }
    if(err) err.style.display="none";
  }
  return ok;
}
function collectReqFields(kind){
  const fs=REQ_SCHEMAS[kind]||[]; const data={}; const parts=[];
  for(const f of fs){
    const el=$(f.id); if(!el) continue; const v=el.value.trim(); if(!v) continue;
    let disp=v;
    if(f.type==="select"){ const o=f.opts.find(x=>x[0]===v); if(o) disp=o[1]; }
    if(f.id==="fAmount") disp=parseFloat(v).toLocaleString("ar-EG")+" ج";
    data[f.id.slice(1).toLowerCase()]=v;
    parts.push(REQ_FIELD_LABELS[f.id]+": "+disp);
  }
  return { data: Object.keys(data).length?data:null, summary: parts.join(" · ") };

function attachListSearch(inputId, boxId, placeholder){
  const box=$(boxId); if(!box) return;
  const host=box.parentNode;
  if(document.getElementById(inputId)) return;
  const inp=document.createElement("input");
  inp.id=inputId; inp.type="search"; inp.placeholder=placeholder||"دوّر…";
  inp.setAttribute("inputmode","search");
  inp.style.cssText="width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:13.5px;margin-bottom:10px";
  host.insertBefore(inp,box);
  const apply=()=>{
    const q=inp.value.trim();
    let shown=0, hiddenHeads=[];
    [...box.children].forEach(el=>{
      if(el.classList&&el.classList.contains("sec-h")){ hiddenHeads.push(el); el.style.display=""; return; }
      const txt=el.textContent||"";
      const ok=!q||txt.includes(q);
      el.style.display=ok?"":"none";
      if(ok) shown++;
    });
    /* اخفي عناوين الأقسام اللي مبقاش تحتها حاجة */
    hiddenHeads.forEach(h=>{
      let any=false;
      let n=h.nextElementSibling;
      while(n&&!(n.classList&&n.classList.contains("sec-h"))){ if(n.style.display!=="none"){ any=true; break; } n=n.nextElementSibling; }
      h.style.display=any?"":"none";
    });
    let empty=document.getElementById(inputId+"__none");
    if(!shown&&q){
      if(!empty){ empty=document.createElement("div"); empty.id=inputId+"__none"; empty.className="empty"; empty.textContent="مفيش نتايج للبحث ده."; box.appendChild(empty); }
      empty.style.display="";
    } else if(empty) empty.style.display="none";
  };
  inp.oninput=apply;
  box._listSearchApply=apply;   /* عشان يتنادى بعد إعادة الرسم */
}
function makeSearchable(selectId, placeholder){
  const sel=$(selectId); if(!sel) return;
  if(sel.options.length<8) return;              /* القوايم القصيرة متحتاجش بحث */
  if(sel.dataset.searchable==="1") return;
  sel.dataset.searchable="1";
  const inp=document.createElement("input");

  inp.setAttribute("inputmode","search");
  inp.style.cssText="width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;margin-bottom:6px";
  sel.parentNode.insertBefore(inp,sel);
  const all=[...sel.options].map(o=>({v:o.value,t:o.textContent,g:o.dataset||{}}));
  inp.oninput=()=>{
    const q=inp.value.trim();

    sel.innerHTML=keep.map(o=>'<option value="'+esc(o.v)+'"'+(o.v===cur?" selected":"")+'>'+esc(o.t)+'</option>').join("");
    if(!keep.length) sel.innerHTML='<option value="">مفيش نتايج</option>';

}

function bindSheetMic(btnId, taId, opts){
  const b=$(btnId); if(!b) return;
  if(!micSupported()){ b.style.display="none"; return; }
  b.onclick=async()=>{
    if(sRecOn){ await stopSheetMic(); return; }
    sBtnId=btnId; sTaId=taId; sOpts=Object.assign({},S_DEFAULT,opts||{});
    if(VOICE_GEMINI && hasMediaRec()){
      try{
        sStream=await navigator.mediaDevices.getUserMedia({audio:true});
        sMediaRec=new MediaRecorder(sStream, recMime()?{mimeType:recMime()}:undefined);
        sChunks=[]; sMediaRec.ondataavailable=(e)=>{ if(e.data&&e.data.size) sChunks.push(e.data); };
        sMediaRec.start(); sRecOn=true; sEngine="gemini";
        b.innerHTML=sOpts.rec; b.classList.add("on");
        window._sRecStartT=performance.now();
        sVad=startVAD(sStream,
          ()=>{ if(sRecOn){ toast("حسّيت إنك خلصت — بكتب كلامك","ok"); stopSheetMic(); } },
          (rms,th)=>{ const sb2=sBtnId?$(sBtnId):null; if(sb2){ const k=Math.min(1,rms/(th*2)); sb2.style.boxShadow="0 0 0 "+Math.round(2+k*9)+"px rgba(30,136,229,"+(0.12+k*0.25).toFixed(2)+")"; } });
        setTimeout(()=>{ if(sRecOn){ toast("وصلنا للحد الأقصى 3 دقائق","ok"); stopSheetMic(); }},180000);
        return;
      }catch(e){ if(e&&e.name==="NotAllowedError"){ toast("لازم تسمح بالميكروفون","bad"); return; } }
    }
    if(!dictSupported()){ toast("التسجيل مش متاح هنا — اكتب بإيدك","bad"); return; }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    sRec=new SR(); sRec.lang="ar-EG"; sRec.continuous=true; sRec.interimResults=true;
    const ta=$(taId); sCommit=ta.value?(ta.value+" "):"";
    sRec.onresult=(e)=>{ let it=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) sCommit+=t+" "; else it+=t; } ta.value=(sCommit+it).trim(); };
    sRec.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("لازم تسمح بالميكروفون","bad"); stopSheetMic(); } };
    sRec.onend=()=>{ if(sRecOn&&sEngine==="dict"){ try{ sRec.start(); }catch(_e){} } };
    try{ sRec.start(); sRecOn=true; sEngine="dict"; b.innerHTML=sOpts.recDict; b.classList.add("on"); }
    catch(e){ toast("معرفناش نبدأ التسجيل","bad"); }
  };
}
async function stopSheetMic(discard){
  if(!sRecOn) return;
  sRecOn=false;
  const _svadRef=sVad;
  try{ sVad&&sVad.stop(); }catch(e){} sVad=null;
  const _noSpeechS = noRealSpeech(_svadRef);
  const o=sOpts||S_DEFAULT;
  const b=sBtnId?$(sBtnId):null; if(b){ b.innerHTML=o.idle; b.classList.remove("on"); b.style.boxShadow=""; }
  if(sEngine==="gemini"){
    const blob=await new Promise((res)=>{ try{ sMediaRec.onstop=()=>{ const bl=new Blob(sChunks,{type:(sMediaRec&&sMediaRec.mimeType)||"audio/mp4"}); try{ sStream.getTracks().forEach(t=>t.stop()); }catch(_e){} res(bl); }; sMediaRec.stop(); }catch(e){ res(null); } });
    if(discard||!blob||!blob.size) return;
    if(_noSpeechS){ toast("مسمعتش كلام واضح — جرّب تاني","bad"); return; }
    if(b){ b.disabled=true; b.innerHTML=o.busy; }
    let okDone=false;
    try{
      let text=await geminiTranscribe(blob);
      text=stripHallucination(text);
      if(!text){ toast("مطلعش كلام مفهوم من التسجيل","bad"); throw new Error("EMPTY"); }
      const recSecs=window._sRecStartT?(performance.now()-window._sRecStartT)/1000:0;
      transcriptQualityGate(text,recSecs);
      text=await autoPolish(text);
      try{ sb.rpc("os_track",{ p_kind:"voice", p_name:sTaId||"mic" }).then(()=>{}); }catch(e){}
      const ta=$(sTaId);
      if(ta){
        const prev=ta.value;
        ta.value=(prev?prev+" ":"")+text;
        showVoiceUndo(ta,prev);
      }
      okDone=true;
      /* عبقرية: في نموذج الطلب — وزّع على الخانات أوتوماتيك من غير زرار */
      if(sTaId==="rDet" && $("rTitle") && !$("rTitle").value.trim() && $("rSmartFill")){
        toast("بوزّع كلامك على النموذج أوتوماتيك…","ok");
        setTimeout(()=>{ try{ $("rSmartFill").click(); }catch(e){} },200);
      }
    }catch(e){ transErrToast(e); }
    if(b){ b.disabled=false; b.innerHTML=o.idle; }
    if(okDone&&typeof o.onDone==="function"){ try{ o.onDone(); }catch(_e){} }
  } else {
    try{ sRec&&sRec.stop(); }catch(e){}
    if(!discard&&typeof o.onDone==="function"){ try{ o.onDone(); }catch(_e){} }
  }
}

function decState(d,tasks){
  const t=d.task_id?tasks[d.task_id]:null;
  if(t){
    const late=t.status!=="done"&&t.deadline&&new Date(t.deadline).getTime()<Date.now();
    if(t.status==="done") return ["done","اتنفذ","var(--green-d)"];
    if(late) return ["late","متأخر","var(--red)"];
    if(t.status==="review") return ["open","في المراجعة","#7C3AED"];
    return ["open","شغّال","var(--blue)"];
  }
  if(!d.owner_id) return ["noowner","بلا مسؤول","#F59E0B"];
  return ["open","مسجّل","#94a3b8"];
}
function paintDecBoard(){
  const decs=window._dbDecs||[], tasks=window._dbTasks||{}, minName=window._dbMin||{};
  const f=window._dbFilter||"all";
  const counts={all:decs.length,done:0,late:0,open:0,noowner:0};
  decs.forEach(d=>{ const s=decState(d,tasks)[0]; counts[s]=(counts[s]||0)+1; });
  $("dbStats").innerHTML='<div class="stats">'
    +'<div class="stat"><div class="n">'+counts.all+'</div><div class="l">قرار</div></div>'
    +'<div class="stat"><div class="n">'+counts.done+'</div><div class="l">اتنفذ</div></div>'
    +'<div class="stat'+(counts.late?' stat-hot':'')+'"><div class="n">'+counts.late+'</div><div class="l">متأخر</div></div>'
    +'<div class="stat'+(counts.noowner?' stat-hot':'')+'"><div class="n">'+counts.noowner+'</div><div class="l">بلا مسؤول</div></div></div>';
  let list=decs;
  if(f!=="all") list=decs.filter(d=>decState(d,tasks)[0]===f);
  if(!list.length){ $("dbBox").innerHTML='<div class="empty">'+(decs.length?"مفيش قرارات بالفلتر ده.":"مفيش قرارات لسه — سجّل أول قرار من تقرير الاجتماع.")+'</div>'; return; }

      +'<div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><b style="font-size:13.5px">'+esc(d.decision||"")+'</b>'
      +'<div class="muted" style="font-size:11.5px;margin-top:3px">'

      +'</div><span class="badge" style="background:'+s[2]+'22;color:'+s[2]+';border:1px solid '+s[2]+'55;white-space:nowrap">'+s[1]+'</span></div>'
      +(d.task_id?'<button class="lnk" data-dbt="'+esc(d.task_id)+'" style="font-size:11.5px;margin-top:6px">افتح المهمة ↗</button>':'')

      $("ubBox").innerHTML=h; return;
    }

    }

    const ua=Object.entries(users).sort((a,b)=>b[1]-a[1]).slice(0,5);

    if(errs.length) h+='<div class="sec-h">آخر أخطاء الواجهة <span class="ln"></span></div>'+errs.slice(0,5).map(e=>'<div class="card flat" style="border-color:#FCA5A5"><b style="font-size:12.5px">'+esc(e.name||"")+'</b><div class="muted" style="font-size:11px;margin-top:2px">'+esc(e.user_name||"")+' · '+fmtDate(e.at)+'</div></div>').join("");
    $("ubBox").innerHTML=h;
  }catch(e){ $("ubBox").innerHTML=failBox("معرفناش نجيب بيانات الاستخدام.",openUsageBoard); }

async function paintSysDiag(){
  const box=$("shDiag"); if(!box) return;
  try{
    const { data }=await sb.from("os_ai_diag").select("*").order("ts",{ascending:false}).limit(5);
    const rows=data||[];
    if(!rows.length){ box.innerHTML='<div class="empty">مفيش تشخيصات — الذكاء شغّال من غير أعطال مسجّلة.</div>'; return; }
    box.innerHTML=rows.map(r=>{
      const inf=r.info||{};
      const kind=inf.selftest?"فحص ذاتي":inf.reviewer_failed?"فشل مراجع":inf.exception?"استثناء":"محاولات فاشلة";
      const isBad=!inf.selftest;
      let summary="";
      if(inf.selftest){ const p=inf.selftest.probes||[]; summary=p.filter(x=>x.ok).length+" من "+p.length+" شغّال"; }
      else if(inf.reviewer_failed){ summary=(inf.reviewer_failed[0]&&inf.reviewer_failed[0].err||"").slice(0,90); }
      else if(inf.exception){ summary=String(inf.exception).slice(0,90); }
      else if(inf.tried){ summary=(inf.tried.filter(x=>!x.ok)[0]||{}).err||""; summary=String(summary).slice(0,90); }
      return '<div class="card flat" style="border-right:4px solid '+(isBad?'var(--red)':'var(--green-d)')+'"><b style="font-size:12.5px">'+kind+'</b>'+(summary?'<div class="muted" style="font-size:11px;margin-top:2px;direction:ltr;text-align:left">'+esc(summary)+'</div>':'')+'<div class="muted" style="font-size:10.5px;margin-top:3px">'+relativeTime(r.ts)+'</div></div>';
    }).join("");
  }catch(e){ box.innerHTML='<div class="empty">القراءة متاحة للإدارة وفريق التطوير بس.</div>'; }
}

function notifBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    _beepCtx=_beepCtx||new AC();
    if(_beepCtx.state==="suspended") return; /* iOS: مفيش صوت من غير تفاعل — هيشتغل بعد أول لمسة */
    const o=_beepCtx.createOscillator(), g=_beepCtx.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.06;
    o.connect(g); g.connect(_beepCtx.destination);
    o.start(); o.frequency.exponentialRampToValueAtTime(1320,_beepCtx.currentTime+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001,_beepCtx.currentTime+0.22);
    o.stop(_beepCtx.currentTime+0.25);
  }catch(e){}
}

/* ===== Smart silence detector (VAD): يحس إن الكلام خلص ويقفل لوحده ===== */
let _lastNoise=null, _lastNoiseAt=0;
function startVAD(stream, onSilence, onLevel){
  let ctx=null, raf=null, stopped=false, _spokeMs=0;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    if(ctx.state==="suspended"){ try{ ctx.resume(); }catch(e){} }
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser(); an.fftSize=2048;
    src.connect(an);
    const buf=new Float32Array(an.fftSize);
    /* تكيفي: أول 0.9 ثانية بنقيس ضوضاء المكان، والعتبات بتتحسب نسبةً ليها */
    let noiseFloor=0, calSamples=0, calibrated=false, warnedNoSound=false;
    /* لو اتعايرنا من أقل من 5 دقايق نبدأ بالقيمة المحفوظة — معايرة أسرع */
    const cachedOK=_lastNoise!=null && (Date.now()-_lastNoiseAt)<300000;
    const CAL_MS=cachedOK?300:900;
    if(cachedOK){ noiseFloor=_lastNoise; }
    let hadSpeech=false, speechMs=0, silentMs=0, last=performance.now(), startT=last;
    const SILENCE_LIMIT=4000;      /* سكوت 4 ثواني = خلصت */
    const MIN_SPEECH_MS=1200;      /* لازم يكون اتكلم 1.2 ثانية فعلًا قبل ما الأوتو-ستوب يشتغل */
    const MIN_REC_MS=2500;         /* وأول 2.5 ثانية من التسجيل محمية بالكامل */
    const tick=()=>{
      if(stopped) return;
      an.getFloatTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
      const rms=Math.sqrt(sum/buf.length);
      const now=performance.now(); const dt=now-last; last=now;
      if(!calibrated){
        noiseFloor+=rms; calSamples++;
        if(now-startT>=CAL_MS){
          const fresh=Math.max(noiseFloor/Math.max(1,calSamples),0.0035);
          noiseFloor=cachedOK?Math.max((fresh+_lastNoise)/2,0.0035):fresh;
          _lastNoise=noiseFloor; _lastNoiseAt=Date.now();
          calibrated=true;
        }
        raf=setTimeout(tick,150); return;
      }
      const SPEECH_T=Math.max(noiseFloor*3.2,0.014);   /* كلام = أعلى بوضوح من ضوضاء المكان */
      const SILENCE_T=Math.max(noiseFloor*1.7,0.009);  /* سكوت = قريب من أرضية الضوضاء */
      if(typeof onLevel==="function"){ try{ onLevel(rms, SPEECH_T); }catch(e){} }
      /* إنذار "مش سامعك": 6 ثواني من البداية ومفيش أي كلام واصل */
      if(!hadSpeech && !warnedNoSound && (now-startT)>=6000){ warnedNoSound=true; toast("مش سامعك — اتأكد إن المايك شغال ومش مكتوم","bad"); }
      if(rms>SPEECH_T){ hadSpeech=true; speechMs+=dt; _spokeMs=speechMs; silentMs=0; }
      else if(rms<SILENCE_T && hadSpeech && speechMs>=MIN_SPEECH_MS && (now-startT)>=MIN_REC_MS){
        silentMs+=dt;
        if(silentMs>=SILENCE_LIMIT){ stopped=true; try{ ctx.close(); }catch(e){} onSilence(); return; }
      }
      else { silentMs=Math.max(0,silentMs-dt*0.5); }
      raf=setTimeout(tick,150);
    };
    raf=setTimeout(tick,150);
  }catch(e){ /* مفيش VAD؟ التسجيل شغال عادي بالحد الأقصى 3 دقايق */ }
  return { stop:()=>{ stopped=true; try{ clearTimeout(raf); }catch(e){} try{ ctx&&ctx.close(); }catch(e){} },
           spoke:()=>_spokeMs };
}

/* بوابة جودة: نص قصير جدًا مقارنة بمدة التسجيل = تفريغ ناقص غالبًا */
function transcriptQualityGate(text, recSecs){
  const words=String(text||"").trim().split(/\s+/).filter(Boolean).length;
  if(recSecs>=12 && words < recSecs*0.45){
    toast("التفريغ شكله ناقص ("+words+" كلمة من تسجيل "+Math.round(recSecs)+" ثانية) — راجعه أو سجّل تاني","bad");
    return false;
  }
  return true;
}
/* بوابة تصحيح أوتوماتيكية: تصحيح سمعي + أسماء الفريق + ترقيم — بصمت وبأمان */
async function autoPolish(text){
  try{
    const t=String(text||"").trim();
    if(t.split(/\s+/).length<12) return t; /* القصير مش محتاج */
    const names=PROFILES.map(p=>p.name).join("، ");
    const out=await askAI({ prompt:"النص ده جاي من تفريغ صوتي بالعامية المصرية وفيه غالبًا أخطاء سمعية. صحّح الأخطاء السمعية والإملائية وظبط الترقيم بس — متغيرش المعنى ولا تضيف ولا تحذف كلام، ومتلخصش. أسماء فريق الشركة للاسترشاد: "+names+". رجّع النص المصحح فقط من غير أي مقدمة.\nالنص: \""+t+"\"", dept:null, mode:"fast", max_tokens:600 });
    const c=String(out||"").trim();
    return (c && c.length>t.length*0.5 && c.length<t.length*2) ? c : t;
  }catch(e){ return text; }
}

async function toggleVoice(){
  if(recording){ await stopVoice(); return; }
  if(VOICE_GEMINI && hasMediaRec()){
    try{
      streamC=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecC=new MediaRecorder(streamC, recMime()?{mimeType:recMime()}:undefined);
      chunksC=[]; mediaRecC.ondataavailable=(e)=>{ if(e.data&&e.data.size) chunksC.push(e.data); };
      mediaRecC.start(); recording=true; recEngine="gemini"; secsC=0;
      window._recStartT=performance.now();
      vadC=startVAD(streamC,
        ()=>{ if(recording){ toast("حسّيت إنك خلصت كلام — بكتبه حالًا","ok"); stopVoice(); } },
        (rms,th)=>{ const mb=$("micBtn"); if(mb){ const k=Math.min(1,rms/(th*2)); mb.style.boxShadow="0 0 0 "+Math.round(3+k*11)+"px rgba(229,57,53,"+(0.12+k*0.25).toFixed(2)+")"; } });
      const b=$("micBtn"); b.classList.add("rec"); b.innerHTML=STOP_BTN_SVG;
      setTimeout(()=>{ if(recording){ toast("وصلنا للحد الأقصى 3 دقائق — اتوقف تلقائيًا","ok"); stopVoice(); }},180000);
      const h=$("micHint"); if(h) h.textContent="بسجّل — اتكلم براحتك وبعدين اضغط إيقاف";
      timerC=setInterval(()=>{ secsC++; const hh=$("micHint"); if(hh) hh.textContent="بسجّل "+fmtSecs(secsC)+" — اتكلم براحتك وبعدين اضغط إيقاف"; },1000);
      return;
    }catch(e){ if(e&&e.name==="NotAllowedError"){ toast("لازم تسمح بالميكروفون","bad"); return; } }
  }
  startDictation();
}
function startDictation(){
  if(!dictSupported()){ toast("التسجيل الصوتي مش متاح هنا — اكتب بإيدك","bad"); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); rec.lang="ar-EG"; rec.continuous=true; rec.interimResults=true;
  committed=$("vtext").value?($("vtext").value+" "):"";
  rec.onresult=(e)=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal) committed+=tr+" "; else interim+=tr; } $("vtext").value=(committed+interim).trim(); };
  rec.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("لازم تسمح بالميكروفون","bad"); stopVoice(); } };
  rec.onend=()=>{ if(recording&&recEngine==="dict"){ try{ rec.start(); }catch(_e){} } };
  try{ rec.start(); recording=true; recEngine="dict"; $("micBtn").classList.add("rec"); $("micBtn").innerHTML=STOP_BTN_SVG; $("micHint").textContent="بسجّل بالإملاء… اتكلم وبعدين اضغط لإيقاف."; }
  catch(e){ toast("معرفناش نبدأ التسجيل","bad"); }
}
async function stopVoice(){
  if(!recording) return;
  recording=false; clearInterval(timerC);
  const _vadRef=vadC;
  try{ vadC&&vadC.stop(); }catch(e){} vadC=null;
  window._noSpeechC = noRealSpeech(_vadRef);
  const b=$("micBtn"); if(b){ b.classList.remove("rec"); b.innerHTML=MIC_BTN_SVG; b.style.boxShadow=""; }
  if(recEngine==="gemini"){
    const h=$("micHint");
    const blob=await new Promise((res)=>{ try{ mediaRecC.onstop=()=>{ const bl=new Blob(chunksC,{type:(mediaRecC&&mediaRecC.mimeType)||"audio/mp4"}); try{ streamC.getTracks().forEach(t=>t.stop()); }catch(_e){} res(bl); }; mediaRecC.stop(); }catch(e){ res(null); } });
    if(!blob||!blob.size){ if(h) h.textContent="التسجيل اتوقف."; return; }
    if(window._noSpeechC){ if(h) h.textContent="مسمعتش كلام واضح — دوس وجرّب تاني."; toast("مسمعتش كلام واضح","bad"); return; }
    if(h) h.textContent="جيميناي بيسمع التسجيل…";
    try{
      let text=await geminiTranscribe(blob);
      text=stripHallucination(text);
      if(!text){ if(h) h.textContent="مطلعش كلام مفهوم — جرّب تاني."; return; }
      try{ sb.rpc("os_track",{ p_kind:"voice", p_name:"contracts" }).then(()=>{}); }catch(e){}
      const recSecs=window._recStartT?(performance.now()-window._recStartT)/1000:0;
      const okQ=transcriptQualityGate(text,recSecs);
      if(h) h.textContent="بوابة المراجعة: بصحّح النص أوتوماتيك…";
      text=await autoPolish(text);
      const ta=$("vtext");
      if(ta){ const prev=ta.value; ta.value=(prev?prev+" ":"")+text; showVoiceUndo(ta,prev); }
      if(h) h.textContent= okQ? "اتكتب واتصحّح أوتوماتيك — حوّله لعقد على طول." : "اتكتب — بس راجعه كويس (التفريغ ممكن يكون ناقص).";
    }catch(e){
      transErrToast(e);
      const miss=String((e&&e.message)||"").includes("MISSING_KEY");
      if(h) h.textContent= miss? "جيميناي مش متفعّل لسه — المايك هيشتغل بالإملاء العادي مؤقتًا." : "حصلت مشكلة في السمع — جرّب تسجّل تاني.";
    }
  } else {
    try{ rec&&rec.stop(); }catch(e){}
    smartFixText();
  }
}

let lastRawVoice="";
async function smartFixText(){
  const ta=$("vtext"); if(!ta) return;
  const text=ta.value.trim(); if(!text){ const h=$("micHint"); if(h) h.textContent="اضغط واتكلم تاني — أو حوّل النص لعقد."; return; }
  lastRawVoice=text;
  const hint=$("micHint"); if(hint) hint.textContent="بيصحّح النص بالذكاء…";
  const names=PROFILES.map(p=>p.name).join("، ");
  const prompt=`النص التالي اتكتب بالإملاء الصوتي بالعامية المصرية، والإملاء بيغلط كتير: بيستبدل كلمات بكلمات شبهها في النطق (مثلاً "ميتينج" بتتسمع "200 جنيه"، و"يسلم" بتتسمع "يخلص") وبيضيف أرقام وأوقات مالهاش لازمة. صحّح النص بالسياق ده: شركة استشارات هندسية مصرية — عقود، تسليم ورق، رخص، رسومات، اجتماعات/ميتينج، دفعات، مقاولات، مواعيد. أسماء الفريق: ${names}. المدن: الشيخ زايد، أكتوبر، حدائق أكتوبر. أي رقم أو مبلغ أو وقت غريب في النص اشتبه فيه إنه كلمة اتسمعت غلط واحكم بالمعنى. رجّع النص المصحّح فقط، من غير أي مقدمة أو شرح.\nالنص: ${text}`;
  try{
    const fixed=(await askAI({ prompt, mode:"fast", max_tokens:400 })).trim();
    if(fixed && fixed!==text){
      ta.value=fixed;
      if(hint){ hint.innerHTML='اتصحّح بالذكاء — راجعه. <a href="#" id="undoFix">رجّع اللي اتسمع</a>';
        const u=$("undoFix"); if(u) u.onclick=(e)=>{ e.preventDefault(); ta.value=lastRawVoice; hint.textContent="رجّعنا النص زي ما اتسمع."; }; }
    } else if(hint){ hint.textContent="النص تمام ✓ — حوّله لعقد."; }
  }catch(e){ if(hint) hint.textContent="معرفناش نصحّح دلوقتي — عدّل بإيدك أو جرّب زرار التصحيح."; }
}
async function extractContract(){
  const text=$("vtext").value.trim();
  if(!text){ toast("اكتب أو سجّل تفاصيل العقد الأول","bad"); return; }
  const btn=$("toContract"); btn.disabled=true; btn.textContent="بيحلّل…";
  const prompt=`النص جاي من إملاء صوتي بالعامية المصرية وممكن فيه أخطاء سمعية (كلمات اتسمعت غلط بكلمات شبهها) — فسّرها بالسياق وصحّحها قبل الاستخراج. ${chosenCtype?("نوع العقد المختار: "+chosenCtype+". "):""}استخرج بيانات العقد ورجّعها JSON بالمفاتيح دي بالظبط: {"contract_type":"","party_a":"","party_b":"","subject":"","scope":"","value_egp":"","payment":"","duration":"","start_date":"","special":"","notes":""}. لو معلومة مش موجودة سيبها فاضية "". النص:\n`+text;
  try{
    let out=await askAI({ prompt, dept:"legal", mode:"deep", want_json:true, max_tokens:800 });
    out=out.replace(/```json/gi,"").replace(/```/g,"").trim();
    const s=out.indexOf("{"), eI=out.lastIndexOf("}");
    if(s>=0&&eI>=0) out=out.slice(s,eI+1);
    contractFields=JSON.parse(out);
    if(!contractFields.contract_type && chosenCtype) contractFields.contract_type=chosenCtype;
    if(!contractFields.party_a) contractFields.party_a="بيت الخبرة للمشروعات الهندسية";
    showContractFields(contractFields);
    toast("اتحلّل ✓ راجع البيانات","ok");
  }catch(e){
    toast("الذكاء مردّش صح — اكتب البيانات بإيدك","bad");
    showContractFields({});
  }finally{ btn.disabled=false; btn.textContent="حوّل لعقد بالذكاء"; }
}

  const txt=contractText(f);
  $("cout").innerHTML=`<div class="sec-h">المسودة <span class="ln"></span></div><div class="contract-out" id="cbody">${esc(txt)}</div>
    <div class="row-actions">${canWrite()?`<button class="btn green" id="cSave">احفظ في معرفة القسم</button>`:""}<button class="btn ghost" id="cCopy">نسخ</button><button class="btn ghost" id="cDl">تحميل</button></div>
    <div class="note-line">مسودة آلية — للمراجعة القانونية البشرية قبل أي اعتماد.</div>`;
  const cs=$("cSave"); if(cs) cs.onclick=()=>saveContract(f,txt);
  $("cCopy").onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(txt); toast("اتنسخ ✓","ok"); };

  $("cout").scrollIntoView({behavior:"smooth"});
}
function contractText(f){
  const d=new Date().toLocaleDateString("ar-EG");
  return `عقد ${f.contract_type||"اتفاق"}

إنه في يوم ${d} تم الاتفاق بين كل من:
الطرف الأول: ${f.party_a||"................"}
الطرف الثاني: ${f.party_b||"................"}

تمهيد:
لما كان الطرف الأول يرغب في إسناد الأعمال المبيّنة بهذا العقد إلى الطرف الثاني، وكان الطرف الثاني يقبل ذلك وفقًا للشروط الآتية، فقد اتفق الطرفان وهما بكامل الأهلية المعتبرة قانونًا على ما يلي:

البند الأول — محل العقد:
${f.subject||"................"}

البند الثاني — نطاق الأعمال:
${f.scope||"................"}

البند الثالث — قيمة العقد:
القيمة الإجمالية ${f.value_egp?(f.value_egp+" جنيه مصري"):"................"}.

البند الرابع — طريقة وشروط الدفع:
${f.payment||"................"}

البند الخامس — مدة التنفيذ:
${f.duration||"................"}${f.start_date?("، تبدأ من تاريخ "+f.start_date):""}.

البند السادس — التزامات الطرفين:
يلتزم الطرف الثاني بتنفيذ الأعمال بالجودة المتفق عليها وفي المواعيد المحددة، ويلتزم الطرف الأول بسداد المستحقات في مواعيدها.

البند السابع — شروط خاصة:
${f.special||"لا يوجد."}

البند الثامن — فسخ العقد:
يحق لأي من الطرفين فسخ العقد عند إخلال الطرف الآخر بالتزاماته بعد إخطاره كتابةً ومنحه مهلة لتصحيح المخالفة.

البند التاسع — الاختصاص القضائي:
تختص المحاكم المصرية بالفصل في أي نزاع ينشأ عن تنفيذ أو تفسير هذا العقد.

ملاحظات: ${f.notes||"—"}

حُرّر العقد من نسختين بيد كل طرف نسخة.

الطرف الأول: ${f.party_a||""}        التوقيع: ......................
الطرف الثاني: ${f.party_b||""}        التوقيع: ......................`;
}
async function saveContract(f,txt){
  const btn=$("cSave"); btn.disabled=true; btn.textContent="بيحفظ…";
  const payload={ dept:"legal", title:"عقد — "+((f.subject||f.contract_type||"مسودة").slice(0,80)), content:txt, source:"voice-contract", added_by:ME.id };
  const { error }=await sb.from("os_knowledge").insert(payload);
  if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent="احفظ في معرفة القسم"; return; }
  toast("اتحفظ في معرفة القسم ✓","ok"); btn.textContent="اتحفظ ✓";
}

function dayLabel(iso){
  const d=new Date(iso); const t=new Date(); t.setHours(0,0,0,0);
  const dd=new Date(d); dd.setHours(0,0,0,0);
  const diff=Math.round((t-dd)/86400000);

    offices.forEach(d=>list.push(["dept:"+d.key,offLabel(d.key,d.name)]));
    var e=DEPT_BY_KEY["engineering"]; if(e) list.push(["dept:engineering",(DEPT_EMOJI["engineering"]||"")+" "+e.name]);
  } else if(myDeptKey()==="reception"){
    var rc=DEPT_BY_KEY["reception"]; if(rc) list.push(["dept:reception",(DEPT_EMOJI["reception"]||"")+" "+rc.name]);
    offices.forEach(d=>list.push(["dept:"+d.key,(DEPT_EMOJI[d.key]||"")+" "+d.name]));
    others.forEach(d=>{ if(d.key!=="reception") list.push(["dept:"+d.key,(DEPT_EMOJI[d.key]||"")+" "+d.name]); });
  } else {
    var k=myDeptKey();
    if(k&&DEPT_BY_KEY[k]) list.push(["dept:"+k, (DEPT_EMOJI[k]||"")+" "+DEPT_BY_KEY[k].name]);
    if(isOff(k)){
      ["engineering","legal","finance"].forEach(dk=>{ if(DEPT_BY_KEY[dk]){ var ch="pair:"+[k,dk].sort().join("__"); if(!list.find(c=>c[0]===ch)) list.push([ch,(DEPT_EMOJI[dk]||"")+" "+DEPT_BY_KEY[dk].name]); } });
    }
  }
  (window._activeChans||[]).forEach(ch=>{ if(String(ch).indexOf("pair:")===0 && !list.find(c=>c[0]===ch)) list.push([ch,pairLabel(ch)]); else if(String(ch).indexOf("dm:")===0 && !list.find(c=>c[0]===ch)) list.push([ch,dmLabel(ch)]); });
  if(String(chatChannel).indexOf("pair:")===0 && !list.find(c=>c[0]===chatChannel)){
    list.push([chatChannel,pairLabel(chatChannel)]);
  }
  if(String(chatChannel).indexOf("dm:")===0 && !list.find(c=>c[0]===chatChannel)){
    list.push([chatChannel,dmLabel(chatChannel)]);
  }
  if(!list.length) list.push(["company","الشركة كلها"]);
  return list;
}

async function renderEvents(){

  const card=(e,old)=>`<div class="card" style="${old?'opacity:.55':''}">
    <div class="req-top"><div class="t">${esc(e.title)}</div>${(e.by_id===ME.id||isOwnerOps())?`<button class="qbtn" data-del-ev="${e.id}" title="حذف">${ICONS.trash}</button>`:""}</div>

function tlNote(note){
  if(!note) return "";
  var m=note.match(/https?:\/\/\S+/);
  if(!m) return esc(note);
  var url=m[0];
  var pre=note.slice(0,m.index).replace(/\s*[:：]\s*$/,"");
  var post=note.slice(m.index+url.length);
  var isWa=/wa\.me|whatsapp/i.test(url);
  var label=isWa?"📲 رد عبر واتساب":"🔗 افتح الرابط";
  var col=isWa?"#166534":"#0D2538",bg=isWa?"#E8F5E9":"#EAF2FB",bd=isWa?"#86EFAC":"#CFE0F3";
  var a='<a href="'+url.replace(/"/g,"%22")+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:'+col+';background:'+bg+';border:1px solid '+bd+';border-radius:7px;padding:3px 9px;text-decoration:none">'+label+'</a>';
  return (pre?esc(pre)+" ":"")+a+(post?" "+esc(post):"");
}

function openSmartTask(){
  openSheet(`<h3>مهام بالكلام</h3>
    <div class="field"><label>قول المهام كلها مرة واحدة — والذكاء هيفصلها</label>
    <textarea id="stStory" style="min-height:120px" placeholder="مثلاً: الهندسة تخلص رسومات الفيلا الخميس، والقانوني يراجع المقايسة بكرة، ورخصة زايد عاجلة"></textarea></div>
    <div class="row-actions" style="margin:-2px 0 12px"><button class="btn ghost sm" id="stMic">سجّل بصوتك</button><button class="btn ghost sm" id="stManual">＋ مهمة يدوي</button></div>
    <button class="btn" id="stGo">فصّلها لمهام</button>
    <div id="stPrev"></div>`);
  bindSheetMic("stMic","stStory");
  $("stManual").onclick=()=>{ stopSheetMic(true); openNewTask(); };
  $("stGo").onclick=parseSmartTasks;
}
function matchProfile(nm){
  if(!nm) return null;
  const n=String(nm).trim(); if(!n) return null;
  return PROFILES.find(p=>p.name===n) || PROFILES.find(p=>p.name.includes(n)||n.includes(p.name)) || null;
}
async function parseSmartTasks(){
  await stopSheetMic();
  const story=$("stStory").value.trim();
  if(!story){ toast("اكتب أو سجّل المهام الأول","bad"); return; }
  const btn=$("stGo"); btn.disabled=true; btn.textContent="بيفصّل المهام…";
  const team=PROFILES.map(p=>p.name).join("، ");
  const d=new Date();
  const prompt=`النهارده ${d.toLocaleDateString("ar-EG",{weekday:"long"})} الموافق ${d.toISOString().slice(0,10)}. الكلام التالي فيه مهمة أو أكتر اتقالت بالعامية المصرية، وممكن يكون من إملاء صوتي فيه أخطاء سمعية — صحّحها بالسياق (شركة استشارات هندسية). أسماء الفريق المتاحة: ${team}. فصّل الكلام لمهام ورجّع JSON بالشكل ده بالظبط: {"tasks":[{"title":"","assignee":"","deadline":"","priority":"medium"}]} — title فعل واضح مختصر، assignee اسم من الفريق زي ما هو بالظبط أو "" لو مش محدد، deadline بصيغة YYYY-MM-DD محسوبة من تاريخ النهارده (بكرة/الخميس/بعد أسبوع…) أو "" لو مفيش، priority واحدة من high/medium/low (عاجل=high). الكلام:\n${story}`;
  try{
    let out=await askAI({ prompt, mode:"fast", want_json:true, max_tokens:700 });
    out=out.replace(/```json/gi,"").replace(/```/g,"").trim();
    const s=out.indexOf("{"), eI=out.lastIndexOf("}");
    if(s>=0&&eI>=0) out=out.slice(s,eI+1);
    const arr=(JSON.parse(out).tasks||[]).filter(t=>t&&String(t.title||"").trim());
    if(!arr.length) throw new Error("empty");
    await renderSmartPreview(arr);
  }catch(e){ toast("معرفناش نفصّل — جرّب صياغة تانية أو ضيف يدوي","bad"); }
  btn.disabled=false; btn.textContent="فصّلها لمهام";
}
async function renderSmartPreview(arr){
  /* البند ٥: تحميل موظفي القسم + ترشيح الأقل تحميلًا */
  let _wl={}, _topId="";
  try{
    const { data:_tk }=await sb.from("os_tasks").select("assignee_id").neq("status","done").limit(2000);
    (_tk||[]).forEach(t=>{ if(t.assignee_id) _wl[t.assignee_id]=(_wl[t.assignee_id]||0)+1; });
    const _mates=PROFILES.filter(p=>p.dept===PROFILE.dept&&p.id!==ME.id);
    _mates.forEach(p=>{ if(_wl[p.id]==null) _wl[p.id]=0; });
    if(_mates.length){ _mates.sort((a,b)=>(_wl[a.id]||0)-(_wl[b.id]||0)); _topId=_mates[0].id; }
  }catch(e){}
  const _wlTxt=(id)=>_wl[id]!=null?" · "+_wl[id]+" مهمة":"";
  const opts=(sel)=>`<option value="">ليّا (${esc(PROFILE.name)})</option>`+PROFILES.filter(p=>p.id!==ME.id).map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${esc(p.name)}${_wlTxt(p.id)}</option>`).join("");
  /* ربط كل المهام بمشروع واحد (اختياري) */
  let _prjOpts='<option value="">من غير مشروع</option>';
  try{ const { data:_ps }=await sb.from("os_projects").select("id,name").eq("status","open").order("created_at",{ascending:false}).limit(100);
    _prjOpts+=(_ps||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(""); }catch(e){}
  const okDate=(v)=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?v:"";
  $("stPrev").innerHTML=`<div class="sec-h">راجع المهام (${arr.length}) <span class="ln"></span></div>`+
    (_topId?`<div class="muted" style="font-size:11.5px;margin:-4px 0 8px">الأرقام جنب الأسماء = مهام مفتوحة دلوقتي. اللي الذكاء مش لاقيله حد، رشّحنا أقل واحد مشغول.</div>`:"")+
    `<div class="field" style="margin-bottom:10px"><label>كلها مربوطة بمشروع؟ (اختياري)</label><select id="stPrj">${_prjOpts}</select></div>`+
    arr.map((t,i)=>{ const m=matchProfile(t.assignee); const _selId=m?m.id:(_topId||""); const pr=["high","low"].includes(t.priority)?t.priority:"medium";
      return `<div class="card flat" data-row="${i}" data-prio="${pr}" style="background:var(--soft)">
      <div class="field" style="margin-bottom:8px"><input class="st-title" value="${esc(t.title)}"/></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="st-ass" style="flex:1;min-width:140px;padding:9px;border:1.6px solid var(--line);border-radius:10px;background:#fff">${opts(_selId)}</select>
        <input class="st-due" type="date" value="${okDate(t.deadline)}" style="padding:9px;border:1.6px solid var(--line);border-radius:10px;background:#fff"/>
        ${pr==="high"?'<span class="badge b-red">عاجل</span>':""}
        <button class="qbtn st-del" title="حذف">${ICONS.trash}</button>
      </div></div>`; }).join("")+
    `<button class="btn green" id="stSave">احفظ المهام ✓</button>`;
  makeSearchable("stPrj","دوّر باسم المشروع…");
  $("stPrev").querySelectorAll(".st-del").forEach(b=>b.onclick=()=>{ b.closest("[data-row]").remove(); if(!$("stPrev").querySelector("[data-row]")) $("stPrev").innerHTML=""; });
  $("stSave").onclick=saveSmartTasks;
  setTimeout(()=>{ const el=$("stSave"); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },60);
}
async function saveSmartTasks(){
  const _stPrjEl=$("stPrj"); const _stPrjVal=_stPrjEl?_stPrjEl.value:"";
  const rows=[...$("stPrev").querySelectorAll("[data-row]")];
  const payloads=rows.map(r=>{
    const title=r.querySelector(".st-title").value.trim(); if(!title) return null;
    const assId=r.querySelector(".st-ass").value;
    const ap=assId?BY_ID[assId]:PROFILE;
    return { title, assignee_id:ap.id, assignee_name:ap.name, dept:ap.dept,
      deadline:r.querySelector(".st-due").value||null, priority:r.dataset.prio||"medium",
      type:"task", status:"new", progress:0, project_id:_stPrjVal||null, created_by:ME.id, created_by_name:PROFILE.name };
  }).filter(Boolean);
  if(!payloads.length){ toast("مفيش مهام تتحفظ","bad"); return; }
  const btn=$("stSave"); btn.disabled=true; btn.textContent="بيحفظ…";
  const { error }=await sb.from("os_tasks").insert(payloads);
  if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent="احفظ المهام ✓"; return; }
  closeSheet(); toast("اتحفظت "+payloads.length+" مهمة ✓","ok"); renderTasks();
}
/* === فريق 3: كاشف تعارض المواعيد — حمل اليوم للمسؤول === */
async function loadConflictHint(assId, dateStr, hintEl){
  if(!hintEl) return;
  if(!assId||!dateStr){ hintEl.style.display="none"; return; }
  try{
    const start=dateStr+"T00:00:00", end=dateStr+"T23:59:59";
    const { count }=await sb.from("os_tasks").select("id",{count:"exact",head:true})
      .eq("assignee_id",assId).neq("status","done").neq("status","archived")
      .gte("deadline",start).lte("deadline",end);
    const n=count||0;
    if(n===0){ hintEl.style.display="none"; return; }
    const who=BY_ID[assId]?BY_ID[assId].name:"المسؤول";
    hintEl.style.display="block";
    hintEl.style.color = n>=3 ? "var(--red)" : "var(--amber, #B7791F)";
    hintEl.textContent = who+" عنده "+n+(n===1?" تسليمة":" تسليمات")+" تانية نفس اليوم"+(n>=3?" — اليوم محمّل، فكّر في موعد تاني":"");
  }catch(e){ hintEl.style.display="none"; }
}
async function openNewTask(){
  const opts=PROFILES.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc((DEPT_BY_KEY[p.dept]&&DEPT_BY_KEY[p.dept].name)||p.dept||"")}</option>`).join("");
  let prjOpts='<option value="">من غير مشروع</option>';
  try{ const { data:prjs }=await sb.from("os_projects").select("id,name").eq("status","open").order("created_at",{ascending:false}).limit(100); prjOpts+=(prjs||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(""); }catch(e){}
  openSheet(`<h3>مهمة جديدة</h3>
    <div class="field"><label>العنوان</label><input id="tTitle" placeholder="اكتب المهمة…"/></div>
    <div class="field"><label>تفاصيل المطلوب <span class="muted" style="font-size:11px">(اختياري — بس بيوفر أسئلة كتير بعدين)</span></label><textarea id="tDetails" placeholder="إيه المطلوب بالظبط؟ فيه حاجة لازم ياخد باله منها؟"></textarea></div>
    <div class="field"><label>مسندة لمين؟</label><select id="tAss"><option value="${ME.id}">أنا (${esc(PROFILE.name)})</option>${opts}</select></div>
    <div class="field"><label>مربوطة بمشروع؟</label><select id="tProject">${prjOpts}</select></div>
    <div class="field"><label>الموعد النهائي</label><input id="tDue" type="date" min="${todayStr()}"/><div class="muted" id="tDueHint" style="font-size:12px;display:none;margin-top:4px"></div></div>
    <div class="row-actions" style="margin:-4px 0 10px"><button class="btn ghost sm" data-tq="1">بكرة</button><button class="btn ghost sm" data-tq="3">بعد 3 أيام</button><button class="btn ghost sm" data-tq="7">أسبوع</button></div>
    <div class="field"><label>الأولوية</label><select id="tPrio"><option value="medium">عادي</option><option value="high">عاجل</option><option value="low">منخفض</option></select></div>
    <div class="row-actions"><button class="btn green" id="tCreate">إنشاء المهمة</button><button class="btn sm" id="tCreateMore" style="background:var(--blue);color:#fff">احفظ وضيف تانية</button><button class="btn ghost" onclick="closeSheet()">إلغاء</button></div>`);
  addMicTo("tTitle"); addMicTo("tDetails");
  makeSearchable("tAss","دوّر باسم الموظف…"); makeSearchable("tProject","دوّر باسم المشروع…");
  const _tConf=()=>loadConflictHint($("tAss").value,$("tDue").value,$("tDueHint"));
  $("tDue").onchange=_tConf; $("tAss").onchange=_tConf;
  document.querySelectorAll("[data-tq]").forEach(b=>b.onclick=()=>{
    const d=new Date(); d.setDate(d.getDate()+parseInt(b.dataset.tq,10));
    $("tDue").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    _tConf();
  });
  const doSave=async(keepOpen)=>{
    const title=$("tTitle").value.trim(); if(!title){ toast("اكتب عنوان المهمة","bad"); return; }
    const assId=$("tAss").value; const ap=BY_ID[assId];
    const btn=keepOpen?$("tCreateMore"):$("tCreate"); const orig=btn.textContent;
    btn.disabled=true; btn.textContent="بيتحفظ…";
    const details=$("tDetails").value.trim();
    const payload={ title, assignee_id:assId, assignee_name:ap?ap.name:PROFILE.name, dept:ap?ap.dept:PROFILE.dept, deadline:$("tDue").value||null, priority:$("tPrio").value, project_id:$("tProject").value||null, type:"task", status:"new", progress:0, created_by:ME.id, created_by_name:PROFILE.name };
    const { data:nt, error }=await sb.from("os_tasks").insert(payload).select("id").single();
    if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent=orig; return; }
    if(details&&nt&&nt.id){ try{ await sb.from("os_task_updates").insert({ task_id:nt.id, by_id:ME.id, by_name:PROFILE.name, note:"المطلوب: "+details, percent:null }); }catch(e){} }
    if(keepOpen){
      toast("اتحفظت ✓ — كمّل التانية","ok");
      $("tTitle").value=""; $("tDetails").value="";
      btn.disabled=false; btn.textContent=orig; $("tTitle").focus(); renderTasks();
    } else { closeSheet(); toast("اتحفظت ✓","ok"); renderTasks(); }
  };
  $("tCreate").onclick=()=>doSave(false);
  $("tCreateMore").onclick=()=>doSave(true);
}

/* ===================== FAB (context: new request / new task) ===================== */
function ensureFab(){
  let fab=$("fab");
  if(!fab){ fab=document.createElement("button"); fab.id="fab"; fab.className="fab"; fab.textContent="＋"; document.body.appendChild(fab); }
  fab.onclick=()=>{ if(activeTab==="tasks"){ taskFilter==="events"?openNewEvent():openSmartTask(); } else if(activeTab==="req") openNewReq(); };
  const show = activeTab==="req" || (activeTab==="tasks" && (taskFilter==="events" || canWrite()));
  fab.style.display=show?"flex":"none";
}
const _switch=switchTab; switchTab=function(id){ if(recording) stopVoiceSilent(); try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){} if(id!=="chat"){ try{ if(chatSub){ sb.removeChannel(chatSub); chatSub=null; } }catch(e){} } _switch(id); ensureFab(); };

$("btnLogin").onclick=doLogin;
$("btnJoin").onclick=openJoinForm;
$("inPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
$("btnLogout").onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} ME=null; PROFILE=null; chatHistory=[]; const f=$("fab"); if(f)f.style.display="none"; showLogin(); };

boot();

/* ===== v33: كاش — فحص نسخة حي ===== */
const APP_VERSION=40;
let _newVer=null, _verTimer=null;
function applyNewVersion(){ try{ location.replace(location.pathname+"?v="+(_newVer||Date.now())); }catch(e){ location.reload(); } }
function safeToReload(){
  try{
    if(typeof recording!=="undefined" && recording) return false;
    if(typeof sRecOn!=="undefined" && sRecOn) return false;
    const a=document.activeElement;
    if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")) return false;
    const md=document.getElementById("modal");
    if(md && md.classList.contains("open")) return false;
    const ci=document.getElementById("chIn");
    if(ci && (ci.value||"").trim()) return false;
  }catch(e){ return false; }
  return true;
}
function showVerBanner(secs){
  let b=document.getElementById("verBanner");
  if(!b){
    b=document.createElement("button");
    b.id="verBanner";
    b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--blue-d);color:#fff;border:none;padding:11px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer";
    b.onclick=applyNewVersion;
    document.body.appendChild(b);
  }
  b.textContent = secs!=null ? ("نسخة أحدث وصلت — هتتحدث تلقائيًا خلال "+secs+" ثانية (أو اضغط دلوقتي)") : "نسخة أحدث متاحة — هتتحدث أول ما تخلص اللي في إيدك (أو اضغط دلوقتي)";
}
function scheduleAutoUpdate(){
  if(_verTimer) return;
  if(document.hidden){ applyNewVersion(); return; }
  if(!safeToReload()){
    showVerBanner(null);
    _verTimer=setInterval(()=>{ if(document.hidden||safeToReload()){ clearInterval(_verTimer); _verTimer=null; applyNewVersion(); } },4000);
    return;
  }
  let left=10; showVerBanner(left);
  _verTimer=setInterval(()=>{
    if(!safeToReload() && !document.hidden){ clearInterval(_verTimer); _verTimer=null; scheduleAutoUpdate(); return; }
    left--; if(left<=0){ clearInterval(_verTimer); _verTimer=null; applyNewVersion(); } else showVerBanner(left);
  },1000);
}
async function checkAppVersion(){
  try{
    if(_newVer){ scheduleAutoUpdate(); return; }
    const res=await fetch(location.pathname+"?nocache="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/APP_VERSION\s*=\s*(\d+)/);
    if(m && Number(m[1])>APP_VERSION){ _newVer=m[1]; scheduleAutoUpdate(); }
  }catch(e){}
}
setTimeout(checkAppVersion, 4000);
setInterval(checkAppVersion, 2*60*1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden && _newVer){ applyNewVersion(); } else if(!document.hidden){ checkAppVersion(); } });
</script>

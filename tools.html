<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>بيت الخبرة — أدوات المنظومة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --green:#4CAF50; --green-d:#2E7D32; --green-l:#E8F5E9;
  --blue:#1E88E5; --blue-d:#0D47A1; --blue-l:#E7F0FB;
  --red:#E53935; --red-l:#FDECEA;
  --amber:#F59E0B;
  --ink:#16263a; --muted:#6b7a8d; --line:#e6edf4;
  --bg:#f4f8fc; --card:#ffffff; --soft:#eef4fa;
  --shadow:0 1px 2px rgba(13,71,161,.05), 0 10px 30px rgba(13,71,161,.07);
  --shadow-sm:0 1px 2px rgba(13,71,161,.06);
  --r:18px; --r-sm:12px;
  --font:'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --tabh:72px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--font); background:var(--bg); color:var(--ink); line-height:1.6; font-size:15px; overflow-x:hidden;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
a{color:var(--blue-d);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cfdcea;border-radius:8px;}

/* ---- blueprint accent (signature, subtle) ---- */
.grid-accent{
  position:fixed; inset:0 0 auto 0; height:220px; z-index:0; pointer-events:none; opacity:.55;
  background-image:linear-gradient(rgba(30,136,229,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(30,136,229,.06) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:linear-gradient(#000,transparent); mask-image:linear-gradient(#000,transparent);
}

/* ---- boot / error ---- */
#boot{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);padding:24px;text-align:center;}
#boot .sp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- login ---- */
#login{min-height:100dvh;display:none;align-items:center;justify-content:center;padding:22px;position:relative;z-index:1;}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;}
.login-head{padding:30px 24px 18px;text-align:center;background:linear-gradient(180deg,#fff,#f7fbff);}
.login-head .logo{width:84px;height:84px;border-radius:20px;object-fit:contain;background:#fff;padding:8px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.login-head h1{font-size:21px;font-weight:800;color:var(--blue-d);}
.login-head p{font-size:12px;letter-spacing:.5px;color:var(--green-d);font-weight:700;margin-top:3px;}
.login-body{padding:22px 22px 26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:var(--r-sm);outline:none;background:#fff;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:84px;line-height:1.7;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--r-sm);font-weight:800;font-size:15.5px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 8px 20px rgba(30,136,229,.28);transition:transform .1s,opacity .15s;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.55;}
.btn.green{background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 8px 20px rgba(76,175,80,.28);}
.btn.ghost{background:var(--soft);color:var(--blue-d);box-shadow:none;}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:10px;}
.btn.danger{background:linear-gradient(135deg,#ef5350,var(--red));box-shadow:0 8px 20px rgba(229,57,53,.25);}
.err{background:var(--red-l);color:var(--red);font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none;}

/* ---- app shell ---- */
#app{display:none;min-height:100dvh;position:relative;z-index:1;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar .logo{width:40px;height:40px;border-radius:11px;object-fit:contain;background:#fff;padding:4px;box-shadow:var(--shadow-sm);}
.topbar .ttl{font-weight:800;font-size:16px;color:var(--blue-d);line-height:1.15;}
.topbar .ttl small{display:block;font-size:11px;font-weight:600;color:var(--muted);}
.topbar .sp{flex:1;}
.uchip{display:flex;align-items:center;gap:8px;}
.uchip .nm{font-size:12.5px;font-weight:700;text-align:left;line-height:1.2;}
.uchip .rl{font-size:11px;color:var(--muted);}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--blue-d);}

.wrap{max-width:760px;margin:0 auto;padding:16px 14px 26px;}
.view{display:none;animation:rise .25s ease both;}
.view.active{display:block;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px;}
.page-h h2{font-size:20px;font-weight:800;color:var(--ink);}
.page-h .sub{font-size:12.5px;color:var(--muted);}

.sec-h{display:flex;align-items:center;gap:8px;margin:18px 2px 9px;font-size:14px;font-weight:800;color:var(--blue-d);}
.sec-h .ln{flex:1;height:1px;background:var(--line);}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:15px;margin-bottom:11px;}
.card.flat{box-shadow:none;}
.req-top{display:flex;align-items:flex-start;gap:9px;}
.req-top .t{flex:1;font-weight:800;font-size:15px;line-height:1.4;}
.muted{color:var(--muted);font-size:13px;}
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);}
.dot{width:3px;height:3px;border-radius:50%;background:#c4d1df;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.b-blue{background:var(--blue-l);color:var(--blue-d);}
.b-green{background:var(--green-l);color:var(--green-d);}
.b-amber{background:#FEF3E2;color:#B45309;}
.b-red{background:var(--red-l);color:var(--red);}
.b-grey{background:var(--soft);color:var(--muted);}

.resp-box{margin-top:11px;background:var(--green-l);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--green-d);white-space:pre-wrap;}
.row-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}

.empty{text-align:center;color:var(--muted);padding:30px 16px;}
.empty .big{font-size:30px;margin-bottom:6px;}

/* tasks */
.prog{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:10px;}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));border-radius:999px;transition:width .4s;}
.chips{display:flex;gap:8px;margin-bottom:12px;}
.chip{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--soft);color:var(--muted);}
.chip.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;}
.qbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.qbtn{padding:7px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px;color:var(--blue-d);}
.qbtn.on{background:var(--blue);color:#fff;}

/* contract / voice */
.banner{display:flex;gap:9px;align-items:flex-start;background:#FEF3E2;border:1px solid #FCD9A1;color:#92500c;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:14px;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 14px;}
.mic{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 12px 30px rgba(30,136,229,.32);transition:transform .12s;}
.mic:active{transform:scale(.96);}
.mic.rec{background:linear-gradient(135deg,#ef5350,var(--red));box-shadow:0 0 0 0 rgba(229,57,53,.5);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.45);}70%{box-shadow:0 0 0 18px rgba(229,57,53,0);}100%{box-shadow:0 0 0 0 rgba(229,57,53,0);}}
.mic-hint{font-size:13px;color:var(--muted);font-weight:600;}
.contract-out{white-space:pre-wrap;background:#fff;border:1px dashed #b9c9da;border-radius:14px;padding:16px;font-size:13.5px;line-height:1.9;margin-top:6px;}

/* ask / chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:42vh;padding:6px 2px 8px;}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--shadow-sm);}
.msg.ai{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:5px;}
.msg.me{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;align-self:flex-end;border-bottom-left-radius:5px;}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;font-weight:700;box-shadow:none;text-align:center;max-width:100%;}
.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bd 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes bd{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}
.msg.ai.warn{background:#FFFBF0;border-color:#F3D9A4;}
.warn-tag{font-size:11.5px;font-weight:800;color:#92500c;margin-bottom:6px;}
.deep-tg{padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:var(--soft);color:var(--muted);}
.deep-tg.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 6px 14px rgba(30,136,229,.25);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;box-shadow:var(--shadow-sm);}
.stat .n{font-size:24px;font-weight:900;color:var(--blue-d);line-height:1.2;}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;}
.dept-card{display:flex;align-items:center;gap:11px;}
button.stat,button.dept-card{font-family:inherit;cursor:pointer;}
.stat-hot{border-color:#FBCFE8;background:linear-gradient(135deg,#FFF1F2,#fff);}
.stat-hot .n{color:var(--red);}
.lnk{background:none;border:none;color:var(--blue-d);font-weight:700;cursor:pointer;padding:0;font-family:inherit;}
/* آيفون: منع الزوم التلقائي عند الكتابة + احترام منطقة الهوم بار */
@media (max-width:640px){ input,textarea,select{ font-size:16px !important; } }
#tabbar{ padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
/* مؤشر "بيفكر" — نقط متحركة */
.thinking-dots{ display:inline-flex; gap:4px; align-items:center; }
.thinking-dots i{ width:7px;height:7px;border-radius:50%;background:var(--blue);animation:tdots 1.2s infinite; }
.thinking-dots i:nth-child(2){ animation-delay:.2s } .thinking-dots i:nth-child(3){ animation-delay:.4s }
@keyframes tdots{ 0%,80%,100%{opacity:.25;transform:scale(.85)} 40%{opacity:1;transform:scale(1.1)} }
/* offline / error banners */
#offlineBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;}
/* loading skeleton */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:10px;height:56px;margin-bottom:10px;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* unread chat badge */
.chat-badge{display:none;position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:900;align-items:center;justify-content:center;}
.chat-badge.on{display:flex;}
/* confirm dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8888;display:flex;align-items:center;justify-content:center;}
.confirm-box{background:#fff;border-radius:20px;padding:28px 22px;max-width:320px;width:90%;text-align:center;}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px;background:rgba(244,248,252,.95);backdrop-filter:blur(8px);border-radius:16px;border:1px solid var(--line);margin-top:8px;}
.composer input{flex:1;padding:12px 14px;border:1.6px solid var(--line);border-radius:999px;outline:none;background:#fff;}
.composer input:focus{border-color:var(--blue);}
.composer .send{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(76,175,80,.3);}
.composer .send:disabled{opacity:.5;}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;position:relative;}
.tabbar .tab .ic{font-size:21px;line-height:1;}
.tabbar .tab.on{color:var(--blue-d);}
.tabbar .tab.on .ic{transform:translateY(-1px);}
.tabbar .tab .nbadge{position:absolute;top:9px;inset-inline-end:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(13,38,58,.45);backdrop-filter:blur(3px);}
.modal.open{display:flex;animation:fade .2s both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1) both;}
@keyframes up{from{transform:translateY(40px);}to{transform:none;}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--blue-d);}
.sheet .x{position:absolute;}
.fab{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);inset-inline-start:18px;z-index:25;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(76,175,80,.4);}

/* toast */
.toast{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green-d);} .toast.bad{background:var(--red);}

.note-line{font-size:12px;color:var(--amber);font-weight:700;margin-top:8px;}
</style>
</head>
<body>
  <div id="offlineBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;">⚠️ انقطع الاتصال — بنحاول نرجع...</div>
<div class="grid-accent"></div>

<!-- BOOT -->
<div id="boot"><div class="sp"></div><div>بيحمّل المنظومة…</div></div>

<!-- LOGIN -->
<section id="login">

<script>
/* ===================== CONFIG ===================== */

/* ===================== STORAGE SHIM (iOS / sandbox safe) ===================== */
const _mem = {};
const safeStorage = {
  getItem:(k)=>{ try{ return localStorage.getItem(k); }catch(e){ return (k in _mem)?_mem[k]:null; } },
  setItem:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } },
  removeItem:(k)=>{ try{ localStorage.removeItem(k); }catch(e){ delete _mem[k]; } },
};

/* ===================== STATE ===================== */
let sb=null, ME=null, PROFILE=null, _sessionWatchId=null, PROFILES=[], BY_ID={}, DEPTS=[], DEPT_BY_KEY={};
let activeTab="home";
let chatHistory=[];
let askDeptKey=null, askDeep=false;
let contractFields=null, chosenCtype="";
let LAST_JOINS={}, LAST_REQS={};

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);

/* \ud83d\udcc8 تتبع تحركات الاستخدام — خفيف وبيشتغل في الخلفية */
const _trkLast={};
function track(kind,name,meta){
  try{
    if(!window.sb||!window.ME) return;
    if(kind==="screen"){ const k=kind+":"+name, now=Date.now(); if(_trkLast[k]&&now-_trkLast[k]<60000) return; _trkLast[k]=now; }
    sb.rpc("os_track",{ p_kind:kind, p_name:name, p_meta:meta||null }).then(()=>{});
  }catch(e){}
}
/* \u23f3 helper موحد لأزرار Loading */
function withLoading(btn, label, fn){
  const orig=btn.textContent; btn.disabled=true; btn.textContent=label||"\u23f3 جاري…";
  Promise.resolve().then(fn).catch(e=>{ toast(String(e.message||e||"خطأ غير متوقع"),"bad"); }).finally(()=>{ btn.disabled=false; btn.textContent=orig; });
}
function toast(msg,kind){ try{ if(kind==="ok"&&navigator.vibrate) navigator.vibrate(18); }catch(e){} try{ if(kind==="bad") track("error",String(msg||"").slice(0,60)); }catch(e){} const t=$("toast"); t.textContent=msg; t.className="toast show "+(kind||""); clearTimeout(t._t); t._t=setTimeout(()=>{t.className="toast "+(kind||"");},2600); }
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleDateString("ar-EG",{day:"numeric",month:"short"}); }catch(e){ return d; } }
function timeAgo(d){ if(!d) return ""; const s=(Date.now()-new Date(d).getTime())/1000; if(s<60)return"دلوقتي"; if(s<3600)return Math.floor(s/60)+" د"; if(s<86400)return Math.floor(s/3600)+" س"; return Math.floor(s/86400)+" يوم"; }
function initials(n){ const p=String(n||"؟").trim().split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
function firstName(n){ n=(n||'').trim(); return n.split(/\s+/)[0]||n; }
function nameOf(id){ return (BY_ID[id]&&BY_ID[id].name)||"—"; }

/* ===================== MODAL ===================== */
function openSheet(html){ $("sheet").innerHTML=html; $("modal").classList.add("open"); }

/* ===================== BOOT ===================== */
async function boot(){
  if(!window.supabase || !window.supabase.createClient){
    $("boot").innerHTML='<div style="color:var(--red);font-weight:700">معرفناش نحمّل مكتبة Supabase. اتأكد إن النت شغّال وجرّب تاني.</div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ storage:safeStorage, persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });
  let session=null;
  try{ const r=await sb.auth.getSession(); session=r.data.session; }catch(e){}
  if(session && session.user){ await startApp(session.user); }
  else{ showLogin(); }
}
function showLogin(){ $("boot").style.display="none"; $("app").style.display="none"; $("login").style.display="flex"; }

async function doLogin(){
  const email=$("inEmail").value.trim(), pass=$("inPass").value;
  const e=$("loginErr"); e.style.display="none";
  if(!email||!pass){ e.textContent="اكتب الإيميل والباسوورد."; e.style.display="block"; return; }
  const btn=$("btnLogin"); btn.disabled=true; btn.textContent="بيدخل…";
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error){ throw error; }
    await startApp(data.user);
  }catch(err){
    e.textContent = "الإيميل أو الباسوورد غلط."; e.style.display="block";
    btn.disabled=false; btn.textContent="دخول";
  }
}

async function startApp(user){
  ME=user;
  // load profile + lookups
  try{
    const [{data:prof}, {data:profs}, {data:depts}] = await Promise.all([
      sb.from("os_profiles").select("*").eq("id",user.id).maybeSingle(),
      sb.from("os_profiles").select("id,name,email,role,dept,manager_id"),
      sb.from("os_departments").select("*"),
    ]);
    PROFILE = prof || { id:user.id, name:(user.email||"مستخدم").split("@")[0], role:"employee", dept:null, email:user.email };
    PROFILES = profs || [];
    BY_ID={}; PROFILES.forEach(p=>BY_ID[p.id]=p);
    DEPTS = depts || [];
    DEPT_BY_KEY={}; DEPTS.forEach(d=>DEPT_BY_KEY[d.key]=d);
  }catch(e){
    PROFILE = { id:user.id, name:(user.email||"مستخدم").split("@")[0], role:"employee", dept:null };
  }
  $("boot").style.display="none"; $("login").style.display="none"; $("app").style.display="block";
  $("uName").textContent=PROFILE.name;
  $("uRole").textContent=userTitle(PROFILE);
  const av=$("uAvatar"); av.textContent=initials(PROFILE.name);
  av.style.cursor="pointer"; av.title="حسابي"; av.onclick=openMyAccount;
  const nb=$("notifBell"); if(nb) nb.onclick=()=>{ askNotifPermission(); openNotifications(); };
  refreshNotifBadge();
  const col={owner:"#0D47A1",ops:"#1E88E5",manager:"#2E7D32",employee:"#6b7a8d"}[PROFILE.role]||"#1E88E5";
  av.style.background="linear-gradient(135deg,"+col+","+col+"cc)";
  buildTabs();
  switchTab("home");
  subscribeRealtime();
  initOfflineDetect();
  let _lastErrT=0;
  window.addEventListener("unhandledrejection",(e)=>{
    try{
      const now=Date.now(); if(now-_lastErrT<8000) return; _lastErrT=now;
      const msg=String((e&&e.reason&&e.reason.message)||"");
      try{ track("error","unhandled:"+msg.slice(0,60)); }catch(ex){}
      if(msg.indexOf("Failed to fetch")>=0||msg.indexOf("NetworkError")>=0||msg.indexOf("Load failed")>=0){ toast("\u26a1 النت متقلقل — هنعيد المحاولة لوحدنا","bad"); }
    }catch(x){}
  });
  /* تحديث تلقائي هادي للرئيسية كل 90 ثانية */
  setInterval(()=>{ if(activeTab==="home" && !document.hidden && !sRecOn && !recording) renderHome(); },90000);
  // session watch: every 10 min check session is still valid
  _sessionWatchId=setInterval(async()=>{ try{ const r=await sb.auth.getSession(); if(!r.data.session){ clearInterval(_sessionWatchId); toast("انتهت الجلسة — سجّل دخول تاني","bad"); setTimeout(()=>location.reload(),2500); } }catch(e){} },600000);
}

/* ===================== TABS ===================== */
function buildTabs(){
  const tabs=[{id:"home",ic:"🏠",nm:"الرئيسية"},{id:"req",ic:"📥",nm:"الطلبات"}];
  if(canContracts()) tabs.push({id:"contract",ic:"📝",nm:"العقود"});
  tabs.push({id:"ask",ic:"💬",nm:"اسأل"});
  tabs.push({id:"chat",ic:"👥",nm:"الدردشة"});
  tabs.push({id:"tasks",ic:"✅",nm:"المهام"});
  $("tabbar").innerHTML = tabs.map(t=>`
    <button class="tab ${t.id===activeTab?'on':''}" data-tab="${t.id}">
      <span class="ic">${t.ic}</span>${t.nm}
      ${t.id==="req"?`<span class="nbadge" id="reqBadge"></span>`:""}
      ${t.id==="chat"?'<span class="nbadge chat-badge" id="chatBadge" style="position:relative;display:none;background:var(--green-d);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-right:4px;"></span>':""}
    </button>`).join("");
  $("tabbar").querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
}
function switchTab(id){
  track("screen",id);
  if(recording){ stopVoiceSilent(); toast("\ud83c\udf99\ufe0f التسجيل اتقفل عشان غيّرت الشاشة","ok"); }
  if(sRecOn){ stopSheetMic(true); toast("\ud83c\udf99\ufe0f التسجيل اتقفل عشان غيّرت الشاشة","ok"); }
  activeTab=id;
  $("tabbar").querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===id));
  ["home","req","contract","ask","chat","tasks"].forEach(v=>$("v-"+v).classList.toggle("active",v===id));
  if(id==="home") renderHome();
  if(id==="req") renderRequests();
  if(id==="contract") renderContract();
  if(id==="ask") renderAsk();
  if(id==="chat"){ clearChatBadge(); renderChatRoom(); }
  if(id==="tasks") renderTasks();
  window.scrollTo(0,0);
}

/* ===================== AI helper ===================== */
async function askAI(opts){
  const body = Object.assign({ max_tokens:900 }, typeof opts==="string" ? { prompt:opts } : opts);
  const { data, error } = await sb.functions.invoke("os-ai",{ body });
  if(error) throw new Error(error.message||"AI error");
  if(!data) throw new Error("مفيش رد");
  if(data.error) throw new Error(data.error);
  return (data.text||"").trim();
}

function speak(t){
  try{
    if(!window.speechSynthesis){ toast("القراءة الصوتية مش متاحة على المتصفح ده","bad"); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t||"").replace(/[#*_>]/g," ").replace(/[.،؛]/g," ، "));
    u.lang="ar-EG"; u.rate=0.88; u.pitch=1.05; u.volume=1;
    // prefer Arabic voice if available
    const arVoice=window.speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ar"));
    if(arVoice) u.voice=arVoice;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("القراءة الصوتية مش متاحة","bad"); }
}
async function checkVoiceStatus(){
  const el=$("vstat"); if(!el) return;

async function renderHome(){
  const el=$("v-home");

  let tasks=[],reqs=[],evs=[],joins=[];
  try{
    const [tq,rq,eq]=await Promise.all([
      sb.from("os_tasks").select("id,title,status,dept,assignee_id,assignee_name,deadline,priority,progress"),
      sb.from("os_requests").select("id,title,to_id,from_id,status,kind,priority,created_at"),
      sb.from("os_events").select("id,title,at_time,with_who").gte("at_time",new Date(Date.now()-3600e3).toISOString()).order("at_time",{ascending:true}).limit(4)

  const openTasks=tasks.filter(t=>t.status!=="done");
  const pendIn=reqs.filter(r=>(r.to_id===ME.id||r.to_id==null)&&r.from_id!==ME.id&&r.status==="pending");
  const evTxt=evs.length?("أقرب موعد: "+evs[0].title+" "+relTime(evs[0].at_time)+".") : "مفيش مواعيد جاية.";

  const hr=$("homeRefresh"); if(hr) hr.onclick=()=>{ toast("بنحدّث…","ok"); renderHome(); };
  if(!window._overdueReminded){
    const myLate=openTasks.filter(t=>t.assignee_id===ME.id&&t.deadline&&new Date(t.deadline)<new Date());
    if(myLate.length){ window._overdueReminded=true; setTimeout(()=>toast("\u23f0 عندك "+myLate.length+" مهمة متأخرة — ابدأ بيها","bad"),900); }
  }

  else renderEmployeeHome({tasks,openTasks,reqs,pendIn,evs,greet,evTxt});

  wireHome(el);
}

function relTime(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date(), diff=(d-now)/86400000;
  if(diff<0) return "(فات)";
  if(diff<1 && d.getDate()===now.getDate()) return "النهارده "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  if(diff<2) return "بكرة "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
}

/* ===== \ud83d\udcc2 محرك رفع ملفات الموظفين + الأرشيف ===== */
const FILE_CATS=[["general","عام"],["contract","عقد"],["license","رخصة"],["drawing","رسمة هندسية"],["invoice","فاتورة"],["report","تقرير"],["photo","صورة موقع"],["other","حاجة تانية"]];
const FILE_MAX=20*1048576;
const FILE_OK=["pdf","jpg","jpeg","png","webp","doc","docx","xls","xlsx"];
async function uploadEmployeeFile(file, onProg){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();
  if(!FILE_OK.includes(ext)) throw new Error("نوع الملف مش مسموح (PDF/صورة/Word/Excel بس)");
  if(file.size>FILE_MAX) throw new Error("الملف أكبر من 20 ميجا");
  const path=ME.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  // رفع مباشر بصلاحية الموظف المسجّل (RLS authenticated)
  const { error }=await sb.storage.from("client-files").upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw new Error(error.message||"فشل الرفع");
  // لينك موقّع 10 سنين للعرض الداخلي
  const { data:signed }=await sb.storage.from("client-files").createSignedUrl(path, 315360000);
  return { url:(signed&&signed.signedUrl)||"", path, size:file.size, mime:file.type||null };
}

async function registerFile(rec){
  const row=Object.assign({ uploaded_by:ME.id, uploaded_name:PROFILE.name, dept:PROFILE.dept||null }, rec);
  const { error }=await sb.from("os_files").insert(row);
  if(error) throw new Error(error.message);
  track("action","file_"+(rec.kind||"file"));
}

    ]);
    const st=stats||{}; let h="";

    /* 1) مؤشر المساحة البصري (gauge) */
    const pct=Math.min(100, Number(st.used_pct)||0);
    const barCol = pct>80?"var(--red)": pct>50?"#F59E0B":"var(--green-d)";
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">\ud83d\udcca المساحة المستخدمة</b><span style="font-weight:800;color:'+barCol+'">'+fmtBytes(st.total_bytes)+' / 1 GB</span></div>'
      +'<div class="prog" style="height:12px;margin-top:8px;background:#eef2f7"><i style="width:'+Math.max(2,pct)+'%;background:'+barCol+'"></i></div>'
      +'<div class="muted" style="font-size:11px;margin-top:5px">'+pct+'% من الحد المجاني \u00b7 '+(st.total_files||0)+' ملف \u00b7 قاعدة البيانات: '+fmtBytes(st.db_bytes)+'</div>'
      +(pct>80?'<div style="color:var(--red);font-weight:800;font-size:12px;margin-top:6px">\u26a0\ufe0f المساحة قربت تخلص — نظّف الملفات اليتيمة أو فعّل خطة مدفوعة</div>':'')
      +'</div>';

    /* 2) صحة التخزين — مؤشرات سريعة */
    if(health){
      h+='<div class="stats" style="margin-top:10px">'
        +'<div class="stat"><div class="n">'+(health.locked_docs||0)+'</div><div class="l">مستند مقفول \ud83d\udd12</div></div>'
        +'<div class="stat'+((health.expiring_docs||0)?' stat-hot':'')+'"><div class="n">'+(health.expiring_docs||0)+'</div><div class="l">بينتهي قريب</div></div>'
        +'<div class="stat'+((health.orphans||0)?' stat-hot':'')+'"><div class="n">'+(health.orphans||0)+'</div><div class="l">ملف يتيم</div></div></div>';
    }

    /* 3) تفصيل كل bucket */
    if(ov&&ov.length){
      h+='<div class="sec-h">\ud83d\uddc4\ufe0f المخازن <span class="ln"></span></div>';
      const names={"client-files":"ملفات العملاء","os-documents":"المستندات الرسمية"};
      h+='<div class="card flat">'+ov.map(b=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f0f3f7"><b>'+esc(names[b.bucket_id]||b.bucket_id)+'</b><span class="muted">'+b.files+' ملف \u00b7 '+fmtBytes(b.bytes)+'</span></div>').join("")+'</div>';
    }

    /* 4) أكبر الملفات (للتنظيف اليدوي) */
    if(largest&&largest.length){
      h+='<div class="sec-h">\ud83d\udce6 أكبر الملفات <span class="ln"></span></div><div class="card flat">'
        +largest.map(f=>'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><b style="margin-right:8px">'+fmtBytes(f.bytes)+'</b></div>').join("")+'</div>';
    }

    /* 5) الملفات اليتيمة + زرار تنظيف */
    if(health&&(health.orphans||0)>0){
      h+='<div class="card" style="border-color:#FDE68A;background:#FFFDF4;margin-top:10px"><b>\ud83e\uddf9 '+health.orphans+' ملف يتيم</b><div class="muted" style="font-size:11.5px;margin-top:3px">ملفات مرفوعة من أكتر من أسبوع ومش مربوطة بأي عميل أو مستند. ممكن تكون رفعات ناقصة.</div>'
        +'<button class="btn ghost sm" id="stcOrphans" style="margin-top:8px">شوف الملفات اليتيمة</button></div>';
    }

    /* 5.5) ملفات الموظفين حسب القسم */
    if(byDept&&byDept.length){
      const valid=byDept.filter(d=>d.dept);
      if(valid.length){
        h+='<div class="sec-h">\ud83d\udcc2 ملفات الفرق <span class="ln"></span></div><div class="card flat">'
          +valid.map(d=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid #f0f3f7"><b>'+esc((DEPT_BY_KEY[d.dept]&&DEPT_BY_KEY[d.dept].name)||d.dept)+'</b><span class="muted">'+d.active+' نشط \u00b7 '+d.archived+' مؤرشف \u00b7 '+fmtBytes(d.bytes)+'</span></div>').join("")+'</div>';
      }
    }
    /* 6) إعدادات الاحتفاظ (retention) */
    if(ret){
      h+='<div class="sec-h">\u2699\ufe0f مدة الاحتفاظ بالبيانات <span class="ln"></span></div>'
        +'<div class="card flat"><div style="font-size:11.5px;line-height:2">'
        +'\u2022 الإشعارات المقروءة: <b>'+ret.notifications_days+' يوم</b><br>'
        +'\u2022 سجل النشاط: <b>'+ret.activity_days+' يوم</b><br>'
        +'\u2022 تحليلات الاستخدام: <b>'+ret.ui_events_days+' يوم</b><br>'
        +'\u2022 الأرشيف: <b>'+ret.archive_days+' يوم</b></div>'
        +'<div class="muted" style="font-size:10.5px;margin-top:6px">التنظيف بيشتغل أوتوماتيك كل ليلة 1:30 ص</div></div>';
    }

    $("stcBox").innerHTML=h;
    const orb=$("stcOrphans"); if(orb) orb.onclick=()=>openOrphans();
  }catch(e){ $("stcBox").innerHTML='<div class="empty">معرفناش نجيب بيانات التخزين.</div>'; }
}

/* ===== \ud83d\udcc8 تحليلات الاستخدام ===== */
async function openUsageInsights(){
  openSheet('<h3>\ud83d\udcc8 تحليلات الاستخدام</h3><div class="muted" style="margin:-6px 0 12px;font-size:12px">آخر 7 أيام — مين بيستخدم إيه وفين الناس بتقف</div>'
    +'<div id="uiW"><div class="skel"></div><div class="skel"></div></div>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">قفل</button>');
  try{
    const [insR,actR,errR]=await Promise.all([
      sb.from("os_usage_insights").select("*"),
      sb.from("os_user_activity_week").select("*"),
      sb.from("os_ui_events").select("user_name,name,at").eq("kind","error").order("at",{ascending:false}).limit(10)
    ]);
    const ins=insR.data||[], act=actR.data||[], errs=errR.data||[];
    let h="";

    /* أنشط الأعضاء + استنتاج مين محتاج مساعدة */
    h+='<div class="sec-h">\ud83d\udc65 نشاط الفريق <span class="ln"></span></div>';
    if(act.length){
      const sorted=act.slice().sort((a,b)=>(b.actions+b.screens)-(a.actions+a.screens));
      h+='<div class="card flat">'+sorted.map(u=>{
        const stuck=(u.errors>=3)||(u.screens>=10&&u.actions===0);
        return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px"><b style="flex:1">'+esc(firstName(u.user_name||"عضو"))+(stuck?' <span class="badge b-red">محتاج مساعدة؟</span>':'')+'</b>'
          +'<span class="muted" style="font-size:11px">'+u.actions+' فعل \u00b7 '+u.screens+' شاشة'+(u.voice_uses?' \u00b7 \ud83c\udf99\ufe0f'+u.voice_uses:'')+(u.errors?' \u00b7 \u26a0\ufe0f'+u.errors:'')+'</span></div>';
      }).join("")+'</div>';
      const ghosts=PROFILES.filter(p=>p.id!==ME.id&&!act.find(a=>a.user_id===p.id));
      if(ghosts.length) h+='<div class="card" style="border-color:#FDE68A;background:#FFFDF4;font-size:12px;margin-top:6px">\ud83d\udca1 <b>مدخلوش المنظومة الأسبوع ده:</b> '+ghosts.map(p=>esc(firstName(p.name))).join("، ")+'</div>';
    } else h+='<div class="empty">لسه مفيش بيانات — هتتجمع تلقائيًا مع الاستخدام.</div>';

    /* أكتر الشاشات */
    const scr=ins.filter(i=>i.kind==="screen").sort((a,b)=>b.hits-a.hits).slice(0,6);
    if(scr.length){
      const mx=scr[0].hits||1;
      h+='<div class="sec-h">\ud83d\udcf1 أكتر الشاشات استخدامًا <span class="ln"></span></div><div class="card flat">'
        +scr.map(x=>'<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>'+esc(x.name)+'</b><span class="muted">'+x.hits+' \u00b7 '+x.users+' عضو</span></div><div class="prog" style="height:6px;margin-top:3px"><i style="width:'+Math.round(x.hits/mx*100)+'%"></i></div></div>').join("")+'</div>';
    }

    /* أكتر الأفعال */
    const acts=ins.filter(i=>i.kind==="action").sort((a,b)=>b.hits-a.hits).slice(0,5);
    if(acts.length) h+='<div class="sec-h">\u26a1 أكتر الأفعال <span class="ln"></span></div><div class="card flat">'+acts.map(x=>'<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><b>'+esc(x.name)+'</b><span class="muted">'+x.hits+'</span></div>').join("")+'</div>';

    /* الأخطاء الأخيرة = فين الناس بتقف */
    if(errs.length){
      h+='<div class="sec-h">\u26a0\ufe0f آخر الأخطاء اللي قابلت الناس <span class="ln"></span></div><div class="card flat">'
        +errs.map(e2=>'<div style="font-size:11.5px;padding:3px 0"><b>'+esc(firstName(e2.user_name||""))+':</b> '+esc(e2.name)+' <span class="muted">\u00b7 '+timeAgo(e2.at)+'</span></div>').join("")+'</div>';
    }
    $("uiW").innerHTML=h;
  }catch(e){ $("uiW").innerHTML='<div class="empty">معرفناش نجيب التحليلات.</div>'; }
}

        }).join("")+'</div>';
    }

    /* \ud83d\uddc2\ufe0f عدادات إدارية للقسم */

        sb.from("os_documents").select("id",{count:"exact",head:true}).eq("dept",key),

      ]);

        +'<div class="stat"><div class="n">'+(docR.count||0)+'</div><div class="l">مستند</div></div>'
        +'<div class="stat"><div class="n">'+(knR.count||0)+'</div><div class="l">معلومة معرفة</div></div></div>';
    }catch(e){}

    /* \ud83d\udca1 السيستم لاحظ — استنتاجات تلقائية */
    const obs=[];
    if(late>0) obs.push("\u26a0\ufe0f فيه "+late+" مهمة متأخرة — ابدأ بيهم النهارده");
    const stale=open.filter(t=>isStale(t));
    if(stale.length) obs.push("\u23f3 "+stale.length+" مهمة راكدة من 3+ أيام من غير أي تحديث");
    members.forEach(p=>{
      const cnt=open.filter(t=>t.assignee_id===p.id).length;
      if(cnt===0&&open.length>2) obs.push("\ud83d\udc64 "+firstName(p.name)+" مفيش عليه مهام مفتوحة — ممكن ياخد من الضغط");
      if(cnt>=5) obs.push("\ud83d\udd25 "+firstName(p.name)+" شايل "+cnt+" مهام — راجع التوزيع");
    });
    members.forEach(p=>{
      if(p.last_seen_at && (Date.now()-new Date(p.last_seen_at).getTime())>5*86400000) obs.push("\ud83d\udeab "+firstName(p.name)+" مدخلش المنظومة من 5+ أيام");
    });
    if(obs.length){

    window._dpReportTxt="\ud83d\udccb تقرير "+dep.name+"\n"+new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})
      +"\n\nمفتوحة: "+open.length+" \u00b7 عاجل: "+high+" \u00b7 متأخرة: "+late+" \u00b7 خلصت: "+doneW
      +(obs.length?"\n\nملاحظات:\n"+obs.slice(0,4).map(o=>"\u2022 "+o).join("\n"):"")
      +"\n\nمن منظومة بيت الخبرة";
  }catch(e){ $("dpStats").innerHTML=""; $("dpTasks").innerHTML='<div class="empty">معرفناش نجيب البيانات.</div>'; }
}

async function loadRequests(){

    sb.from("os_requests").select("*").order("created_at",{ascending:false}),
    isOwnerOps()? sb.from("os_join_requests").select("*").eq("status","pending").order("created_at",{ascending:false}) : Promise.resolve({data:[]})
  ]);
  return { reqs:reqs||[], joins:(jr&&jr.data)||[] };
}

  if(mine.length){ try{ sb.rpc("os_mark_reqs_seen").then(()=>{}); }catch(e){} }

function kindBadge(k){ const m={info:["معلومة","b-blue"],deadline:["موعد","b-amber"],approval:["موافقة","b-green"],modify:["تعديل","b-blue"],document:["مستند","b-grey"]}; const x=m[k]||["طلب","b-grey"]; return `<span class="badge ${x[1]}">${x[0]}</span>`; }

    try{
      const names=PROFILES.map(p=>p.name).join("، ");
      const prompt=`إنت بتساعد في ملء نموذج طلب داخلي في شركة هندسية مصرية. استخرج من الكلام ده المعلومات التالية وارجع JSON فقط بدون أي شرح:
{"title":"عنوان قصير للطلب","to_name":"اسم الشخص المقصود من القايمة دي [${names}] أو فاضي لو مش واضح","kind":"info أو approval أو deadline أو modify أو document","priority":"high أو normal","details":"تفاصيل الطلب كاملة"}
الكلام: "${raw}"`;
      const res=await askAI({prompt,dept:null,mode:"fast",max_tokens:300});
      const _js=res.indexOf("{"), _je=res.lastIndexOf("}");
      const clean = _js>=0&&_je>_js ? res.slice(_js,_je+1) : res;
      const d=JSON.parse(clean);

      if(d.kind&&$("rKind")) $("rKind").value=d.kind;

      if(d.to_name){ const p=PROFILES.find(x=>x.name===d.to_name||x.name.includes(d.to_name.split(" ")[0])); if(p&&$("rTo")) $("rTo").value=p.id; }

    btn.disabled=false; btn.textContent="🤖 حلّل واملى";
  };
  $("rSave").onclick=async()=>{ await stopSheetMic();
    if(!$("rTitle").value.trim()&&$("rDet").value.trim()) $("rTitle").value=$("rDet").value.trim().slice(0,40);

    const { error }=await sb.from("os_requests").insert(payload);
    if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent="إرسال الطلب"; return; }

const S_DEFAULT={idle:"\ud83c\udf99\ufe0f سجّل بصوتك",rec:"\u23f9\ufe0f وقف واسمع",recDict:"\u23f9\ufe0f وقف التسجيل",busy:"\ud83e\udd16 بيسمع…",onDone:null};

function bindSheetMic(btnId, taId, opts){
  const b=$(btnId); if(!b) return;
  if(!micSupported()){ b.style.display="none"; return; }
  b.onclick=async()=>{
    if(sRecOn){ await stopSheetMic(); return; }
    sBtnId=btnId; sTaId=taId; sOpts=Object.assign({},S_DEFAULT,opts||{});
    if(VOICE_GEMINI && hasMediaRec()){
      try{
        sStream=await navigator.mediaDevices.getUserMedia({audio:true});
        sMediaRec=new MediaRecorder(sStream, recMime()?{mimeType:recMime()}:undefined);
        sChunks=[]; sMediaRec.ondataavailable=(e)=>{ if(e.data&&e.data.size) sChunks.push(e.data); };
        sMediaRec.start(); sRecOn=true; sEngine="gemini";
        b.textContent=sOpts.rec; b.classList.add("on");
        window._sRecStartT=performance.now();
        sVad=startVAD(sStream,
          ()=>{ if(sRecOn){ toast("\ud83e\udde0 حسّيت إنك خلصت — بكتب كلامك","ok"); stopSheetMic(); } },
          (rms,th)=>{ const sb2=sBtnId?$(sBtnId):null; if(sb2){ const k=Math.min(1,rms/(th*2)); sb2.style.boxShadow="0 0 0 "+Math.round(2+k*9)+"px rgba(30,136,229,"+(0.12+k*0.25).toFixed(2)+")"; } });
        setTimeout(()=>{ if(sRecOn){ toast("⏱️ وصلنا للحد الأقصى 3 دقائق","ok"); stopSheetMic(); }},180000);
        return;
      }catch(e){ if(e&&e.name==="NotAllowedError"){ toast("لازم تسمح بالميكروفون","bad"); return; } }
    }
    if(!dictSupported()){ toast("التسجيل مش متاح هنا — اكتب بإيدك","bad"); return; }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    sRec=new SR(); sRec.lang="ar-EG"; sRec.continuous=true; sRec.interimResults=true;
    const ta=$(taId); sCommit=ta.value?(ta.value+" "):"";
    sRec.onresult=(e)=>{ let it=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) sCommit+=t+" "; else it+=t; } ta.value=(sCommit+it).trim(); };
    sRec.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("لازم تسمح بالميكروفون","bad"); stopSheetMic(); } };
    sRec.onend=()=>{ if(sRecOn&&sEngine==="dict"){ try{ sRec.start(); }catch(_e){} } };
    try{ sRec.start(); sRecOn=true; sEngine="dict"; b.textContent=sOpts.recDict; b.classList.add("on"); }
    catch(e){ toast("معرفناش نبدأ التسجيل","bad"); }
  };
}
async function stopSheetMic(discard){
  if(!sRecOn) return;
  sRecOn=false;
  const _svadRef=sVad;
  try{ sVad&&sVad.stop(); }catch(e){} sVad=null;
  const _noSpeechS = noRealSpeech(_svadRef);
  const o=sOpts||S_DEFAULT;
  const b=sBtnId?$(sBtnId):null; if(b){ b.textContent=o.idle; b.classList.remove("on"); b.style.boxShadow=""; }
  if(sEngine==="gemini"){
    const blob=await new Promise((res)=>{ try{ sMediaRec.onstop=()=>{ const bl=new Blob(sChunks,{type:(sMediaRec&&sMediaRec.mimeType)||"audio/mp4"}); try{ sStream.getTracks().forEach(t=>t.stop()); }catch(_e){} res(bl); }; sMediaRec.stop(); }catch(e){ res(null); } });
    if(discard||!blob||!blob.size) return;
    if(_noSpeechS){ toast("\ud83c\udf99\ufe0f مسمعتش كلام واضح — جرّب تاني","bad"); return; }
    if(b){ b.disabled=true; b.textContent=o.busy; }
    let okDone=false;
    try{
      let text=await geminiTranscribe(blob);
      text=stripHallucination(text);
      if(!text){ toast("\ud83c\udf99\ufe0f مطلعش كلام مفهوم من التسجيل","bad"); throw new Error("EMPTY"); }
      const recSecs=window._sRecStartT?(performance.now()-window._sRecStartT)/1000:0;
      transcriptQualityGate(text,recSecs);
      text=await autoPolish(text);
      try{ sb.rpc("os_track",{ p_kind:"voice", p_name:sTaId||"mic" }).then(()=>{}); }catch(e){}
      const ta=$(sTaId);
      if(ta){
        const prev=ta.value;
        ta.value=(prev?prev+" ":"")+text;
        showVoiceUndo(ta,prev);
      }
      okDone=true;
      /* عبقرية: في نموذج الطلب — وزّع على الخانات أوتوماتيك من غير زرار */
      if(sTaId==="rDet" && $("rTitle") && !$("rTitle").value.trim() && $("rSmartFill")){
        toast("\ud83e\udd16 بوزّع كلامك على النموذج أوتوماتيك…","ok");
        setTimeout(()=>{ try{ $("rSmartFill").click(); }catch(e){} },200);
      }
    }catch(e){ transErrToast(e); }
    if(b){ b.disabled=false; b.textContent=o.idle; }
    if(okDone&&typeof o.onDone==="function"){ try{ o.onDone(); }catch(_e){} }
  } else {
    try{ sRec&&sRec.stop(); }catch(e){}
    if(!discard&&typeof o.onDone==="function"){ try{ o.onDone(); }catch(_e){} }
  }
}

/* ===== Smart silence detector (VAD): يحس إن الكلام خلص ويقفل لوحده ===== */
let _lastNoise=null, _lastNoiseAt=0;
function startVAD(stream, onSilence, onLevel){
  let ctx=null, raf=null, stopped=false, _spokeMs=0;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    if(ctx.state==="suspended"){ try{ ctx.resume(); }catch(e){} }
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser(); an.fftSize=2048;
    src.connect(an);
    const buf=new Float32Array(an.fftSize);
    /* تكيفي: أول 0.9 ثانية بنقيس ضوضاء المكان، والعتبات بتتحسب نسبةً ليها */
    let noiseFloor=0, calSamples=0, calibrated=false, warnedNoSound=false;
    /* لو اتعايرنا من أقل من 5 دقايق نبدأ بالقيمة المحفوظة — معايرة أسرع */
    const cachedOK=_lastNoise!=null && (Date.now()-_lastNoiseAt)<300000;
    const CAL_MS=cachedOK?300:900;
    if(cachedOK){ noiseFloor=_lastNoise; }
    let hadSpeech=false, speechMs=0, silentMs=0, last=performance.now(), startT=last;
    const SILENCE_LIMIT=4000;      /* سكوت 4 ثواني = خلصت */
    const MIN_SPEECH_MS=1200;      /* لازم يكون اتكلم 1.2 ثانية فعلًا قبل ما الأوتو-ستوب يشتغل */
    const MIN_REC_MS=2500;         /* وأول 2.5 ثانية من التسجيل محمية بالكامل */
    const tick=()=>{
      if(stopped) return;
      an.getFloatTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
      const rms=Math.sqrt(sum/buf.length);
      const now=performance.now(); const dt=now-last; last=now;
      if(!calibrated){
        noiseFloor+=rms; calSamples++;
        if(now-startT>=CAL_MS){
          const fresh=Math.max(noiseFloor/Math.max(1,calSamples),0.0035);
          noiseFloor=cachedOK?Math.max((fresh+_lastNoise)/2,0.0035):fresh;
          _lastNoise=noiseFloor; _lastNoiseAt=Date.now();
          calibrated=true;
        }
        raf=setTimeout(tick,150); return;
      }
      const SPEECH_T=Math.max(noiseFloor*3.2,0.014);   /* كلام = أعلى بوضوح من ضوضاء المكان */
      const SILENCE_T=Math.max(noiseFloor*1.7,0.009);  /* سكوت = قريب من أرضية الضوضاء */
      if(typeof onLevel==="function"){ try{ onLevel(rms, SPEECH_T); }catch(e){} }
      /* إنذار "مش سامعك": 6 ثواني من البداية ومفيش أي كلام واصل */
      if(!hadSpeech && !warnedNoSound && (now-startT)>=6000){ warnedNoSound=true; toast("\ud83c\udf99\ufe0f مش سامعك — اتأكد إن المايك شغال ومش مكتوم","bad"); }
      if(rms>SPEECH_T){ hadSpeech=true; speechMs+=dt; _spokeMs=speechMs; silentMs=0; }
      else if(rms<SILENCE_T && hadSpeech && speechMs>=MIN_SPEECH_MS && (now-startT)>=MIN_REC_MS){
        silentMs+=dt;
        if(silentMs>=SILENCE_LIMIT){ stopped=true; try{ ctx.close(); }catch(e){} onSilence(); return; }
      }
      else { silentMs=Math.max(0,silentMs-dt*0.5); }
      raf=setTimeout(tick,150);
    };
    raf=setTimeout(tick,150);
  }catch(e){ /* مفيش VAD؟ التسجيل شغال عادي بالحد الأقصى 3 دقايق */ }
  return { stop:()=>{ stopped=true; try{ clearTimeout(raf); }catch(e){} try{ ctx&&ctx.close(); }catch(e){} },
           spoke:()=>_spokeMs };
}

function startDictation(){
  if(!dictSupported()){ toast("التسجيل الصوتي مش متاح هنا — اكتب بإيدك","bad"); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); rec.lang="ar-EG"; rec.continuous=true; rec.interimResults=true;
  committed=$("vtext").value?($("vtext").value+" "):"";
  rec.onresult=(e)=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal) committed+=tr+" "; else interim+=tr; } $("vtext").value=(committed+interim).trim(); };
  rec.onerror=(e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("لازم تسمح بالميكروفون","bad"); stopVoice(); } };
  rec.onend=()=>{ if(recording&&recEngine==="dict"){ try{ rec.start(); }catch(_e){} } };
  try{ rec.start(); recording=true; recEngine="dict"; $("micBtn").classList.add("rec"); $("micBtn").textContent="⏹️"; $("micHint").textContent="بسجّل بالإملاء… اتكلم وبعدين اضغط لإيقاف."; }
  catch(e){ toast("معرفناش نبدأ التسجيل","bad"); }
}

async function extractContract(){

function dayLabel(iso){
  const d=new Date(iso); const t=new Date(); t.setHours(0,0,0,0);
  const dd=new Date(d); dd.setHours(0,0,0,0);
  const diff=Math.round((t-dd)/86400000);
  if(diff===0) return "النهارده";
  if(diff===1) return "إمبارح";
  return d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
}

let taskFilter="mine";
async function renderTasks(){
  $("v-tasks").innerHTML=`<div class="page-h"><div><h2>المهام والمواعيد</h2><div class="sub">متخزّنة في الداتابيز — بتتحدّث لحظيًا</div></div></div>
    <div class="chips"><button class="chip ${taskFilter==='mine'?'on':''}" data-f="mine">مهامي</button><button class="chip ${taskFilter==='all'?'on':''}" data-f="all">الكل</button><button class="chip ${taskFilter==='events'?'on':''}" data-f="events">📅 المواعيد</button><button class="chip ${taskFilter==='archive'?'on':''}" data-f="archive">🗄️ الأرشيف</button></div>
    <div id="taskList"><div id="taskSkel"><div class="skel"></div><div class="skel"></div><div class="skel" style="height:40px"></div></div></div>`;
  $("v-tasks").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ taskFilter=b.dataset.f; renderTasks(); ensureFab(); });
  if(taskFilter==="events"){ renderEvents(); return; }
  if(taskFilter==="archive"){ renderArchive(); return; }
  let data; try{ const r=await sb.from("os_tasks").select("*").order("created_at",{ascending:false}); data=r.data||[]; }
  catch(e){ $("taskList").innerHTML=`<div class="empty">معرفناش نجيب المهام. ${esc(e.message||"")}</div>`; return; }
  let list = taskFilter==="mine" ? data.filter(t=>t.assignee_id===ME.id) : data;
  /* فرز ذكي: المتأخر أولًا، بعدين العاجل، بعدين الأحدث — والمخلَّصة آخر حاجة */
  const now=Date.now();
  list=list.slice().sort((a,b)=>{
    const da=a.status==="done"?1:0, db=b.status==="done"?1:0;
    if(da!==db) return da-db;
    const oa=(a.deadline&&new Date(a.deadline).getTime()<now&&a.status!=="done")?0:1;
    const ob=(b.deadline&&new Date(b.deadline).getTime()<now&&b.status!=="done")?0:1;
    if(oa!==ob) return oa-ob;
    const la=a.type==="lead"&&a.status!=="done"?0:1, lb=b.type==="lead"&&b.status!=="done"?0:1;
    if(la!==lb) return la-lb;
    const pa=a.priority==="high"?0:1, pb=b.priority==="high"?0:1;
    if(pa!==pb) return pa-pb;
    return new Date(b.created_at)-new Date(a.created_at);
  });
  if(_taskDept!=="all" && taskFilter==="all") list=list.filter(t=>t.dept===_taskDept);
  if(_taskSearch) list=list.filter(t=>String(t.title||"").indexOf(_taskSearch)>=0||String(t.assignee_name||"").indexOf(_taskSearch)>=0);
  let head="";
  head+='<input id="taskSearch" placeholder="\ud83d\udd0d دوّر في المهام بالاسم أو العنوان…" value="'+esc(_taskSearch)+'" style="width:100%;padding:9px 13px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;margin-bottom:8px"/>';
  if(taskFilter==="all" && isOwnerOps()){
    head+='<div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px"><button class="chip '+(_taskDept==="all"?"on":"")+'" data-td="all">كل الأقسام</button>'+DEPTS.map(d=>'<button class="chip '+(_taskDept===d.key?"on":"")+'" data-td="'+d.key+'">'+(DEPT_EMOJI[d.key]||"")+' '+esc(d.name.replace("القسم ","").replace("قسم ",""))+'</button>').join("")+'</div>';
  }
  $("taskList").innerHTML = head + (list.length? list.map(taskCard).join("") : `<div class="empty"><div class="big">📋</div>${_taskSearch?"مفيش نتايج للبحث ده.":(canWrite()?"مفيش مهام هنا. اضغط زرار ➕ تحت.":"مفيش مهام مسندة ليك دلوقتي.")}</div>`);
  const tsIn=$("taskSearch");
  if(tsIn){ tsIn.oninput=(e)=>{ _taskSearch=(e.target.value||"").trim(); clearTimeout(window._tsT); window._tsT=setTimeout(()=>renderTasks(),350); };
    if(_taskSearch){ tsIn.focus(); const v=tsIn.value; tsIn.value=""; tsIn.value=v; } }
  $("taskList").querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>{ _taskDept=b.dataset.td; renderTasks(); });
  $("taskList").querySelectorAll("[data-task]").forEach(c=>c.onclick=()=>openTask(c.dataset.task, data));
}

function statusBadge(s){ if(s==="review") return '<span class="badge" style="background:#F3E8FF;color:#6B21A8;border:1px solid #E9D5FF">\u270b في المراجعة</span>'; const m={new:["جديدة","b-amber"],in_progress:["شغّالة","b-blue"],done:["خلصت","b-green"]}; const x=m[s]||["—","b-grey"]; return `<span class="badge ${x[1]}">${x[0]}</span>`; }

    };
    const qd=$("qd");
    if(qd) qd.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
      const days=parseInt(b.dataset.d,10); const d=new Date(); d.setDate(d.getDate()+days); d.setHours(17,0,0,0);
      const { error }=await sb.from("os_tasks").update({ deadline:d.toISOString() }).eq("id",id);
      if(error){ toast("معرفناش نحدّث الموعد","bad"); return; }
      toast("\ud83d\udcc5 الموعد بقى "+fmtDate(d.toISOString()),"ok");
      qd.querySelectorAll(".qbtn").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    });
    let chosen=t.progress||0;
    $("qp").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ chosen=+b.dataset.p; $("qp").querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===b)); });
    $("tSave").onclick=async()=>{
      const btn=$("tSave"); btn.disabled=true; btn.textContent="بيحفظ…";
      const note=$("tNote").value.trim();
      const canClose = isOwnerOps() || (PROFILE.role==="manager"&&t.dept===myDeptKey());
      const status = chosen>=100?(canClose?"done":"review"):(chosen>0?"in_progress":"new");
      const u1=await sb.from("os_tasks").update({ progress:chosen, status }).eq("id",id);
      if(u1.error){ toast("خطأ: "+u1.error.message,"bad"); btn.disabled=false; btn.textContent="احفظ التحديث"; return; }
      await sb.from("os_task_updates").insert({ task_id:id, by_id:ME.id, by_name:PROFILE.name, note:note||(status==="review"?"سلّم المهمة للمراجعة \u270b":null), percent:chosen });
      closeSheet();
      if(status==="review") toast("\u270b اتسلمت للمراجعة — المدير هيعتمدها","ok");
      else if(chosen>=100) toast("🎉 ممتاز! المهمة خلصت ✓","ok");
      else if(chosen>0) toast("اتحدّث — "+chosen+"% ✓","ok");
      else toast("اتحدّث ✓","ok");
      renderTasks();
    };
  }
}
async function renderEvents(){
  let data; try{ const r=await sb.from("os_events").select("*").order("at_time",{ascending:true}); data=r.data||[]; }
  catch(e){ $("taskList").innerHTML=`<div class="empty">معرفناش نجيب المواعيد.</div>`; return; }
  const now=Date.now();
  const up=data.filter(e=>!e.at_time||new Date(e.at_time).getTime()>=now-3600e3);
  const past=data.filter(e=>e.at_time&&new Date(e.at_time).getTime()<now-3600e3);
  const card=(e,old)=>`<div class="card" style="${old?'opacity:.55':''}">
    <div class="req-top"><div class="t">📅 ${esc(e.title)}</div>${(e.by_id===ME.id||isOwnerOps())?`<button class="qbtn" data-del-ev="${e.id}" title="حذف">🗑</button>`:""}</div>
    <div class="meta"><span>${e.at_time?new Date(e.at_time).toLocaleString("ar-EG",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—"}</span>${e.with_who?`<span class="dot"></span><span>مع ${esc(e.with_who)}</span>`:""}${e.location?`<span class="dot"></span><span>📍 ${esc(e.location)}</span>`:""}<span class="dot"></span><span>${esc(e.by_name||"")}</span></div>
  </div>`;
  let h = up.length? up.map(e=>card(e,false)).join("") : `<div class="empty"><div class="big">📅</div>مفيش مواعيد جاية. اضغط ➕ وسجّل ميتينج.</div>`;
  if(past.length){ h+=`<div class="sec-h">مواعيد فاتت <span class="ln"></span></div>`+past.slice(-5).map(e=>card(e,true)).join(""); }
  $("taskList").innerHTML=h;
  $("taskList").querySelectorAll("[data-del-ev]").forEach(b=>b.onclick=async()=>{
    if(!confirm("تحذف الموعد ده؟")) return;
    const { error }=await sb.from("os_events").delete().eq("id",b.dataset.delEv);
    if(error){ toast("معرفناش نحذف: "+error.message,"bad"); return; }
    toast("اتحذف ✓","ok"); renderTasks();
  });
}
async function renderArchive(){

  catch(e){ $("taskList").innerHTML='<div class="empty">معرفناش نجيب الأرشيف.</div>'; return; }
  if(!data.length){ $("taskList").innerHTML='<div class="empty"><div class="big">\ud83d\uddc4\ufe0f</div>الأرشيف فاضي — أول مهمة تخلص هتتحفظ هنا.</div>'; return; }
  $("taskList").innerHTML='<div class="muted" style="font-size:11.5px;margin-bottom:8px">\ud83d\uddc4\ufe0f المهام المنتهية — مرجع دائم، آخر 60 مهمة</div>'
    +data.map(t=>'<div class="card flat" style="opacity:.85"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">'+esc(t.title)+'</b><span class="badge b-green">خلصت \u2713</span></div>'
    +'<div class="meta"><span>\ud83d\udc64 '+esc(t.assignee_name||"\u2014")+'</span><span class="dot"></span><span>'+esc((DEPT_BY_KEY[t.dept]&&DEPT_BY_KEY[t.dept].name)||t.dept||"")+'</span><span class="dot"></span><span>'+relTime(t.created_at)+'</span>'+(t.updates_count?'<span class="dot"></span><span>\ud83d\udcdd '+t.updates_count+' تحديث</span>':'')+'</div></div>').join("");
}

    ups.map(u=>`<div style="display:flex;gap:8px;align-items:baseline;margin-bottom:7px;font-size:13px;color:var(--ink)">

      <div style="flex:1"><b>${esc(u.by_name||"")}</b>${u.note?(" — "+esc(u.note)):""} <span class="muted" style="font-size:11.5px">· ${timeAgo(u.at)}</span></div>

    <div class="field"><label>مع مين؟ (اختياري)</label><input id="eWho"/></div>

    else if(k==="m17"){ d.setDate(d.getDate()+1); d.setHours(17,0,0,0); }

    if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent="حفظ الموعد"; return; }

/* ===== smart task capture: speech → multiple tasks ===== */
function openSmartTask(){
  openSheet(`<h3>مهام بالكلام ✨</h3>
    <div class="field"><label>قول المهام كلها مرة واحدة — والذكاء هيفصلها</label>
    <textarea id="stStory" style="min-height:120px" placeholder="مثلاً: دعاء تخلص رسومات الفيلا الخميس، ومحمد سعد يراجع المقايسة بكرة، وعوض يتابع رخصة زايد عاجل"></textarea></div>
    <div class="row-actions" style="margin:-2px 0 12px"><button class="btn ghost sm" id="stMic">🎙️ سجّل بصوتك</button><button class="btn ghost sm" id="stManual">＋ مهمة يدوي</button></div>
    <button class="btn" id="stGo">✨ فصّلها لمهام</button>
    <div id="stPrev"></div>`);
  bindSheetMic("stMic","stStory");
  $("stManual").onclick=()=>{ stopSheetMic(true); openNewTask(); };
  $("stGo").onclick=parseSmartTasks;
}
function matchProfile(nm){
  if(!nm) return null;
  const n=String(nm).trim(); if(!n) return null;
  return PROFILES.find(p=>p.name===n) || PROFILES.find(p=>p.name.includes(n)||n.includes(p.name)) || null;
}
async function parseSmartTasks(){
  await stopSheetMic();
  const story=$("stStory").value.trim();
  if(!story){ toast("اكتب أو سجّل المهام الأول","bad"); return; }
  const btn=$("stGo"); btn.disabled=true; btn.textContent="✨ بيفصّل المهام…";
  const team=PROFILES.map(p=>p.name).join("، ");
  const d=new Date();
  const prompt=`النهارده ${d.toLocaleDateString("ar-EG",{weekday:"long"})} الموافق ${d.toISOString().slice(0,10)}. الكلام التالي فيه مهمة أو أكتر اتقالت بالعامية المصرية، وممكن يكون من إملاء صوتي فيه أخطاء سمعية — صحّحها بالسياق (شركة استشارات هندسية). أسماء الفريق المتاحة: ${team}. فصّل الكلام لمهام ورجّع JSON بالشكل ده بالظبط: {"tasks":[{"title":"","assignee":"","deadline":"","priority":"medium"}]} — title فعل واضح مختصر، assignee اسم من الفريق زي ما هو بالظبط أو "" لو مش محدد، deadline بصيغة YYYY-MM-DD محسوبة من تاريخ النهارده (بكرة/الخميس/بعد أسبوع…) أو "" لو مفيش، priority واحدة من high/medium/low (عاجل=high). الكلام:\n${story}`;
  try{
    let out=await askAI({ prompt, mode:"fast", want_json:true, max_tokens:700 });
    out=out.replace(/```json/gi,"").replace(/```/g,"").trim();
    const s=out.indexOf("{"), eI=out.lastIndexOf("}");
    if(s>=0&&eI>=0) out=out.slice(s,eI+1);
    const arr=(JSON.parse(out).tasks||[]).filter(t=>t&&String(t.title||"").trim());
    if(!arr.length) throw new Error("empty");
    renderSmartPreview(arr);
  }catch(e){ toast("معرفناش نفصّل — جرّب صياغة تانية أو ضيف يدوي","bad"); }
  btn.disabled=false; btn.textContent="✨ فصّلها لمهام";
}
function renderSmartPreview(arr){
  const opts=(sel)=>`<option value="">ليّا (${esc(PROFILE.name)})</option>`+PROFILES.filter(p=>p.id!==ME.id).map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
  const okDate=(v)=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?v:"";
  $("stPrev").innerHTML=`<div class="sec-h">راجع المهام (${arr.length}) <span class="ln"></span></div>`+
    arr.map((t,i)=>{ const m=matchProfile(t.assignee); const pr=["high","low"].includes(t.priority)?t.priority:"medium";
      return `<div class="card flat" data-row="${i}" data-prio="${pr}" style="background:var(--soft)">
      <div class="field" style="margin-bottom:8px"><input class="st-title" value="${esc(t.title)}"/></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="st-ass" style="flex:1;min-width:140px;padding:9px;border:1.6px solid var(--line);border-radius:10px;background:#fff">${opts(m?m.id:"")}</select>
        <input class="st-due" type="date" value="${okDate(t.deadline)}" style="padding:9px;border:1.6px solid var(--line);border-radius:10px;background:#fff"/>
        ${pr==="high"?'<span class="badge b-red">عاجل</span>':""}
        <button class="qbtn st-del" title="حذف">🗑</button>
      </div></div>`; }).join("")+
    `<button class="btn green" id="stSave">احفظ المهام ✓</button>`;
  $("stPrev").querySelectorAll(".st-del").forEach(b=>b.onclick=()=>{ b.closest("[data-row]").remove(); if(!$("stPrev").querySelector("[data-row]")) $("stPrev").innerHTML=""; });
  $("stSave").onclick=saveSmartTasks;
  setTimeout(()=>{ const el=$("stSave"); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },60);
}
async function saveSmartTasks(){
  const rows=[...$("stPrev").querySelectorAll("[data-row]")];
  const payloads=rows.map(r=>{
    const title=r.querySelector(".st-title").value.trim(); if(!title) return null;
    const assId=r.querySelector(".st-ass").value;
    const ap=assId?BY_ID[assId]:PROFILE;
    return { title, assignee_id:ap.id, assignee_name:ap.name, dept:ap.dept,
      deadline:r.querySelector(".st-due").value||null, priority:r.dataset.prio||"medium",
      type:"task", status:"new", progress:0, created_by:ME.id, created_by_name:PROFILE.name };
  }).filter(Boolean);
  if(!payloads.length){ toast("مفيش مهام تتحفظ","bad"); return; }
  const btn=$("stSave"); btn.disabled=true; btn.textContent="بيحفظ…";
  const { error }=await sb.from("os_tasks").insert(payloads);
  if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent="احفظ المهام ✓"; return; }
  closeSheet(); toast("اتحفظت "+payloads.length+" مهمة ✓","ok"); renderTasks();
}
function openNewTask(){
  const opts=PROFILES.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc((DEPT_BY_KEY[p.dept]&&DEPT_BY_KEY[p.dept].name)||p.dept||"")}</option>`).join("");
  openSheet(`<h3>مهمة جديدة</h3>
    <div class="field"><label>العنوان</label><input id="tTitle" placeholder="اكتب المهمة…"/></div>
    <div class="field"><label>مسندة لمين؟</label><select id="tAss"><option value="${ME.id}">أنا (${esc(PROFILE.name)})</option>${opts}</select></div>
    <div class="field"><label>الموعد النهائي</label><input id="tDue" type="date"/></div>
    <div class="field"><label>الأولوية</label><select id="tPrio"><option value="medium">عادي</option><option value="high">عاجل</option><option value="low">منخفض</option></select></div>
    <div class="row-actions"><button class="btn green" id="tCreate">إنشاء المهمة</button><button class="btn ghost" onclick="closeSheet()">إلغاء</button></div>`);
  $("tCreate").onclick=async()=>{
    const title=$("tTitle").value.trim(); if(!title){ toast("اكتب عنوان المهمة","bad"); return; }
    const assId=$("tAss").value; const ap=BY_ID[assId];
    const btn=$("tCreate"); btn.disabled=true; btn.textContent="بيتحفظ…";
    const payload={ title, assignee_id:assId, assignee_name:ap?ap.name:PROFILE.name, dept:ap?ap.dept:PROFILE.dept, deadline:$("tDue").value||null, priority:$("tPrio").value, type:"task", status:"new", progress:0, created_by:ME.id, created_by_name:PROFILE.name };
    const { error }=await sb.from("os_tasks").insert(payload);
    if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent="إنشاء المهمة"; return; }
    closeSheet(); toast("اتحفظت ✓","ok"); renderTasks();
  };
}

/* ===================== FAB (context: new request / new task) ===================== */
function ensureFab(){
  let fab=$("fab");
  if(!fab){ fab=document.createElement("button"); fab.id="fab"; fab.className="fab"; fab.textContent="＋"; document.body.appendChild(fab); }
  fab.onclick=()=>{ if(activeTab==="tasks"){ taskFilter==="events"?openNewEvent():openSmartTask(); } else if(activeTab==="req") openNewReq(); };
  const show = activeTab==="req" || (activeTab==="tasks" && (taskFilter==="events" || canWrite()));
  fab.style.display=show?"flex":"none";
}
const _switch=switchTab; switchTab=function(id){ if(recording) stopVoiceSilent(); try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){} if(id!=="chat"){ try{ if(chatSub){ sb.removeChannel(chatSub); chatSub=null; } }catch(e){} } _switch(id); ensureFab(); };

/* ===================== EVENTS ===================== */
$("btnLogin").onclick=doLogin;
$("btnJoin").onclick=openJoinForm;
$("inPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
$("btnLogout").onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} ME=null; PROFILE=null; chatHistory=[]; const f=$("fab"); if(f)f.style.display="none"; showLogin(); };

boot();

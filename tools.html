  c.appendChild(tp); c.scrollTop=c.scrollHeight;
  const patience=setTimeout(()=>{ try{ const sp=tp.querySelector("span.muted"); if(sp) sp.textContent= askMode==="board" ? "لسه بيتشاوروا — التحليل العميق بياخد وقته" : "ثواني كمان — بجهّز إجابة وافية…"; }catch(e){} },15000);
  try{
    let ans;
    if(askMode==="board"){ ans=await askBoard(q); }
    else { ans=await askAI({ prompt:q, dept:askDeptKey, mode:askDeep?"deep":"fast", max_tokens:askDeep?1400:900 }); }
    clearTimeout(patience);
    tp.remove(); chatHistory.push({r:"ai",t:ans||"ممعرفش أرد دلوقتي."}); renderChat();
  }
  catch(e){ tp.remove(); chatHistory.push({r:"ai",t:"النت أو السيرفر اتأخر علينا جرّب تبعت السؤال تاني."}); renderChat(); }
}

let chatChannel="company", chatSub=null, chatMsgs=[];
let chatReplyTo=null, chatSearchQ="", chatOldestAt=null, chatHasMore=false, _typingTimer=null, _typingHideTimer=null;
const REACT_SET=["\ud83d\udc4d","\u2764\ufe0f","\u2705","\ud83d\udd25","\ud83d\ude02"];
function dayLabel(iso){
  const d=new Date(iso); const t=new Date(); t.setHours(0,0,0,0);
  const dd=new Date(d); dd.setHours(0,0,0,0);
  const diff=Math.round((t-dd)/86400000);
  if(diff===0) return "النهارده";
  if(diff===1) return "إمبارح";
  return d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
}
function hhmm(iso){ const d=new Date(iso); return d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}); }
function highlightMentions(escaped){
  return escaped.replace(/@([\u0600-\u06FF\w]+)/g,'<b style="color:var(--blue-d);background:#EAF2FB;border-radius:5px;padding:0 4px">@$1</b>');
}
/* البند ٣: شات بين التيمات — اختيار قسم/مكتب تاني وفتح قناة pair منفصلة */
function pairLabel(ch){
  /* ch زي pair:dept_a|dept_b — نطلّع اسم الطرف التاني */
  try{
    const body=String(ch).replace(/^pair:/,"");
    const parts=body.split(/[|:_]/).filter(Boolean);
    const me=myDeptKey();
    const others=Object.keys(DEPT_BY_KEY).filter(k=>body.indexOf(k)>=0 && k!==me);
    const ok=others[0];
    if(ok&&DEPT_BY_KEY[ok]) return (DEPT_EMOJI[ok]||"")+" "+DEPT_BY_KEY[ok].name;
  }catch(e){}
  return "قناة مشتركة";
}
function dmChannel(a,b){ return "dm:"+[String(a),String(b)].sort().join("__"); }
function dmLabel(ch){
  try{ const ids=String(ch).slice(3).split("__"); const o=ids.find(x=>x!==String(ME.id)); const p=BY_ID[o]; if(p) return "\uD83D\uDC64 "+p.name; }catch(e){}
  return "\uD83D\uDC64 رسالة خاصة";
}

  if(!otherId||String(otherId)===String(ME.id)){ toast("اختار زميل","bad"); return; }

  renderChatRoom();

  const archivists=PROFILE.dept==="reception"?PROFILES.filter(p=>p&&p.id!==ME.id&&p.position==="archive").sort((a,b)=>String(a.dept||"").localeCompare(String(b.dept||""),"ar")):[];

  openSheet('<h3>تواصل مع قسم أو زميل</h3><div class="muted" style="font-size:12.5px;margin:-4px 0 10px">قناة خاصة منفصلة عن غرفة القسم.</div><div style="max-height:58vh;overflow-y:auto"><div class="sec-h" style="margin-top:0">أقسام ومكاتب <span class="ln"></span></div>'+deptRows+(archivists.length?'<div class="sec-h">موظفي الأرشيف في المكاتب <span class="ln"></span></div>'+archRows:'')+'<div class="sec-h">كل الموظفين <span class="ln"></span></div>'+mateRows+'</div><div class="row-actions" style="margin-top:6px"><button class="btn ghost" onclick="closeSheet()">إلغاء</button></div>');
  document.querySelectorAll(".pair-row").forEach(b=>b.onclick=()=>openPairChannel(b.dataset.pk));
  document.querySelectorAll(".dm-row").forEach(b=>b.onclick=()=>openDM(b.dataset.dm));

async function openPairChannel(otherKey){
  const me=myDeptKey();
  if(!me){ toast("لازم تكون في قسم عشان تفتح قناة مشتركة","bad"); return; }
  if(me===otherKey){ toast("ده قسمك أنت","bad"); return; }
  try{
    const { data, error }=await sb.rpc("os_pair_channel",{ a:me, b:otherKey });
    if(error) throw error;
    const ch=(typeof data==="string")?data:(data&&data.channel)||(Array.isArray(data)&&data[0]);
    if(!ch){ toast("معرفناش نفتح القناة","bad"); return; }
    closeSheet();
    chatChannel=ch;
    renderChatRoom();
    toast("اتفتحت قناة مع "+((DEPT_BY_KEY[otherKey]&&DEPT_BY_KEY[otherKey].name)||"القسم"),"ok");
  }catch(e){ toast("معرفناش نفتح القناة: "+(e.message||""),"bad"); }
}
function chatChannels(){
  const isOff=k=>!!k&&k.indexOf("off_")===0;
  const offLabel=(key,name)=>(DEPT_EMOJI[key]||"")+" "+name+" + الهندسة";
  const offices=DEPTS.filter(d=>isOff(d.key)), others=DEPTS.filter(d=>!isOff(d.key));
  const list=[];
  list.push(["company","الشركة كلها"]);
  if(isOwnerOps()){
    offices.forEach(d=>list.push(["dept:"+d.key,offLabel(d.key,d.name)]));
    others.forEach(d=>list.push(["dept:"+d.key,(DEPT_EMOJI[d.key]||"")+" "+d.name]));
  } else if(myDeptKey()==="engineering"){
    offices.forEach(d=>list.push(["dept:"+d.key,offLabel(d.key,d.name)]));
    var e=DEPT_BY_KEY["engineering"]; if(e) list.push(["dept:engineering",(DEPT_EMOJI["engineering"]||"")+" "+e.name]);
  } else if(myDeptKey()==="reception"){
    var rc=DEPT_BY_KEY["reception"]; if(rc) list.push(["dept:reception",(DEPT_EMOJI["reception"]||"")+" "+rc.name]);
    offices.forEach(d=>list.push(["dept:"+d.key,(DEPT_EMOJI[d.key]||"")+" "+d.name]));
    others.forEach(d=>{ if(d.key!=="reception") list.push(["dept:"+d.key,(DEPT_EMOJI[d.key]||"")+" "+d.name]); });
  } else {
    var k=myDeptKey();
    if(k&&DEPT_BY_KEY[k]) list.push(["dept:"+k, (DEPT_EMOJI[k]||"")+" "+DEPT_BY_KEY[k].name]);
    if(isOff(k)){
      ["engineering","legal","finance"].forEach(dk=>{ if(DEPT_BY_KEY[dk]){ var ch="pair:"+[k,dk].sort().join("__"); if(!list.find(c=>c[0]===ch)) list.push([ch,(DEPT_EMOJI[dk]||"")+" "+DEPT_BY_KEY[dk].name]); } });
    }
  }
  (window._activeChans||[]).forEach(ch=>{ if(String(ch).indexOf("pair:")===0 && !list.find(c=>c[0]===ch)) list.push([ch,pairLabel(ch)]); else if(String(ch).indexOf("dm:")===0 && !list.find(c=>c[0]===ch)) list.push([ch,dmLabel(ch)]); });
  if(String(chatChannel).indexOf("pair:")===0 && !list.find(c=>c[0]===chatChannel)){
    list.push([chatChannel,pairLabel(chatChannel)]);
  }
  if(String(chatChannel).indexOf("dm:")===0 && !list.find(c=>c[0]===chatChannel)){
    list.push([chatChannel,dmLabel(chatChannel)]);
  }
  if(!list.length) list.push(["company","الشركة كلها"]);
  return list;
}

    <div class="composer"><button class="send" id="chAttach" aria-label="إرفاق" style="background:#EEF3F9;color:var(--blue-d);box-shadow:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.19 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49"/></svg></button><button class="send mic-sec" id="chMic" aria-label="سجّل بصوتك">${ICONS.mic.replace(/#94a3b8/g,"var(--blue)")}</button><input id="chIn" placeholder="اكتب رسالة… أو اتكلم" /><button class="send sendmsg" id="chSend">${ICONS.send}</button></div>`;
  $("chChips").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ chatChannel=b.dataset.ch; renderChatRoom(); });
  $("chSend").onclick=sendChat;
  bindSheetMic("chMic","chIn",{idle:ICONS.mic,rec:ICONS.stop,recDict:ICONS.stop,busy:"…",onDone:()=>{ if(($("chIn").value||"").trim()){ toast("اتبعتت صوتيًا","ok"); sendChat(); } }});
    var _atb=$("chAttach"); if(_atb) _atb.onclick=openChatAttachSheet;
  if(_chatDraft){ $("chIn").value=_chatDraft; }
  $("chIn").addEventListener("blur",()=>{ _chatDraft=$("chIn")?($("chIn").value||""):""; });
  $("chIn").addEventListener("keydown",e=>{ if(e.key==="Enter") sendChat(); });
  $("chSumBtn").onclick=async()=>{
    const last=chatMsgs.slice(-50);
    if(last.length<3){ toast("مفيش رسايل كفاية للتلخيص","bad"); return; }
    openSheet('<h3>ملخص الدردشة</h3><div id="sumBox"><div class="skel"></div><div class="skel"></div></div><div class="row-actions" style="margin-top:10px"><button class="btn ghost sm" id="sumSay">اسمعه</button><button class="btn ghost sm" onclick="closeSheet()">قفل</button></div>');
    try{
      const convo=last.map(m=>m.by_name+": "+m.body).join("\n");
      const out=await askAI({ prompt:"لخّص المحادثة الداخلية دي في نقاط قصيرة بالعامية المصرية: أهم القرارات، المطلوب من مين، وأي حاجة عاجلة. متزودش من عندك.\n\n"+convo, dept:null, mode:"fast", max_tokens:500 });
      $("sumBox").innerHTML='<div class="card flat" style="white-space:pre-wrap;font-size:13.5px;line-height:1.9">'+esc(out||"\u2014")+'</div>';
      window._lastSum=out||"";
    }catch(e){ $("sumBox").innerHTML='<div class="empty">معرفناش نلخص دلوقتي.</div>'; }

  $("chSearchIn") && ($("chSearchIn").oninput=(e)=>{ chatSearchQ=(e.target.value||"").trim(); paintChat(); });
  /* منشن حقيقي: @ يفتح قايمة أسماء تتضغط + مؤشر "بيكتب…" للباقيين */

function setReply(m){
  chatReplyTo=m?{id:m.id,name:m.by_name,preview:String(m.body||"").slice(0,80)}:null;
  const bar=$("chReplyBar"); if(!bar) return;
  if(!chatReplyTo){ bar.style.display="none"; bar.innerHTML=""; return; }
  bar.style.display="flex";
  bar.innerHTML='<span style="flex:1">بترد على <b>'+esc(chatReplyTo.name)+'</b>: '+esc(chatReplyTo.preview)+'…</span><button class="lnk" id="chReplyX" style="color:var(--red)">\u2715</button>';
  $("chReplyX").onclick=()=>setReply(null);
  $("chIn").focus();
}
function broadcastTyping(){
  try{
    if(_typingTimer) return;
    _typingTimer=setTimeout(()=>{ _typingTimer=null; },1500);
    chatSub && chatSub.send({ type:"broadcast", event:"typing", payload:{ name:firstName(PROFILE.name), id:ME.id } });
  }catch(e){}
}
async function loadChat(append){
  try{
    let q=sb.from("os_messages").select("*").eq("channel",chatChannel).order("created_at",{ascending:false}).limit(80);
    if(append && chatOldestAt) q=q.lt("created_at",chatOldestAt);
    const r=await q; const batch=(r.data||[]).reverse();
    chatHasMore = batch.length===80;
    if(append){ chatMsgs=batch.concat(chatMsgs); } else { chatMsgs=batch; }
    if(chatMsgs.length) chatOldestAt=chatMsgs[0].created_at;
  }catch(e){}
  paintPinBar(); paintChat(append);
  /* علّم رسائل القناة دي إني شفتها (وأنا فعلًا فاتح الشات) */
  if(activeTab==="chat" && !document.hidden){
    try{ sb.rpc("os_mark_channel_seen",{ p_channel: chatChannel }).then(()=>{}); }catch(e){}
  }
}
function paintPinBar(){
  const bar=$("chPinBar"); if(!bar) return;
  const p=chatMsgs.filter(m=>m.pinned).slice(-1)[0];
  if(!p){ bar.innerHTML=""; return; }
  bar.innerHTML='<div class="card flat" style="border-right:4px solid #F59E0B;background:#FFFBF2;padding:8px 12px;margin-bottom:8px;font-size:12.5px">'+ICONS.pin+' <b>'+esc(p.by_name)+':</b> '+esc(String(p.body||"").slice(0,110))+'</div>';
}
function paintChat(keepScroll){
  const box=$("chBox"); if(!box) return;
  const prevH=box.scrollHeight;
  let list=chatMsgs;
  if(chatSearchQ){ const q=chatSearchQ; list=chatMsgs.filter(m=>String(m.body||"").indexOf(q)>=0||String(m.by_name||"").indexOf(q)>=0); }
  if(!list.length){ box.innerHTML='<div class="empty">'+(chatSearchQ?"مفيش نتايج للبحث ده.":"لسه مفيش رسائل. ابدأ إنت!")+'</div>'; return; }

  if(chatHasMore && !chatSearchQ) h+='<div style="text-align:center;margin-bottom:8px"><button class="btn ghost sm" id="chMore">حمّل الأقدم</button></div>';

  h+=list.map(m=>{
    const mine=m.by_id===ME.id;
    const can=mine||isOwnerOps();
    const dl=dayLabel(m.created_at);
    let sep="";

    const rx=m.reactions||{};
    const rxKeys=Object.keys(rx).filter(k=>Array.isArray(rx[k])&&rx[k].length);

function smartTaskCard(t){
  /* بطاقة ذكية: إيه هي، جاية منين، إمتى — بدون AI عشان تبقى فورية ومضمونة */
  const src = t.type==="lead"
    ? "🌐 دخلت أوتوماتيك من فورم الموقع"
    : "👤 أضافها "+(esc(t.created_by_name||"الإدارة"));
  const created = t.created_at ? relativeTime(t.created_at) : null;
  const lastAct = (t.last_update_at||t.updated_at) ? relativeTime(t.last_update_at||t.updated_at) : null;
  let ddLine="";
  if(t.deadline){
    const days=Math.ceil((new Date(t.deadline).getTime()-Date.now())/86400000);
    if(t.status==="done") ddLine="";
    else if(days<0) ddLine='<span style="color:var(--red);font-weight:800">⚠️ اتأخرت '+Math.abs(days)+' يوم عن الموعد</span>';
    else if(days===0) ddLine='<span style="color:var(--red);font-weight:800">⏰ الموعد النهاردة</span>';
    else if(days<=2) ddLine='<span style="color:#B45309;font-weight:700">الموعد خلال '+days+' يوم</span>';
    else ddLine='الموعد خلال '+days+' يوم';
  }
  const statusTxt={new:"لسه ما اتبدأتش",in_progress:"شغّالة دلوقتي",review:"مستنية اعتماد المدير",done:"خلصت رسمي"}[t.status]||t.status;
  const staleLine = isStale(t) ? '<div style="margin-top:6px;color:#B45309;font-weight:700">🐢 مفيش تحديث عليها من 3 أيام أو أكتر</div>' : "";
  return '<div class="card flat" style="background:linear-gradient(135deg,#EEF4FF,#F3FBF3);border-color:#C7D9F5;margin-bottom:12px">'
    +'<div style="font-family:Cairo,sans-serif;font-weight:800;font-size:12.5px;margin-bottom:8px;color:var(--blue-d)">🧠 نظرة سريعة</div>'
    +'<div style="font-size:12.5px;line-height:1.9">'
    +'<div><b>المصدر:</b> '+src+'</div>'
    +(created?'<div><b>اتضافت:</b> '+created+'</div>':'')
    +'<div><b>الحالة:</b> '+statusTxt+(lastAct&&t.status!=="new"?' — آخر تحديث '+lastAct:'')+'</div>'
    +(ddLine?'<div><b>الموعد:</b> '+ddLine+'</div>':'')
    +'</div>'+staleLine+'</div>';
}

function tlNote(note){
  if(!note) return "";
  var m=note.match(/https?:\/\/\S+/);
  if(!m) return esc(note);
  var url=m[0];
  var pre=note.slice(0,m.index).replace(/\s*[:：]\s*$/,"");
  var post=note.slice(m.index+url.length);
  var isWa=/wa\.me|whatsapp/i.test(url);
  var label=isWa?"📲 رد عبر واتساب":"🔗 افتح الرابط";
  var col=isWa?"#166534":"#0D2538",bg=isWa?"#E8F5E9":"#EAF2FB",bd=isWa?"#86EFAC":"#CFE0F3";
  var a='<a href="'+url.replace(/"/g,"%22")+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:'+col+';background:'+bg+';border:1px solid '+bd+';border-radius:7px;padding:3px 9px;text-decoration:none">'+label+'</a>';
  return (pre?esc(pre)+" ":"")+a+(post?" "+esc(post):"");
}

async function loadConflictHint(assId, dateStr, hintEl){
  if(!hintEl) return;
  if(!assId||!dateStr){ hintEl.style.display="none"; return; }
  try{
    const start=dateStr+"T00:00:00", end=dateStr+"T23:59:59";
    const { count }=await sb.from("os_tasks").select("id",{count:"exact",head:true})
      .eq("assignee_id",assId).neq("status","done").neq("status","archived")
      .gte("deadline",start).lte("deadline",end);
    const n=count||0;
    if(n===0){ hintEl.style.display="none"; return; }
    const who=BY_ID[assId]?BY_ID[assId].name:"المسؤول";
    hintEl.style.display="block";
    hintEl.style.color = n>=3 ? "var(--red)" : "var(--amber, #B7791F)";
    hintEl.textContent = who+" عنده "+n+(n===1?" تسليمة":" تسليمات")+" تانية نفس اليوم"+(n>=3?" — اليوم محمّل، فكّر في موعد تاني":"");
  }catch(e){ hintEl.style.display="none"; }
}

    if(error){ toast("معرفناش نحفظ: "+error.message,"bad"); btn.disabled=false; btn.textContent=orig; return; }
    if(details&&nt&&nt.id){ try{ await sb.from("os_task_updates").insert({ task_id:nt.id, by_id:ME.id, by_name:PROFILE.name, note:"المطلوب: "+details, percent:null }); }catch(e){} }
    if(keepOpen){
      toast("اتحفظت ✓ — كمّل التانية","ok");
      $("tTitle").value=""; $("tDetails").value="";
      btn.disabled=false; btn.textContent=orig; $("tTitle").focus(); renderTasks();
    } else { closeSheet(); toast("اتحفظت ✓","ok"); renderTasks(); }
  };
  $("tCreate").onclick=()=>doSave(false);
  $("tCreateMore").onclick=()=>doSave(true);
}

/* ===================== FAB (context: new request / new task) ===================== */
function ensureFab(){
  let fab=$("fab");
  if(!fab){ fab=document.createElement("button"); fab.id="fab"; fab.className="fab"; fab.textContent="＋"; document.body.appendChild(fab); }
  fab.onclick=()=>{ if(activeTab==="tasks"){ taskFilter==="events"?openNewEvent():openSmartTask(); } else if(activeTab==="req") openNewReq(); };
  const show = activeTab==="req" || (activeTab==="tasks" && (taskFilter==="events" || canWrite()));
  fab.style.display=show?"flex":"none";
}
const _switch=switchTab; switchTab=function(id){ if(recording) stopVoiceSilent(); try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){} if(id!=="chat"){ try{ if(chatSub){ sb.removeChannel(chatSub); chatSub=null; } }catch(e){} } _switch(id); ensureFab(); };

/* ===================== EVENTS ===================== */
$("btnLogin").onclick=doLogin;
$("btnJoin").onclick=openJoinForm;
$("inPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
$("btnLogout").onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} ME=null; PROFILE=null; chatHistory=[]; const f=$("fab"); if(f)f.style.display="none"; showLogin(); };

boot();

/* ===== v33: كاش — فحص نسخة حي ===== */
const APP_VERSION=40;
let _newVer=null, _verTimer=null;
function applyNewVersion(){ try{ location.replace(location.pathname+"?v="+(_newVer||Date.now())); }catch(e){ location.reload(); } }
function safeToReload(){
  try{
    if(typeof recording!=="undefined" && recording) return false;
    if(typeof sRecOn!=="undefined" && sRecOn) return false;
    const a=document.activeElement;
    if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")) return false;
    const md=document.getElementById("modal");
    if(md && md.classList.contains("open")) return false;
    const ci=document.getElementById("chIn");
    if(ci && (ci.value||"").trim()) return false;
  }catch(e){ return false; }
  return true;
}
function showVerBanner(secs){
  let b=document.getElementById("verBanner");
  if(!b){
    b=document.createElement("button");
    b.id="verBanner";
    b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--blue-d);color:#fff;border:none;padding:11px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer";
    b.onclick=applyNewVersion;
    document.body.appendChild(b);
  }
  b.textContent = secs!=null ? ("نسخة أحدث وصلت — هتتحدث تلقائيًا خلال "+secs+" ثانية (أو اضغط دلوقتي)") : "نسخة أحدث متاحة — هتتحدث أول ما تخلص اللي في إيدك (أو اضغط دلوقتي)";
}
function scheduleAutoUpdate(){
  if(_verTimer) return;
  if(document.hidden){ applyNewVersion(); return; }
  if(!safeToReload()){
    showVerBanner(null);
    _verTimer=setInterval(()=>{ if(document.hidden||safeToReload()){ clearInterval(_verTimer); _verTimer=null; applyNewVersion(); } },4000);
    return;
  }
  let left=10; showVerBanner(left);
  _verTimer=setInterval(()=>{
    if(!safeToReload() && !document.hidden){ clearInterval(_verTimer); _verTimer=null; scheduleAutoUpdate(); return; }
    left--; if(left<=0){ clearInterval(_verTimer); _verTimer=null; applyNewVersion(); } else showVerBanner(left);
  },1000);
}
async function checkAppVersion(){
  try{
    if(_newVer){ scheduleAutoUpdate(); return; }
    const res=await fetch(location.pathname+"?nocache="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/APP_VERSION\s*=\s*(\d+)/);
    if(m && Number(m[1])>APP_VERSION){ _newVer=m[1]; scheduleAutoUpdate(); }
  }catch(e){}
}
setTimeout(checkAppVersion, 4000);
setInterval(checkAppVersion, 2*60*1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden && _newVer){ applyNewVersion(); } else if(!document.hidden){ checkAppVersion(); } });
</script>

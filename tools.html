<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>بيت الخبرة — أدوات المنظومة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --green:#4CAF50; --green-d:#2E7D32; --green-l:#E8F5E9;
  --blue:#1E88E5; --blue-d:#0D47A1; --blue-l:#E7F0FB;
  --red:#E53935; --red-l:#FDECEA;
  --amber:#F59E0B;
  --ink:#16263a; --muted:#6b7a8d; --line:#e6edf4;
  --bg:#f4f8fc; --card:#ffffff; --soft:#eef4fa;
  --shadow:0 1px 2px rgba(13,71,161,.05), 0 10px 30px rgba(13,71,161,.07);
  --shadow-sm:0 1px 2px rgba(13,71,161,.06);
  --r:18px; --r-sm:12px;
  --font:'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --tabh:72px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--font); background:var(--bg); color:var(--ink); line-height:1.65; font-size:15px; overflow-x:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
a{color:var(--blue-d);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cfdcea;border-radius:8px;}

/* ---- blueprint accent (signature, subtle) ---- */
.grid-accent{
  position:fixed; inset:0 0 auto 0; height:220px; z-index:0; pointer-events:none; opacity:.55;
  background-image:linear-gradient(rgba(30,136,229,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(30,136,229,.06) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:linear-gradient(#000,transparent); mask-image:linear-gradient(#000,transparent);
}

/* ---- boot / error ---- */
#boot{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);padding:24px;text-align:center;}
#boot .sp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- login ---- */
#login{min-height:100dvh;display:none;align-items:center;justify-content:center;padding:22px;position:relative;z-index:1;}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;}
.login-head{padding:30px 24px 18px;text-align:center;background:linear-gradient(180deg,#fff,#f7fbff);}
.login-head .logo{width:84px;height:84px;border-radius:20px;object-fit:contain;background:#fff;padding:8px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.login-head h1{font-size:21px;font-weight:800;color:var(--blue-d);}
.login-head p{font-size:12px;letter-spacing:.5px;color:var(--green-d);font-weight:700;margin-top:3px;}
.login-body{padding:22px 22px 26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:var(--r-sm);outline:none;background:#fff;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:84px;line-height:1.7;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--r-sm);font-weight:800;font-size:15.5px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 8px 20px rgba(30,136,229,.28);transition:transform .1s,opacity .15s;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.55;}
.btn.green{background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 8px 20px rgba(76,175,80,.28);}
.btn.ghost{background:var(--soft);color:var(--blue-d);box-shadow:none;}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:10px;}
.btn.danger{background:linear-gradient(135deg,#ef5350,var(--red));box-shadow:0 8px 20px rgba(229,57,53,.25);}
.err{background:var(--red-l);color:var(--red);font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none;}

/* ---- app shell ---- */
#app{display:none;min-height:100dvh;position:relative;z-index:1;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar .logo{width:40px;height:40px;border-radius:11px;object-fit:contain;background:#fff;padding:4px;box-shadow:var(--shadow-sm);}
.topbar .ttl{font-weight:800;font-size:16px;color:var(--blue-d);line-height:1.15;}
.topbar .ttl small{display:block;font-size:11px;font-weight:600;color:var(--muted);}
.topbar .sp{flex:1;}
.uchip{display:flex;align-items:center;gap:8px;}
.uchip .nm{font-size:12.5px;font-weight:700;text-align:left;line-height:1.2;}
.uchip .rl{font-size:11px;color:var(--muted);}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--blue-d);}

.wrap{max-width:760px;margin:0 auto;padding:16px 14px 26px;}
.view{display:none;animation:rise .25s ease both;}
.view.active{display:block;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 16px;}
.page-h h2{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
.page-h .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}

.sec-h{display:flex;align-items:center;gap:8px;margin:24px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--muted);}
.sec-h .ln{flex:1;height:1px;background:var(--line);}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:15px;margin-bottom:11px;}
.card.flat{box-shadow:none;}
.req-top{display:flex;align-items:flex-start;gap:9px;}
.req-top .t{flex:1;font-weight:800;font-size:15px;line-height:1.4;}
.muted{color:var(--muted);font-size:13px;}
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);}
.dot{width:3px;height:3px;border-radius:50%;background:#c4d1df;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.b-blue{background:var(--blue-l);color:var(--blue-d);}
.b-green{background:var(--green-l);color:var(--green-d);}
.b-amber{background:#FEF3E2;color:#B45309;}
.b-red{background:var(--red-l);color:var(--red);}
.b-grey{background:var(--soft);color:var(--muted);}

.resp-box{margin-top:11px;background:var(--green-l);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--green-d);white-space:pre-wrap;}
.row-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
/* ===== نظام تنظيم الأزرار ===== */
.act-group{margin-top:14px}
.act-group+.act-group{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.act-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;
  margin:0 2px 8px;display:flex;align-items:center;gap:7px}
.act-label::after{content:"";flex:1;height:1px;background:var(--line)}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.act-grid .btn,.act-grid .btn.sm{width:100%;padding:12px 10px;font-size:13px;border-radius:11px;
  line-height:1.3;min-height:46px;white-space:normal;gap:4px}
/* نقطة المساعدة جوه زرار الشبكة تفضل صغيرة ومحاذية */
.act-grid .btn .help-dot{width:15px;height:15px;min-width:15px;font-size:9.5px;margin-inline-start:3px}
/* الزرار الأساسي: أعرض وأوضح */
.act-grid .btn.lead{grid-column:span 2;font-size:14px;min-height:50px}
/* الصف الأخير: إجراءات ثانوية أصغر */
.act-mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.act-mini .btn{width:auto;padding:8px 13px;font-size:12.5px;border-radius:9px;min-height:0;
  background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);font-weight:700}
.act-mini .btn:hover,.act-mini .btn:active{background:var(--soft);color:var(--blue-d);border-color:var(--blue)}
@media (max-width:360px){ .act-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))} }

.empty{text-align:center;color:var(--muted);padding:30px 16px;}
.empty .big{font-size:30px;margin-bottom:6px;}

/* tasks */
.prog{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:10px;}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));border-radius:999px;transition:width .4s;}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chips .chip{flex:0 0 auto;white-space:nowrap;}
#v-chat .composer{position:fixed;right:12px;left:12px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 6px);z-index:60;margin-top:0;box-shadow:0 -2px 18px rgba(15,23,42,.10);}
#v-chat{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 84px);}
.chip{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--soft);color:var(--muted);}
.chip.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;}
.dept-chip{transition:transform .08s ease,background .15s ease,border-color .15s ease;}
.dept-chip:active{transform:scale(.96);background:var(--blue-l);border-color:var(--blue);}
.dept-chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.qbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.qbtn{padding:7px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px;color:var(--blue-d);}
.qbtn.on{background:var(--blue);color:#fff;}

/* contract / voice */
.banner{display:flex;gap:9px;align-items:flex-start;background:#FEF3E2;border:1px solid #FCD9A1;color:#92500c;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:14px;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 14px;}
.mic{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 12px 30px rgba(30,136,229,.32);transition:transform .12s;}
.mic:active{transform:scale(.96);}
.mic.rec{background:linear-gradient(135deg,#ef5350,var(--red));box-shadow:0 0 0 0 rgba(229,57,53,.5);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.45);}70%{box-shadow:0 0 0 18px rgba(229,57,53,0);}100%{box-shadow:0 0 0 0 rgba(229,57,53,0);}}
.mic-hint{font-size:13px;color:var(--muted);font-weight:600;}
.contract-out{white-space:pre-wrap;background:#fff;border:1px dashed #b9c9da;border-radius:14px;padding:16px;font-size:13.5px;line-height:1.9;margin-top:6px;}

/* ask / chat */
.chat{display:flex;flex-direction:column;gap:13px;min-height:42vh;padding:6px 2px 8px;}
#chBox{padding-bottom:84px;overflow-y:auto;}
#chBox .msg .lnk{color:var(--muted);font-weight:600;opacity:.78;}
#chBox .msg.me .lnk{color:rgba(255,255,255,.85);}
#chBox .msg .lnk:active{opacity:1;}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--shadow-sm);}
.msg.ai{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:5px;}
.msg.me{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;align-self:flex-end;border-bottom-left-radius:5px;}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;font-weight:700;box-shadow:none;text-align:center;max-width:100%;}
.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bd 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes bd{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}
.msg.ai.warn{background:#FFFBF0;border-color:#F3D9A4;}
.warn-tag{font-size:11.5px;font-weight:800;color:#92500c;margin-bottom:6px;}
.deep-tg{padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:var(--soft);color:var(--muted);}
.deep-tg.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 6px 14px rgba(30,136,229,.25);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;box-shadow:var(--shadow-sm);}
.stat{transition:transform .1s ease,box-shadow .15s ease;}
.stat:active{transform:scale(.97);}
.tabbar .tab{transition:opacity .1s ease;}
.tabbar .tab:active{opacity:.55;}
.btn:focus-visible,.btn.sm:focus-visible,.stat:focus-visible,.chip:focus-visible,.dept-chip:focus-visible,.card[data-go]:focus-visible,.card[data-task]:focus-visible,.card[data-dept]:focus-visible,.tabbar .tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;}}
.stat .n{font-size:24px;font-weight:900;color:var(--blue-d);line-height:1.2;}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;}
.dept-card{display:flex;align-items:center;gap:11px;}
button.stat,button.dept-card{font-family:inherit;cursor:pointer;}
.stat-hot{border-color:#FBCFE8;background:linear-gradient(135deg,#FFF1F2,#fff);}
.stat-hot .n{color:var(--red);}
.lnk{background:none;border:none;color:var(--blue-d);font-weight:700;cursor:pointer;padding:0;font-family:inherit;}
/* آيفون: منع الزوم التلقائي عند الكتابة + احترام منطقة الهوم بار */
@media (max-width:640px){ input,textarea,select{ font-size:16px !important; } }
#tabbar{ padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
/* مؤشر "بيفكر" — نقط متحركة */
.thinking-dots{ display:inline-flex; gap:4px; align-items:center; }
.thinking-dots i{ width:7px;height:7px;border-radius:50%;background:var(--blue);animation:tdots 1.2s infinite; }
.thinking-dots i:nth-child(2){ animation-delay:.2s } .thinking-dots i:nth-child(3){ animation-delay:.4s }
@keyframes tdots{ 0%,80%,100%{opacity:.25;transform:scale(.85)} 40%{opacity:1;transform:scale(1.1)} }
/* offline / error banners */
#offlineBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;}
/* loading skeleton */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:10px;height:56px;margin-bottom:10px;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* unread chat badge */
.chat-badge{display:none;position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:900;align-items:center;justify-content:center;}
.chat-badge.on{display:flex;}
/* confirm dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8888;display:flex;align-items:center;justify-content:center;}
.confirm-box{background:#fff;border-radius:20px;padding:28px 22px;max-width:320px;width:90%;text-align:center;}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px;background:rgba(244,248,252,.95);backdrop-filter:blur(8px);border-radius:16px;border:1px solid var(--line);margin-top:8px;}
.composer input{flex:1;padding:12px 14px;border:1.6px solid var(--line);border-radius:999px;outline:none;background:#fff;}
.composer input:focus{border-color:var(--blue);}
.composer .send{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(76,175,80,.3);}
.composer .send:disabled{opacity:.5;}
.composer .send.sendmsg{background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 6px 16px rgba(30,136,229,.32);}
.composer .send.sendmsg:active{transform:scale(.93);}
.composer .send.sendmsg svg{margin-right:-2px;}
.composer .send.mic-sec{width:42px;height:42px;background:#EAF2FB;color:var(--blue);box-shadow:none;border:1.5px solid #CFE2F7;}
.composer .send.mic-sec.on{background:linear-gradient(135deg,#ef5350,var(--red));color:#fff;border-color:transparent;}
.msg-more{display:none;gap:14px;align-items:center;margin-top:7px;flex-wrap:wrap;}
.msg-more.open{display:flex;}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;position:relative;}
.tabbar .tab .ic{font-size:21px;line-height:1;}
.tabbar .tab.on{color:var(--blue-d);}
.tabbar .tab.on .ic{transform:translateY(-1px);}
.tabbar .tab .nbadge{position:absolute;top:9px;inset-inline-end:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(13,38,58,.45);backdrop-filter:blur(3px);}
.modal.open{display:flex;animation:fade .2s both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.act-grp{margin-bottom:12px}
.act-lbl{font-size:10.5px;font-weight:800;color:var(--muted);margin:0 2px 5px;letter-spacing:.2px;opacity:.9}
.act-grp .row-actions{margin-top:0}
.help-dot{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;min-width:17px;border-radius:50%;border:1.3px solid var(--line);background:#fff;color:var(--muted);font-size:10.5px;font-weight:800;font-family:inherit;margin-inline-start:5px;cursor:pointer;padding:0;line-height:1;vertical-align:middle;flex-shrink:0}
.help-dot:hover,.help-dot:active{background:var(--blue);color:#fff;border-color:var(--blue)}
.help-pop{position:fixed;z-index:9999;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 12px 34px rgba(0,0,0,.18);display:none;max-width:280px}
.help-pop.open{display:block;animation:up .18s ease both}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1) both;}
.sheet > .row-actions:last-child{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-bottom:calc(-20px - env(safe-area-inset-bottom));box-shadow:0 -10px 20px -12px rgba(0,0,0,.18);z-index:5;}
@keyframes up{from{transform:translateY(40px);}to{transform:none;}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--blue-d);}
.sheet .x{position:absolute;}
.fab{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);inset-inline-start:18px;z-index:25;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(76,175,80,.4);}

/* toast */
.toast{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green-d);} .toast.bad{background:var(--red);}

.note-line{font-size:12px;color:var(--amber);font-weight:700;margin-top:8px;}
.nav-back{display:inline-flex;align-items:center;gap:5px;background:#F1F3F5;border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:5px 11px;font-family:inherit;font-size:12px;font-weight:800;
  cursor:pointer;margin:0 0 10px}
.nav-back:active{background:#E4E7EA}

/* ═══ المرحلة ٣ — نظام التصميم ═══
   الأخضر خرج من الأزرار (كان 105 استخدام يخلط الفعل بالنجاح).
   أزرق = الفعل الرئيسي · أحمر = خطر · رمادي = الباقي · أخضر = نجاح فقط. */
.btn.primary{background:var(--blue);color:#fff;border:1px solid var(--blue);font-weight:700}
.btn.primary:active{filter:brightness(.94)}
.btn.secondary{background:#fff;color:#334155;border:1px solid var(--line);font-weight:600}
.btn.tertiary{background:transparent;border:none;color:#475569;text-decoration:underline;padding:4px 2px}
.btn.danger{background:#fff;color:#b91c1c;border:1px solid #fca5a5}
.danger-zone{margin-top:22px;padding-top:14px;border-top:1px dashed #fca5a5}
.ok-note{color:var(--green-d);font-weight:700}
.gsearch-wrap{position:relative}
.inp.gsearch{width:100%;padding:11px 13px;font-size:15px;border-radius:12px;border:1px solid var(--line);background:#fff}
.inp.gsearch:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dtable th{text-align:right;font-size:11.5px;font-weight:600;color:#64748b;padding:9px 11px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
.dtable td{padding:10px 11px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.dtable tbody tr:last-child td{border-bottom:none}
.dtable tbody tr{cursor:pointer;transition:background .1s ease}
.dtable tbody tr:hover{background:#f8fafc}
.dtable tbody tr:active{background:#f1f5f9}
.res-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;font-size:13.5px}
.res-row:hover{background:#f8fafc}
.row-go{color:#94a3b8;font-size:17px}
.more-grp{margin-bottom:16px}
.more-lbl{font-size:11.5px;font-weight:600;color:#64748b;margin:0 2px 6px}
.more-row{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:6px;cursor:pointer;font-size:14px}
.more-row:hover{background:#f8fafc}
.empty-state{text-align:center;padding:34px 18px;color:#475569;background:#fff;border:1px dashed var(--line);border-radius:14px}
.chip-warn{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:8px;padding:1px 6px;font-size:10.5px;font-weight:600;margin-right:4px}
.warn-inline{color:#b45309;font-weight:600;font-size:12.5px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.dtable tbody tr:focus-visible,.res-row:focus-visible,.more-row:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
</style>
</head>

/* ═══════════ لوحة المالك — الفلوس والخطر والقرار ═══════════ */
function _kj(n){ n=Number(n)||0;
  if(Math.abs(n)>=1000000) return (n/1000000).toFixed(n%1000000?1:0)+"م";
  if(Math.abs(n)>=1000)    return (n/1000).toFixed(Math.abs(n)<10000?1:0)+"ألف";
  return String(Math.round(n));
}

async function loadOwnerDash(){
  try{
    const [{ data:D },{ data:due }]=await Promise.all([
      sb.from("os_owner_dash").select("*").maybeSingle(),
      sb.from("os_owner_top_due").select("*").limit(4)
    ]);
    if(!D) return;
    paintOwnerStats(D);
    paintOwnerMoney(D);
    paintOwnerDecide(D);
    paintOwnerRisk(D, due||[]);
  }catch(e){ /* اللوحة إضافية — مبنوقعش الشاشة */ }
}

function paintOwnerStats(D){
  const el=$("ownStats"); if(!el) return;
  const cash=+D.cash||0, due=+D.due_total||0, late=+D.due_late||0;
  const cell=(v,lbl,col,go)=>'<button class="card flat" onclick="'+go+'" '
    +'style="flex:1;text-align:center;cursor:pointer;padding:10px 4px;margin:0">'
    +'<b style="display:block;font-size:17px;color:'+col+'">'+v+'</b>'
    +'<span class="muted" style="font-size:10px">'+lbl+'</span></button>';
  el.innerHTML=
     cell(_kj(cash),"في الخزينة","var(--green-d)","openFinance()")
    +cell(_kj(due),"مستحق لينا", due>0?"#B45309":"var(--ink)","openReceivables()")
    +cell(_kj(late),"منه متأخر", late>0?"var(--red)":"var(--ink-soft)","openReceivables()");
}

function paintOwnerMoney(D){
  const el=$("ownMoney"); if(!el) return;
  const inM=+D.in_month||0, outM=+D.out_month||0, prev=+D.in_prev||0;
  const net=inM-outM;
  let trend="";
  if(prev>0){
    const pc=Math.round((inM-prev)/prev*100);
    trend='<span style="font-size:11px;font-weight:800;color:'+(pc>=0?"var(--green-d)":"var(--red)")+'">'
      +(pc>=0?"▲ ":"▼ ")+Math.abs(pc)+'% عن الشهر اللي فات</span>';
  }
  const w=inM+outM>0 ? Math.round(inM/(inM+outM)*100) : 50;
  el.innerHTML='<div class="card" style="background:linear-gradient(135deg,#F3FBF3,#EEF4FF);border-color:#C7E3C7">'
    +'<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
    +'<b style="font-size:13px;flex:1">حركة الشهر</b>'+trend+'</div>'
    +'<div style="display:flex;gap:10px;text-align:center">'
    +'<div style="flex:1"><b style="display:block;font-size:16px;color:var(--green-d)">'+_kj(inM)+'</b>'
    +'<span class="muted" style="font-size:10.5px">دخل</span></div>'
    +'<div style="flex:1"><b style="display:block;font-size:16px;color:var(--red)">'+_kj(outM)+'</b>'
    +'<span class="muted" style="font-size:10.5px">خرج</span></div>'
    +'<div style="flex:1"><b style="display:block;font-size:16px;color:'+(net>=0?"var(--green-d)":"var(--red)")+'">'
    +(net>=0?"+":"")+_kj(net)+'</b><span class="muted" style="font-size:10.5px">الصافي</span></div></div>'
    +'<div class="prog" style="margin-top:9px;height:6px"><i style="width:'+w+'%;background:var(--green-d)"></i></div>'
    +'</div>';
}

  el.innerHTML='<div class="sec-h">مستني قرارك <span class="ln"></span></div>'

      +'<div style="display:flex;align-items:center;gap:10px">'

      +'<span style="color:var(--muted)">‹</span></div></button>').join("");

function paintOwnerRisk(D, due){
  const el=$("ownRisk"); if(!el) return;
  let h="";
  const late=due.filter(x=>x.overdue);
  if(late.length){
    h+='<div class="sec-h" style="color:var(--red)">فلوس متأخرة على عملاء <span class="ln"></span></div>'
      +late.map(x=>'<button class="card flat" onclick="openProjectDetail(\''+x.project_id+'\')" '
        +'style="width:100%;text-align:right;cursor:pointer;border-right:4px solid var(--red)">'
        +'<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">'
        +'<b style="flex:1;min-width:0;font-size:12.5px">'+esc(x.client_name||x.job_label||"")+'</b>'
        +'<b style="font-size:14px;color:var(--red)">'+_kj(x.due_amount)+' ج</b></div>'
        +'<div class="meta" style="margin-top:3px">'
        +'<span style="color:var(--red);font-weight:800">متأخرة '+(x.days_late||0)+' يوم</span>'
        +(x.job_label?'<span class="dot"></span><span>'+esc(x.job_label)+'</span>':'')
        +(x.client_phone?'<span class="dot"></span><span>'+esc(x.client_phone)+'</span>':'')
        +'</div></button>').join("");
  }
  const risks=[
    { n:+D.unpriced_n||0,   t:"ملف شغّال من غير سعر",      why:"شغل ماشي ومحدش عارف هياخد كام", go:"openProjects()" },
    { n:+D.jobs_stale||0,   t:"ملف واقف من أسبوع",         why:"", go:"openProjects()" },
    { n:+D.jobs_late||0,    t:"ملف فات وعد العميل",        why:"", go:"openProjects()" },
    { n:+D.routing_stuck||0,t:"ملف متوجّه ومحدش استلمه",   why:"", go:"openProjects()" },
    { n:+D.wo_late||0,      t:"أمر شغل فات موعده",         why:"", go:"openWorkOrders()" },
    { n:+D.staff_never||0,  t:"موظف مدخلش النظام خالص",    why:"أي شغل يتوجّهله هيضيع", go:"openStaffProgress()" }
  ].filter(x=>x.n>0);
  if(risks.length){
    h+='<div class="sec-h" style="color:#B45309">محتاج انتباهك <span class="ln"></span></div>'
      +risks.map(x=>'<button class="card flat" onclick="'+x.go+'" '
        +'style="width:100%;text-align:right;cursor:pointer;border-right:4px solid #B45309">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<b style="font-size:17px;color:#B45309;min-width:28px">'+x.n+'</b>'
        +'<span style="flex:1"><span style="font-size:12.5px;font-weight:700">'+x.t+'</span>'
        +(x.why?'<span class="muted" style="display:block;font-size:11px">'+x.why+'</span>':'')
        +'</span><span style="color:var(--muted)">‹</span></div></button>').join("");
  }
  // لو كل حاجة تمام
  if(!h){
    h='<div class="card flat" style="background:#F1F8F2;border-color:#A5D6A7">'
      +'<b style="font-size:13px">مفيش حاجة متأخرة — الشغل والفلوس ماشيين</b>'
      +'<div class="muted" style="font-size:11.5px;margin-top:3px">'
      +(+D.jobs_open||0)+' ملف شغّال بقيمة '+_kj(D.jobs_value)+' ج'
      +((+D.jobs_done_month||0)>0?' · قفلت '+D.jobs_done_month+' الشهر ده':'')
      +'</div></div>';
  }
  el.innerHTML=h;
}

let _scFilter="new";
async function openScanInbox(){
  if(!isOwnerOps() && PROFILE.role!=="manager"){ toast("وارد السكانر للإدارة","bad"); return; }
  openSheet('<h3>وارد السكانر</h3>'
    +'<div class="muted" style="margin:-6px 0 10px;font-size:12px">الورق اللي اتسكن ولسه محتاج يتوجّه لملفه.</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="scF">'
    +'<button class="chip on" data-sf="new">محتاج توجيه</button>'
    +'<button class="chip" data-sf="filed">اتوجّه</button>'
    +'<button class="chip" data-sf="all">الكل</button></div>'
    +'<div id="scBox"><div class="skel"></div><div class="skel"></div></div>'
    +actMini([{ label:"قفل", on:"closeSheet()" }]));
  document.querySelectorAll("#scF [data-sf]").forEach(b=>b.onclick=()=>{
    _scFilter=b.dataset.sf;
    document.querySelectorAll("#scF [data-sf]").forEach(x=>x.className="chip");
    b.className="chip on"; paintScanInbox();
  });
  await paintScanInbox();
}

async function paintScanInbox(){
  const box=$("scBox"); if(!box) return;
  try{
    let q=sb.from("os_scan_board").select("*").order("scanned_at",{ascending:false}).limit(60);
    if(_scFilter!=="all") q=q.eq("status",_scFilter);
    const { data, error }=await q; if(error) throw error;
    const R=data||[];
    if(!R.length){ box.innerHTML='<div class="empty">مفيش ورق هنا.</div>'; return; }
    box.innerHTML=R.map(x=>{
      const filed=x.status==="filed";
      return '<div class="card flat" style="border-right:4px solid '
        +(filed?"var(--green-d)":(x.guess_code?"#B45309":"var(--blue)"))+'">'
        +'<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">'
        +'<b style="flex:1;min-width:0;font-size:12.5px;word-break:break-all">'+esc(x.file_name||"")+'</b>'
        +(filed?'<span class="badge" style="background:#E8F5E9;color:#2E7D32;font-size:10px">اتوجّه</span>':'')+'</div>'
        +'<div class="meta" style="margin-top:4px">'
        +(x.pages?'<span>'+x.pages+' ورقة</span><span class="dot"></span>':'')
        +'<span>'+(x.size_mb||0)+' ميجا</span>'
        +'<span class="dot"></span><span>'+relativeTime(x.scanned_at)+'</span>'
        +(filed&&x.filed_by_name?'<span class="dot"></span><span>'+esc(x.filed_by_name)+'</span>':'')
        +'</div>'
        +(filed
          ?'<div class="muted" style="font-size:11.5px;margin-top:4px">راح لملف: <b>'+esc(x.job_label||"—")+'</b></div>'
          :(x.guess_code
             ?'<div style="font-size:11.5px;margin-top:5px;color:#B45309">النظام خمّن: <b>'+esc(x.guess_code)+'</b> — راجعه قبل ما توافق</div>'
             :'<div class="muted" style="font-size:11.5px;margin-top:5px">محتاج تحدّد الملف بنفسك</div>'))
        +'<div class="act-mini" style="margin-top:8px">'
        +(x.url?'<button class="btn" onclick="window.open(\''+esc(x.url)+'\',\'_blank\')">شوف</button>':'')
        +(!filed?'<button class="btn" onclick="openScanFile(\''+x.id+'\')">وجّه لملف</button>':'')
        +(!filed&&x.project_id?'<button class="btn" onclick="scanQuickFile(\''+x.id+'\',\''+x.project_id+'\')">وافق على التخمين</button>':'')
        +'</div></div>';
    }).join("");
  }catch(e){ box.innerHTML=failBox("معرفناش نجيبها.",paintScanInbox); }
}

async function scanQuickFile(sid, pid){
  confirmDlg("توجّه الورقة للملف اللي النظام خمّنه؟", async()=>{
    const { error }=await sb.rpc("os_scan_file_it",{ p_scan:sid, p_project:pid, p_folder:null });
    if(error){ toast(error.message,"bad"); return; }
    toast("اتوجّهت \u2713","ok"); paintScanInbox();
  });
}

async function openScanFile(sid){
  let folders='';
  try{
    const { data:fo }=await sb.from("os_file_folders").select("code,name").order("sort_order");
    folders=(fo||[]).map(f=>'<option value="'+esc(f.code)+'">'+esc(f.name)+'</option>').join("");
  }catch(e){}
  openSheet('<h3>وجّه الورقة لملفها</h3>'
    +'<div class="field"><label>دوّر على الملف</label>'
    +'<input id="sfQ" placeholder="كود الملف، رقم القطعة، اسم العميل…" oninput="sfSearch(this.value)"/></div>'
    +'<div id="sfHits" style="max-height:200px;overflow:auto;margin-bottom:10px"></div>'
    +'<div id="sfPicked"></div>'
    +'<div class="field"><label>اسم المرفق (اختياري)</label><input id="sfTitle" placeholder="سيب فاضي عشان ياخد اسم الملف المسكون"/></div>'
    +(folders?'<div class="field"><label>المجلد</label><select id="sfFolder">'+folders+'</select></div>':'')
    +actGroup("",[{ label:"وجّه", kind:"green", lead:true, id:"sfGo" }])
    +actMini([{ label:"رجوع", on:"openScanInbox()" }]));
  window._SF_SCAN=sid; window._SF_JOB=null;
  // نجيب التخمين لو موجود
  try{
    const { data }=await sb.from("os_scan_board").select("*").eq("id",sid).maybeSingle();
    if(data){
      $("sfQ").value=data.guess_code||data.file_name||"";
      if(data.project_id) sfPick(data.project_id, data.guess_code||"");
      await sfSearch($("sfQ").value);
    }
  }catch(e){}
  $("sfGo").onclick=()=>withLoading($("sfGo"),"بيوجّه…", async()=>{
    if(!window._SF_JOB){ toast("اختار الملف الأول","bad"); return; }
    const { error }=await sb.rpc("os_scan_file_it",{
      p_scan:sid, p_project:window._SF_JOB,
      p_title:$("sfTitle").value.trim()||null,
      p_folder:($("sfFolder")&&$("sfFolder").value)||null });
    if(error){ toast(error.message,"bad"); return; }
    toast("اتوجّهت \u2713","ok"); track("action","scan_filed"); openScanInbox();
  });
}

let _sfT=null;
function sfSearch(q){
  clearTimeout(_sfT);
  _sfT=setTimeout(async()=>{
    const box=$("sfHits"); if(!box) return;
    box.innerHTML='<div class="skel"></div>';
    try{
      const { data, error }=await sb.rpc("os_find_job",{ q:q||"", p_limit:15 });
      if(error) throw error;
      const R=data||[];
      if(!R.length){ box.innerHTML='<div class="empty" style="padding:10px">مفيش ملف مطابق.</div>'; return; }
      box.innerHTML=R.map(x=>'<button class="card flat" onclick="sfPick(\''+x.project_id+'\',\''
        +esc((x.job_code||"").replace(/'/g,""))+'\')" style="width:100%;text-align:right;cursor:pointer;padding:8px 10px;margin-bottom:5px">'
        +'<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
        +(x.job_code?'<span class="badge" style="background:#eef2f7;color:#0D47A1;font-weight:800;font-size:10px">'+esc(x.job_code)+'</span>':'')
        +'<b style="flex:1;min-width:0;font-size:12px">'+esc(x.job_name||"")+'</b></div>'
        +'<div class="meta" style="margin-top:3px;font-size:10.5px">'
        +(x.parcel_no?'<span>قطعة '+esc(x.parcel_no)+'</span>':'')
        +(x.client_name?'<span class="dot"></span><span>'+esc(x.client_name)+'</span>':'')
        +'</div></button>').join("");
    }catch(e){ box.innerHTML=failBox("معرفناش ندوّر.",()=>sfSearch(q)); }
  }, 260);
}

function sfPick(id, code){
  window._SF_JOB=id;
  $("sfPicked").innerHTML='<div class="card flat" style="border-right:4px solid var(--green-d);background:#F1F8E9;padding:8px 11px">'
    +'<b style="font-size:12.5px">الملف: '+esc(code||"اتحدّد")+'</b></div>';
  $("sfHits").innerHTML="";
}

async function openParcels(){
  openSheet('<h3>الأراضي</h3>'
    +'<div style="display:flex;gap:6px;margin-bottom:10px">'
    +'<button class="chip" onclick="openProjects()">الملفات</button>'
    +'<button class="chip on" onclick="openParcels()">الأراضي</button></div>'
    +'<div class="field"><input id="pcQ" placeholder="دوّر برقم القطعة أو المنطقة أو العميل…" oninput="filterParcels(this.value)"/></div>'
    +'<div id="pcBox"><div class="skel"></div><div class="skel"></div></div>'
    +actMini([{ label:"قفل", on:"closeSheet()" }]));
  try{
    const { data, error }=await sb.from("os_parcel_board").select("*")
      .order("last_activity",{ascending:false,nullsFirst:false});
    if(error) throw error;
    window._PC_ROWS=data||[];
    paintParcels(window._PC_ROWS);
  }catch(e){ $("pcBox").innerHTML=failBox("معرفناش نجيب الأراضي.",openParcels); }
}

function filterParcels(q){
  const t=(q||"").trim().toLowerCase();
  const R=(window._PC_ROWS||[]).filter(x=>!t||
    [x.parcel_code,x.parcel_no,x.land_code,x.area_name,x.client_name,x.client_phone,x.address]
      .some(v=>String(v||"").toLowerCase().includes(t)));
  paintParcels(R);

async function doUpload(id){
  const btn=$("upGo"); if(!btn) return;
  const title=$("upTitle").value.trim();
  const fEl=$("upFile");
  if(!title){ toast("اكتب اسم المرفق","bad"); return; }
  if(!fEl||!fEl.files||!fEl.files[0]){ toast("اختار الملف الأول","bad"); return; }
  const f=fEl.files[0];
  if(f.size > 20*1024*1024){ toast("الملف أكبر من 20 ميجا","bad"); return; }
  btn.disabled=true; btn.textContent="بيترفع…";
  try{
    const up=await uploadEmployeeFile(f);
    const tags=$("upTags")&&$("upTags").value.trim()
      ? $("upTags").value.split(",").map(x=>x.trim()).filter(Boolean) : null;
    await registerFile({ title, kind:"file", project_id:id,
      folder:($("upFolder")&&$("upFolder").value)||null,
      category:($("upFolder")&&$("upFolder").value)||null,
      url:up.url, storage_path:up.path, size_bytes:up.size, mime:up.mime, tags:tags });
    toast("اترفع على الملف \u2713","ok");
    track("action","upload_to_job");
    openProjectDetail(id);
  }catch(e){
    toast(e.message||"فشل الرفع","bad");
    btn.disabled=false; btn.textContent="ارفع المرفق";
  }
}

/* ═══════════ ذاكرة التنقّل — الرجوع يرجّع لآخر شاشة مش للرئيسية ═══════════ */
var _NAV=[], _CUR=null, _NAV_SILENT=false;

function navWrapAll(){
  // نلفّ كل دوال الشاشات عشان نفتكر إحنا كنا فين
  const skip=new Set(["openSheet","openSheetRaw"]);
  Object.getOwnPropertyNames(window).forEach(k=>{
    if(!/^open[A-Z]/.test(k) || skip.has(k)) return;
    const fn=window[k];
    if(typeof fn!=="function" || fn.__navWrapped) return;
    const w=function(){
      const args=Array.prototype.slice.call(arguments);
      // متعملش push لو ده رجوع، أو نفس الشاشة بنفس المدخلات
      if(!_NAV_SILENT && _CUR){
        const same=_CUR.k===k && JSON.stringify(_CUR.a)===JSON.stringify(args);
        if(!same){ _NAV.push(_CUR); if(_NAV.length>25) _NAV.shift(); }
      }
      _CUR={ k:k, a:args };
      return fn.apply(this,args);
    };
    w.__navWrapped=true;
    try{ window[k]=w; }catch(e){}
  });
}

function navBack(){
  const prev=_NAV.pop();
  if(!prev){ closeSheet(); return; }
  const fn=window[prev.k];
  if(typeof fn!=="function"){ closeSheet(); return; }
  _NAV_SILENT=true;
  try{ fn.apply(null, prev.a); }catch(e){ closeSheet(); }
  _NAV_SILENT=false;
  _CUR=prev;
}

function navReset(){ _NAV=[]; _CUR=null; }

async function paintPaymentReqs(){
  const box=$("prBox"); if(!box) return;
  try{
    let q=sb.from("os_payment_request_board").select("*").order("created_at",{ascending:false}).limit(60);
    if(_prFilter!=="all") q=q.eq("status",_prFilter);
    const { data, error }=await q; if(error) throw error;
    const R=data||[];
    if(!R.length){ box.innerHTML='<div class="empty">مفيش طلبات هنا.</div>'; return; }
    const LBL={pending:"مستني اعتماد",approved:"معتمد",rejected:"مرفوض",paid:"اتصرف"};
    box.innerHTML=R.map(x=>{
      const col=x.status==="paid"?"var(--green-d)":(x.status==="rejected"?"var(--red)":(x.overdue?"var(--red)":"#B45309"));
      return '<div class="card flat" style="border-right:4px solid '+col+'">'
        +'<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">'
        +'<b style="font-size:13.5px;flex:1">'+esc(x.title||"")+'</b>'
        +'<span class="badge" style="background:'+col+';color:#fff;font-size:10px">'+esc(LBL[x.status]||x.status)+'</span></div>'
        +'<div style="font-size:15px;font-weight:800;margin-top:4px">'+egp(x.amount)+'</div>'
        +'<div class="muted" style="font-size:11.5px;margin-top:3px">'
        +(x.job_label?'ملف '+esc(x.job_label)+' · ':'')
        +(x.payee?'لـ '+esc(x.payee)+' · ':'')+'طلب: '+esc(x.created_by_name||"—")+'</div>'
        +(x.note?'<div style="font-size:12px;margin-top:5px;white-space:pre-wrap">'+esc(x.note)+'</div>':'')
        +(x.reject_note?'<div style="font-size:12px;margin-top:5px;color:var(--red)">سبب الرفض: '+esc(x.reject_note)+'</div>':'')
        +'<div class="meta"><span>'+esc(x.code||"")+'</span>'
        +(x.need_by?'<span class="dot"></span><span'+(x.overdue?' style="color:var(--red);font-weight:800"':'')+'>قبل '+fmtDate(x.need_by)+'</span>':'')
        +(x.decided_by_name?'<span class="dot"></span><span>'+esc(x.decided_by_name)+'</span>':'')+'</div>'
        +(x.status==="pending"&&isFinanceUser()
          ?'<div class="act-mini" style="margin-top:8px">'
           +'<button class="btn" onclick="decidePayReq(\''+x.id+'\',true)">اعتمد واصرف</button>'
           +'<button class="btn" onclick="decidePayReq(\''+x.id+'\',false)">ارفض</button></div>':'')
        +(x.status==="paid"&&x.cost_id&&canFinRead()
          ?'<div class="act-mini" style="margin-top:8px"><button class="btn" onclick="printVoucher(\'payment\',\''+x.cost_id+'\')">اطبع إذن الصرف</button></div>':'')
        +'</div>';
    }).join("");
  }catch(e){ box.innerHTML=failBox("معرفناش نجيبها.",paintPaymentReqs); }
}

async function decidePayReq(id, ok){
  if(!ok){
    const why=prompt("سبب الرفض؟"); if(why===null) return;
    const { error }=await sb.rpc("os_decide_payment_request",{ p_id:id, p_ok:false, p_note:why||null });
    if(error){ toast(error.message,"bad"); return; }
    toast("اترفض","ok"); paintPaymentReqs(); return;
  }
  confirmDlg("تعتمد الطلب ده وتصرفه؟ هيتسجّل مصروف فعلي وهيتولّد إذن صرف.", async()=>{
    const { data, error }=await sb.rpc("os_decide_payment_request",{ p_id:id, p_ok:true });
    if(error){ toast(error.message,"bad"); return; }
    afterMoney("payment",(data&&data.cost_id)||null,"اتعتمد واتصرف \u2713",()=>openPaymentReqs());
  });
}

async function paintCollections(){
  const box=$("crBox"); if(!box) return;
  try{
    const { data, error }=await sb.from("os_collection_board").select("*").order("created_at",{ascending:false}).limit(60);
    if(error) throw error;
    let R=data||[];
    if(_crFilter==="open") R=R.filter(x=>["open","contacted","promised"].includes(x.status));
    else if(_crFilter==="late") R=R.filter(x=>x.overdue);
    else if(_crFilter==="done") R=R.filter(x=>x.status==="collected");
    if(!R.length){ box.innerHTML='<div class="empty">مفيش طلبات هنا.</div>'; return; }
    const LBL={open:"مستني",contacted:"اتكلّمنا",promised:"وعد بالدفع",collected:"اتحصّل",cancelled:"ملغي"};
    box.innerHTML=R.map(x=>{
      const col=x.status==="collected"?"var(--green-d)":(x.overdue?"var(--red)":"var(--blue)");
      return '<div class="card flat" style="border-right:4px solid '+col+'">'
        +'<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">'

async function setCollState(id, st){

async function paintWorkOrders(){
  const box=$("woBox"); if(!box) return;
  try{
    let q=sb.from("os_work_orders").select("*").order("created_at",{ascending:false}).limit(60);

    box.innerHTML=rows.map(r=>{

      return '<div class="card flat" style="border-right:4px solid '+col+'">'
        +'<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">'
        +'<b style="font-size:13.5px;flex:1">'+esc(r.title||"")+'</b>'
        +'<span class="badge" style="background:'+col+';color:#fff;font-size:10px">'+esc(r.state_label||"")+'</span></div>'

/* actGroup(عنوان, [{id,label,kind,lead}]) — kind: green|blue|ghost */
function actGroup(label, items){
  const vis=(items||[]).filter(Boolean);
  if(!vis.length) return "";
  return '<div class="act-group">'
    +(label?'<div class="act-label">'+esc(label)+'</div>':'')
    +'<div class="act-grid">'
    +vis.map(b=>'<button class="btn '+(b.kind||"ghost")+' '+(b.lead?"lead":"")+'"'
      +(b.id?' id="'+b.id+'"':'')+(b.on?' onclick="'+b.on+'"':'')+'>'+esc(b.label)+'</button>').join("")
    +'</div></div>';
}
function actMini(items){
  const vis=(items||[]).filter(Boolean);
  if(!vis.length) return "";
  return '<div class="act-mini">'+vis.map(b=>'<button class="btn"'
    +(b.id?' id="'+b.id+'"':'')+(b.on?' onclick="'+b.on+'"':'')+'>'+esc(b.label)+'</button>').join("")+'</div>';
}
function helpDot(key){
  if(!HELP_TEXT[key]) return "";
  /* span مش button — الزرار جوه الزرار HTML غلط والمتصفح بيكسره فيطلع نص غريب */
  return '<span class="help-dot" role="button" tabindex="0" data-help="'+key+'" aria-label="إيه ده؟">؟</span>';
}
function showHelp(key,anchorEl){
  const txt=HELP_TEXT[key]; if(!txt) return;
  let box=document.getElementById("helpPop");
  if(!box){
    box=document.createElement("div"); box.id="helpPop"; box.className="help-pop";
    document.body.appendChild(box);
    box.onclick=(e)=>e.stopPropagation();
  }
  box.innerHTML='<div style="font-size:13px;line-height:1.75">'+esc(txt)+'</div><button class="btn ghost sm" style="margin-top:8px;width:100%" onclick="hideHelp()">فهمت</button>';
  box.classList.add("open");
  /* موضع ذكي: تحت الزرار لو فيه مساحة، فوقه لو مفيش */
  try{
    const r=anchorEl.getBoundingClientRect();
    const bw=Math.min(280,window.innerWidth-24);
    box.style.width=bw+"px";
    let left=Math.max(12,Math.min(window.innerWidth-bw-12, r.left+r.width/2-bw/2));
    box.style.left=left+"px";
    const below=window.innerHeight-r.bottom;
    if(below>150){ box.style.top=(r.bottom+8)+"px"; box.style.bottom="auto"; }
    else { box.style.bottom=(window.innerHeight-r.top+8)+"px"; box.style.top="auto"; }
  }catch(e){}
}
function hideHelp(){ const b=document.getElementById("helpPop"); if(b) b.classList.remove("open"); }
document.addEventListener("click",(e)=>{
  const d=e.target.closest&&e.target.closest("[data-help]");
  if(d){ e.preventDefault(); e.stopPropagation(); showHelp(d.dataset.help,d); return; }
  hideHelp();
});
function toast(msg,kind){ try{ if(kind==="ok"&&navigator.vibrate) navigator.vibrate(18); }catch(e){} try{ if(kind==="bad") track("error",String(msg||"").slice(0,60)); }catch(e){} const t=$("toast"); t.textContent=msg; t.className="toast show "+(kind||""); clearTimeout(t._t); t._t=setTimeout(()=>{t.className="toast "+(kind||"");},2600); }
const _RETRY={};
function failBox(msg,fn){ const k="r"+Math.random().toString(36).slice(2,9); _RETRY[k]=fn; return '<div class="empty">'+msg+'<br><button class="btn ghost sm" data-eretry="'+k+'" style="margin-top:8px">حاول تاني</button></div>'; }
document.addEventListener("click",(e)=>{ const b=e.target&&e.target.closest&&e.target.closest("[data-eretry]"); if(!b) return; const f=_RETRY[b.dataset.eretry]; if(typeof f==="function"){ b.disabled=true; b.textContent="بنحاول…"; try{ f(); }catch(_e){} } });
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleDateString("ar-EG",{day:"numeric",month:"short"}); }catch(e){ return d; } }
function timeAgo(d){ if(!d) return ""; const s=(Date.now()-new Date(d).getTime())/1000; if(s<60)return"دلوقتي"; if(s<3600)return Math.floor(s/60)+" د"; if(s<86400)return Math.floor(s/3600)+" س"; return Math.floor(s/86400)+" يوم"; }
function initials(n){ const p=String(n||"؟").trim().split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
function firstName(n){ n=(n||'').trim(); return n.split(/\s+/)[0]||n; }
function _icoWrap(p){ return '<span class="icoG" style="display:inline-flex;color:#94a3b8;vertical-align:-2px">'+p+'</span>'; }
const ICONS={
 mic:_icoWrap('<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>'),

function openSheet(html){
  $("sheet").innerHTML=navBackBtn()+html; $("modal").classList.add("open");
  try{ if(!window._navPushed){ history.pushState({sheet:1},""); window._navPushed=true; } }catch(e){}

  try{ const m=String(html).match(/<h3>([^<]{2,44})</); if(m) track("screen", m[1].trim()); }catch(e){}
}
function closeSheet(){
  if(sRecOn){ try{ stopSheetMic(true); }catch(e){} }
  try{
    const rt=$("rTitle"), rd=$("rDet");
    if(rt&&rd&&(rt.value.trim()||rd.value.trim())&&!window._reqSent){ _reqDraft={ t:rt.value, d:rd.value }; }
  }catch(e){}

/* ===================== BOOT ===================== */
async function boot(){
  var _bootSafety = setTimeout(function(){ try{ var b=$("boot"), a=$("app"); if(b && b.style.display!=="none" && (!a || a.style.display!=="block")){ showLogin(); } }catch(_e){} }, 12000);
  if(!window.supabase || !window.supabase.createClient){
    clearTimeout(_bootSafety);
    $("boot").innerHTML='<div style="color:var(--red);font-weight:700">معرفناش نحمّل مكتبة Supabase. اتأكد إن النت شغّال وجرّب تاني.</div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ storage:safeStorage, persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });
  let session=null;
  try{ const r=await Promise.race([ sb.auth.getSession(), new Promise(function(res){ setTimeout(function(){ res({data:{session:null}}); },5000); }) ]); session=r.data.session; }catch(e){}
  try{
    if(session && session.user){ await startApp(session.user); refreshCostCats(); }
    else{ showLogin(); }
  }catch(_e){ showLogin(); }
  clearTimeout(_bootSafety);
}
function showLogin(){ $("boot").style.display="none"; $("app").style.display="none"; $("login").style.display="flex"; }

async function doLogin(){
  const email=$("inEmail").value.trim(), pass=$("inPass").value;
  const e=$("loginErr"); e.style.display="none";
  if(!email||!pass){ e.textContent="اكتب الإيميل والباسوورد."; e.style.display="block"; return; }
  const btn=$("btnLogin"); btn.disabled=true; btn.textContent="بيدخل…";
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error){ throw error; }
    await startApp(data.user);
  }catch(err){
    e.textContent = "الإيميل أو الباسوورد غلط."; e.style.display="block";
    btn.disabled=false; btn.textContent="دخول";
  }
}

async function startApp(user){
  ME=user;
  // load profile + lookups
  try{
    const [{data:prof}, {data:profs}, {data:depts}] = await Promise.race([
      Promise.all([
        sb.from("os_profiles").select("*").eq("id",user.id).maybeSingle(),
        sb.from("os_profiles").select("id,name,email,role,dept,manager_id,position"),
        sb.from("os_departments").select("*").order("sort_order",{ascending:true}).order("name"),
      ]),
      new Promise(function(res){ setTimeout(function(){ res([{data:null},{data:null},{data:null}]); },6000); })
    ]);
    PROFILE = prof || { id:user.id, name:(user.email||"مستخدم").split("@")[0], role:"employee", dept:null, email:user.email };
    PROFILES = profs || [];
    BY_ID={}; PROFILES.forEach(p=>BY_ID[p.id]=p);
    const _allDepts = depts || [];
    DEPT_BY_KEY={}; _allDepts.forEach(d=>DEPT_BY_KEY[d.key]=d);
    DEPTS = _allDepts.filter(d=> d.sort_order==null || d.sort_order < 900);
  }catch(e){
    PROFILE = { id:user.id, name:(user.email||"مستخدم").split("@")[0], role:"employee", dept:null };
  }
  $("boot").style.display="none"; $("login").style.display="none"; try{ navWrapAll(); }catch(e){} $("app").style.display="block";
  $("uName").textContent=PROFILE.name;
  $("uRole").textContent=userTitle(PROFILE);
  const av=$("uAvatar"); av.textContent=initials(PROFILE.name);
  av.style.cursor="pointer"; av.title="حسابي"; av.onclick=openMyAccount;
  const nb=$("notifBell"); if(nb) nb.onclick=()=>{ askNotifPermission(); openNotifications(); };
  const gs=$("globalSearchBtn"); if(gs) gs.onclick=()=>openGlobalSearch();
  refreshNotifBadge();
  const col={owner:"#0D47A1",ops:"#1E88E5",manager:"#2E7D32",employee:"#6b7a8d"}[PROFILE.role]||"#1E88E5";
  av.style.background="linear-gradient(135deg,"+col+","+col+"cc)";
  buildTabs();
  switchTab("home");
  subscribeRealtime();
  initOfflineDetect(); initPullRefresh();
  let _lastErrT=0;
  window.addEventListener("unhandledrejection",(e)=>{
    try{
      const now=Date.now(); if(now-_lastErrT<8000) return; _lastErrT=now;
      const msg=String((e&&e.reason&&e.reason.message)||"");
      try{ track("error","unhandled:"+msg.slice(0,60)); }catch(ex){}
      if(msg.indexOf("Failed to fetch")>=0||msg.indexOf("NetworkError")>=0||msg.indexOf("Load failed")>=0){ toast("النت متقلقل — هنعيد المحاولة لوحدنا","bad"); }
    }catch(x){}
  });
  /* تحديث تلقائي هادي للرئيسية كل 90 ثانية */
  setInterval(()=>{ if(activeTab==="home" && !document.hidden && !sRecOn && !recording) renderHome(); },90000);
  // session watch: every 10 min check session is still valid
  _sessionWatchId=setInterval(async()=>{ try{ const r=await sb.auth.getSession(); if(!r.data.session){ clearInterval(_sessionWatchId); toast("انتهت الجلسة — سجّل دخول تاني","bad"); setTimeout(()=>location.reload(),2500); } }catch(e){} },600000);
}

/* coceo = مدير المكتب: صلاحيات الأوبريشن كاملة على الشغل — بدون المالية.
   الداتابيز: os_role() بترجّعله 'ops'، ودوال المالية بتقرا الدور الخام فبتستبعده. */
function isCoCeo(){ return PROFILE.role==="coceo"; }
function isOwnerOps(){ return PROFILE.role==="owner"||PROFILE.role==="ops"||PROFILE.role==="coceo"; }
function canSeeClients(){ return isOwnerOps()||(PROFILE.role==="manager"&&PROFILE.dept==="hr"); }
function canSeeLeads(){ if(isOwnerOps()) return true; if(PROFILE.position==="assistant") return true; if(PROFILE.role==="manager"&&String(PROFILE.dept||"").startsWith("off_")) return true; if(PROFILE.dept==="legal"||PROFILE.dept==="finance") return true; return false; }
function userTitle(p){
  if(p.role==="owner") return "المالك · الإدارة العليا";
  if(p.role==="coceo") return "مدير المكتب · الإدارة التنفيذية";
  if(p.role==="ops") return p.dept||"إدارة التشغيل";
  const dn=DEPT_BY_KEY[p.dept]?DEPT_BY_KEY[p.dept].name:(p.dept||"");
  return ({manager:"مدير قسم",employee:"موظف"}[p.role]||p.role)+(dn?(" · "+dn):"");
}
function canWrite(){ return PROFILE.role!=="employee"; }
function myDeptKey(){ return DEPT_BY_KEY[PROFILE.dept] ? PROFILE.dept : null; }
function canContracts(){ return myDeptKey()==="legal"; }

/* ── بناء جدول الدفعات لملف ── */
async function openBuildInstallments(jid, curValue){
  const { data:plans } = await sb.from("os_payment_plans")
    .select("service_code,seq_no,title,pct").eq("active",true).order("seq_no");
  const { data:prj } = await sb.from("os_projects")
    .select("id,job_code,name,service_code,value_egp").eq("id",jid).maybeSingle();
  if(!prj) return toast("الملف مش موجود","err");

  const mine=(plans||[]).filter(p=>p.service_code===prj.service_code);
  const val = curValue || prj.value_egp;

  let preview='';
  if(!mine.length){
    preview='<div class="empty-state"><b>مفيش قالب دفعات لخدمة '+esc(SVC_AR[prj.service_code]||prj.service_code)+'</b>'
      +'<div class="muted" style="font-size:12px;margin-top:4px">اعمله من «المزيد ← أنواع الخدمات»</div></div>';
  }else{
    preview='<table class="dtable"><thead><tr><th>#</th><th>الدفعة</th><th>النسبة</th><th>المبلغ</th></tr></thead><tbody>'
      + mine.map(p=>'<tr><td>'+p.seq_no+'</td><td>'+esc(p.title)+'</td>'
          +'<td class="ltr">'+p.pct+'%</td>'
          +'<td class="ltr">'+(val?Math.round(val*p.pct/100).toLocaleString("en"):'—')+'</td></tr>').join("")
      + '</tbody></table>';
  }

  openSheet('<h3>جدول الدفعات</h3>'
    +'<div class="muted" style="font-size:11.5px;margin:-4px 0 10px">'
    +esc(prj.job_code||"")+' — '+esc(SVC_AR[prj.service_code]||"")+'</div>'
    +'<div class="field"><label>قيمة الملف (ج)</label>'
    +'<input id="biVal" class="ltr" type="number" step="1" value="'+(val||"")+'" placeholder="اكتب القيمة"/></div>'
    +'<div id="biPrev">'+preview+'</div>'
    +'<div class="row-actions" style="margin-top:12px">'
    +(mine.length?'<button class="btn primary" id="biGo">ابنِ الجدول</button>':'')
    +'<button class="btn secondary" onclick="closeSheet()">قفل</button></div>');

  const iv=$("biVal");
  if(iv) iv.oninput=()=>{
    const v=Number(iv.value||0);
    $("biPrev").innerHTML = mine.length
      ? '<table class="dtable"><thead><tr><th>#</th><th>الدفعة</th><th>النسبة</th><th>المبلغ</th></tr></thead><tbody>'
        + mine.map(p=>'<tr><td>'+p.seq_no+'</td><td>'+esc(p.title)+'</td>'
            +'<td class="ltr">'+p.pct+'%</td>'
            +'<td class="ltr">'+(v?Math.round(v*p.pct/100).toLocaleString("en"):'—')+'</td></tr>').join("")
        + '</tbody></table>'
      : preview;
  };
  const go=$("biGo");
  if(go) go.onclick=()=>doBuildInstallments(jid, Number($("biVal").value||0), false);
}

async function doBuildInstallments(jid, val, replace){
  if(!val || val<=0) return toast("اكتب قيمة الملف الأول","err");
  const btn=$("biGo"); if(btn){ btn.disabled=true; btn.textContent="بيبني…"; }
  try{
    const { data, error } = await sb.rpc("os_build_installments",
      { p_project:jid, p_value:val, p_replace:replace });
    if(error) throw error;
    if(data && data.ok===false){
      if(btn){ btn.disabled=false; btn.textContent="ابنِ الجدول"; }
      return confirmReplace(jid, val, data.existing||0);
    }
    toast("الجدول اتبنى — "+(data.count||0)+" أقساط","ok");
    closeSheet();
    if(typeof openProjectDetail==="function") openProjectDetail(jid);
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="ابنِ الجدول"; }
    toast(String(e.message||e),"err");
  }
}

function confirmReplace(jid, val, n){
  openSheet('<h3>فيه جدول موجود</h3>'
    +'<div style="font-size:13.5px;margin-bottom:10px">الملف ده عنده <b>'+n+'</b> أقساط.</div>'
    +'<div class="muted" style="font-size:12px;margin-bottom:12px">'
    +'الاستبدال بيلغي الأقساط غير المحصّلة — مش بيمسحها. الأقساط اللي اتحصّلت بتمنع الاستبدال.</div>'
    +'<div class="danger-zone"><div class="row-actions">'
    +'<button class="btn danger" id="biRep">استبدل الجدول</button>'
    +'<button class="btn secondary" onclick="openBuildInstallments(\''+jid+'\','+val+')">رجوع</button>'
    +'</div></div>');
  $("biRep").onclick=async()=>{
    const b=$("biRep"); b.disabled=true; b.textContent="بيستبدل…";
    try{
      const { data, error } = await sb.rpc("os_build_installments",
        { p_project:jid, p_value:val, p_replace:true });
      if(error) throw error;
      toast("الجدول اتبدّل — "+(data.count||0)+" أقساط","ok");
      closeSheet();
      if(typeof openProjectDetail==="function") openProjectDetail(jid);
    }catch(e){ b.disabled=false; b.textContent="استبدل الجدول"; toast(String(e.message||e),"err"); }
  };
}

async function openServiceTypes(){

    +actMini([{label:"قفل",on:"closeSheet()"}]));
  try{
    const [{ data:svc },{ data:plans },{ data:stg }]=await Promise.all([
      sb.from("os_service_types").select("code,name,active").order("code"),
      sb.from("os_payment_plans").select("service_code,seq_no,title,pct,stage_seq,active").order("seq_no"),
      sb.from("os_stage_defs").select("service_code,seq,name").order("seq")
    ]);

      +'النسب دي بتتحوّل لجدول دفعات على كل ملف جديد. المجموع لازم 100%.</div>';

      const ns=S.filter(x=>x.service_code===v.code).length;

        +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        +'<b style="flex:1;font-size:13.5px">'+esc(v.name)+' <span class="muted ltr">('+esc(v.code)+')</span></b>'
        +'<span class="muted" style="font-size:11px">'+ns+' مرحلة</span>'
        +(tot===100?'<span class="ok-note" style="font-size:11.5px">100%</span>'
                   :'<span class="chip-warn">'+tot+'% — مش 100</span>')
        +'</div>';
      if(!mine.length){
        h+='<div class="warn-inline" style="margin-top:6px">⚠️ مفيش قالب دفعات — الملفات دي مش هيتبنى ليها جدول</div>';
      }else{
        h+='<table class="dtable" style="margin-top:8px"><thead><tr>'
          +'<th>#</th><th>الدفعة</th><th>%</th><th>عند مرحلة</th></tr></thead><tbody>';
        mine.forEach(p=>{
          const sn=S.find(x=>x.service_code===v.code && x.seq===p.stage_seq);
          h+='<tr><td>'+p.seq_no+'</td><td>'+esc(p.title)+'</td>'
            +'<td class="ltr">'+p.pct+'%</td>'
            +'<td>'+(sn?esc(sn.name):'<span class="muted">—</span>')+'</td></tr>';
        });
        h+='</tbody></table>';

        +'<button class="btn secondary sm" onclick="openEditPlan(\''+v.code+'\')">عدّل الدفعات</button></div>';
      h+='</div>';
    });
    $("stBox").innerHTML=h;
  }catch(e){ $("stBox").innerHTML=failBox("معرفناش نجيبها.",()=>openServiceTypes()); }
}

async function openEditPlan(code){
  if(!canEditPlans()) return toast("تعديل القوالب للإدارة والمالية","err");
  const [{ data:plans },{ data:stg }]=await Promise.all([
    sb.from("os_payment_plans").select("id,seq_no,title,pct,stage_seq,active")
      .eq("service_code",code).order("seq_no"),
    sb.from("os_stage_defs").select("seq,name").eq("service_code",code).order("seq")
  ]);
  const P=plans||[], S=stg||[];
  const opt=(sel)=>'<option value="">— من غير مرحلة —</option>'
    + S.map(x=>'<option value="'+x.seq+'"'+(x.seq===sel?' selected':'')+'>'+esc(x.name)+'</option>').join("");

  let rows = P.map((p,i)=>planRow(i,p.seq_no,p.title,p.pct,p.stage_seq,opt)).join("");
  if(!rows) rows = planRow(0,1,"",0,null,opt);

  openSheet('<h3>دفعات — '+esc(SVC_AR[code]||code)+'</h3>'
    +'<div class="muted" style="font-size:11.5px;margin:-4px 0 10px">'
    +'المجموع لازم يساوي 100%. ربط الدفعة بمرحلة بيخلّيها تستحق أول ما المرحلة تبدأ.</div>'
    +'<div id="planRows">'+rows+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px;margin:10px 0">'
    +'<button class="btn tertiary sm" id="planAdd">+ دفعة</button>'
    +'<span style="flex:1"></span><span id="planSum" class="muted"></span></div>'
    +'<div class="row-actions">'
    +'<button class="btn primary" id="planSave">احفظ</button>'
    +'<button class="btn secondary" onclick="openServiceTypes()">رجوع</button></div>');

  $("planAdd").onclick=()=>{
    const n=document.querySelectorAll("#planRows .plan-row").length;
    $("planRows").insertAdjacentHTML("beforeend", planRow(n,n+1,"",0,null,opt));

  };

function planRow(i,seq,title,pct,stage,opt){
  return '<div class="plan-row" style="display:flex;gap:6px;align-items:flex-start;margin-bottom:7px">'

function wirePlanSum(){
  const upd=()=>{
    let t=0;
    document.querySelectorAll("#planRows .p-pct").forEach(x=>t+=Number(x.value||0));
    const el=$("planSum");
    el.textContent="المجموع "+t.toFixed(2)+"%";
    el.className = Math.abs(t-100)<0.01 ? "ok-note" : "warn-inline";
  };
  document.querySelectorAll("#planRows .p-pct").forEach(x=>x.oninput=upd);
  document.querySelectorAll("#planRows .p-del").forEach(b=>b.onclick=()=>{
    if(document.querySelectorAll("#planRows .plan-row").length<=1) return toast("لازم دفعة واحدة على الأقل","err");
    b.closest(".plan-row").remove(); upd();
  });
  upd();
}

async function savePlan(code){
  const rows=[...document.querySelectorAll("#planRows .plan-row")].map(r=>({
    title: (r.querySelector(".p-title").value||"").trim(),
    pct: Number(r.querySelector(".p-pct").value||0),
    stage_seq: r.querySelector(".p-stage").value ? Number(r.querySelector(".p-stage").value) : null
  }));
  if(rows.some(r=>!r.title)) return toast("كل دفعة لازم ليها اسم","err");
  const tot=rows.reduce((a,b)=>a+b.pct,0);
  if(Math.abs(tot-100)>0.01) return toast("المجموع "+tot.toFixed(2)+"% — لازم 100%","err");

  const btn=$("planSave"); btn.disabled=true; btn.textContent="بيحفظ…";
  try{
    /* عملية واحدة ذرّية — الحذف والإدراج في معاملة واحدة.
       نداءان منفصلان كان ممكن يسيبوا الخدمة من غير قالب لو التاني فشل. */
    const { data, error } = await sb.rpc("os_save_payment_plan",
      { p_service: code, p_rows: rows });
    if(error) throw error;
    toast("القالب اتحفظ — "+(data.count||rows.length)+" دفعات","ok");
    openServiceTypes();
  }catch(e){
    btn.disabled=false; btn.textContent="احفظ";
    toast(String(e.message||e),"err");
  }
}

async function doRecordOwner(pid){
  const sel=($("roParty").value||"").trim();
  const nm=($("roNew").value||"").trim();
  const ph=($("roPhone").value||"").trim();
  const sh=($("roShare").value||"").trim();
  const fr=$("roFrom").value||null;
  const ev=$("roEv").value||"recorded";
  const bs=($("roBasis").value||"").trim()||null;
  if(!sel && !nm) return toast("اختار طرف أو اكتب اسم جديد","err");

  try{
    let party=sel;
    if(!party){
      const { data:np, error:e1 } = await sb.from("os_parties")
        .insert({kind:"person",name:nm,phone:ph||null}).select("id").single();
      if(e1) throw e1;
      party=np.id;
    }
    const { error } = await sb.rpc("os_record_ownership",{
      p_parcel:pid, p_party:party,

      p_from: fr, p_basis: bs, p_status: ev });

    toast("الملكية اتسجّلت","ok");

  }catch(e){

async function doTransfer(pid){
  const fromName=$("tfFrom").value;
  const toSel=($("tfTo").value||"").trim();
  const nm=($("tfNew").value||"").trim();
  const ph=($("tfPhone").value||"").trim();
  const sh=($("tfShare").value||"").trim();
  const on=$("tfOn").value||null;
  const bs=($("tfBasis").value||"").trim()||null;
  if(!toSel && !nm) return toast("اختار مشتري أو اكتب اسم","err");
  const btn=$("tfGo"); btn.disabled=true; btn.textContent="بينفّذ…";
  try{
    const { data:fp } = await sb.from("os_parties").select("id").eq("name",fromName).limit(1).maybeSingle();
    if(!fp) throw new Error("مالقيناش البايع في الأطراف");
    let toParty=toSel;
    if(!toParty){
      const { data:np, error:e1 } = await sb.from("os_parties")
        .insert({kind:"person",name:nm,phone:ph||null}).select("id").single();
      if(e1) throw e1;
      toParty=np.id;
    }
    const { error } = await sb.rpc("os_transfer_ownership",{
      p_parcel:pid, p_from_party:fp.id, p_to_party:toParty,
      p_share: sh?Number(sh):null, p_on:on, p_basis:bs });
    if(error) throw error;
    toast("الملكية اتنقلت","ok");
    openOwnership(pid);
  }catch(e){
    btn.disabled=false; btn.textContent="نفّذ النقل";
    toast(ownErr(e),"err");
  }
}

/* رسائل أخطاء مفهومة */
function ownErr(e){
  const m=String((e&&e.message)||e||"");
  if(m.includes("no_same_party_overlap")) return "الطرف ده له ملكية مسجّلة في نفس الفترة";
  if(m.includes("مايتعدلش")||m.includes("مايتمسحش")) return m;
  if(m.includes("للإدارة فقط")) return "تسجيل الملكية للإدارة بس";
  if(m.includes("مفيش ملكية سارية")) return "البايع مالوش ملكية سارية على الأرض دي";
  if(m.includes("share_percent")) return "الحصة لازم تكون بين 0 و 100";
  return m||"حصل خطأ";
}

/* ═══════════════ المرحلة ٣ — البحث العام ═══════════════
   الترتيب متدرّج: المطابقة التامة للكود تكسب دايماً — حتى لو الملف مؤرشف.
   الأحدثية والنشاط مرجّحات داخل الطبقة الواحدة فقط، مش مضاعِفات. */

function normAr(t){
  return (t||"").toString().trim().toLowerCase()
    .replace(/[\u064B-\u0652\u0670]/g,"")        /* تشكيل */
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/[ىئ]/g,"ي").replace(/ؤ/g,"و")
    .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))  /* أرقام عربية */
    .replace(/\s+/g," ");
}
function normCode(t){ return normAr(t).replace(/[-_\s/]/g,""); }
function normPhone(t){ return (t||"").replace(/[^0-9]/g,""); }

/* الطبقات: 1 كود تام · 2 اسم/تليفون تام · 3 بداية · 4 احتواء */
function rankTier(q, row){
  const nq=normAr(q), cq=normCode(q), pq=normPhone(q);
  const codes=[row.job_code,row.parcel_code,row.contract_no,row.permit_no].filter(Boolean).map(normCode);
  const nums =[row.parcel_no].filter(Boolean).map(normCode);
  const names=[row.client_name,row.job_name,row.title].filter(Boolean).map(normAr);
  const phone=normPhone(row.phone);

  if(cq && (codes.includes(cq) || nums.includes(cq))) return 1;
  if(nq && names.includes(nq)) return 2;
  if(pq && phone && phone===pq) return 2;
  if(cq && (codes.some(c=>c.startsWith(cq)) || nums.some(n=>n.startsWith(cq)))) return 3;
  if(nq && names.some(n=>n.startsWith(nq))) return 3;
  if(pq && phone && (phone.startsWith(pq)||phone.endsWith(pq))) return 3;
  return 4;
}

async function gsearch(q){
  const nq=normAr(q), pq=normPhone(q), like="%"+q.trim()+"%";
  const out={clients:[],parcels:[],jobs:[]};
  const jobs = sb.from("os_client_tree")
    .select("client_id,client_name,phone,parcel_id,parcel_no,parcel_code,job_id,job_code,job_name,status,archived")
    .or(`client_name.ilike.${like},job_code.ilike.${like},parcel_no.ilike.${like},parcel_code.ilike.${like},job_name.ilike.${like}`)
    .limit(60);
  const parcels = sb.from("os_parcel_owners_now")
    .select("parcel_id,parcel_no,parcel_code,owners_label,total_share,has_unverified")
    .or(`parcel_no.ilike.${like},parcel_code.ilike.${like},owners_label.ilike.${like}`)
    .limit(40);
  const clients = pq.length>=3
    ? sb.from("clients").select("id,name,phone,code").ilike("phone","%"+pq+"%").limit(20)
    : sb.from("clients").select("id,name,phone,code").ilike("name",like).limit(20);

  const [j,p,c] = await Promise.all([jobs,parcels,clients]);
  if(j.error) throw j.error;

  const seenJob=new Set(), seenCl=new Set();
  (j.data||[]).forEach(r=>{
    if(r.job_id && !seenJob.has(r.job_id)){ seenJob.add(r.job_id); out.jobs.push(r); }
    if(r.client_id && !seenCl.has(r.client_id)){
      seenCl.add(r.client_id);
      out.clients.push({id:r.client_id,name:r.client_name,phone:r.phone});
    }
  });
  (c.data||[]).forEach(r=>{ if(!seenCl.has(r.id)){ seenCl.add(r.id);
      out.clients.push({id:r.id,name:r.name,phone:r.phone}); }});
  out.parcels = p.data||[];

  /* الترتيب: الطبقة أولاً · ثم النشاط · ثم الاسم */
  const srt=(a,b)=>{
    const ta=rankTier(q,a), tb=rankTier(q,b);
    if(ta!==tb) return ta-tb;                       /* الطبقة تحكم */
    const aa=a.archived?1:0, ab=b.archived?1:0;
    if(aa!==ab) return aa-ab;                       /* مرجّح داخل الطبقة */
    return normAr(a.job_code||a.parcel_no||a.name||"").localeCompare(
           normAr(b.job_code||b.parcel_no||b.name||""));
  };
  out.jobs.sort(srt); out.parcels.sort(srt); out.clients.sort(srt);
  return out;
}

function gsearchHTML(res,q){
  const n=res.clients.length+res.parcels.length+res.jobs.length;
  if(!n) return `<div class="empty-state"><b>مفيش نتيجة لـ «${esc(q)}»</b>
      <div class="muted" style="font-size:12px;margin-top:4px">جرّب رقم القطعة أو آخر أرقام التليفون</div></div>`;
  let h="";
  if(res.parcels.length){
    h+=`<div class="sec-h">📍 الأراضي (${res.parcels.length}) <span class="ln"></span></div>`;
    h+=res.parcels.slice(0,6).map(r=>`<button class="res-row" data-gp="${r.parcel_id}">
        <div><b>قطعة ${esc(r.parcel_no)}</b> <span class="muted ltr">${esc(r.parcel_code||"")}</span>
        <div class="muted" style="font-size:12px">${r.owners_label?esc(r.owners_label):'⚠️ مفيش مالك مسجّل'}</div></div>
        <span class="row-go">›</span></button>`).join("");
  }
  if(res.clients.length){
    h+=`<div class="sec-h">🧑 العملاء (${res.clients.length}) <span class="ln"></span></div>`;
    h+=res.clients.slice(0,6).map(r=>`<button class="res-row" data-gc="${r.id}">
        <div><b>${esc(r.name)}</b>
        <div class="muted ltr" style="font-size:12px">${esc(r.phone||"")}</div></div>
        <span class="row-go">›</span></button>`).join("");
  }
  if(res.jobs.length){
    h+=`<div class="sec-h">📁 الملفات (${res.jobs.length}) <span class="ln"></span></div>`;
    h+=res.jobs.slice(0,8).map(r=>`<button class="res-row" data-gj="${r.job_id}">
        <div><b class="ltr">${esc(r.job_code||"")}</b> ${esc(r.job_name||"")}
        ${r.archived?'<span class="chip-warn">مؤرشف</span>':''}
        <div class="muted" style="font-size:12px">${esc(r.client_name||"")}${r.parcel_no?" · قطعة "+esc(r.parcel_no):""}</div></div>
        <span class="row-go">›</span></button>`).join("");
  }
  return h;
}

/* ── ١ بيان الأعمال: العميل أولاً ── */
let ARCH_TAB = "clients";   /* clients | parcels */

async function renderArchive(){

    <div class="page-h"><div><h2>بيان الأعمال</h2>
      <div class="sub">أرشيف المكتب الكامل</div></div></div>
    <div class="gsearch-wrap" style="margin-bottom:12px">
      <input id="archQ" class="inp gsearch" placeholder="ابحث باسم العميل · التليفون · رقم القطعة · كود الملف"

      <button class="chip ${ARCH_TAB==='clients'?'on':''}" data-atab="clients">العملاء</button>

    </div>
    <div id="archBody"><div class="muted" style="padding:20px;text-align:center">بيحمّل…</div></div>`;

async function archLoad(){
  const body=$("archBody"); if(!body) return;
  try{
    if(ARCH_TAB==="clients"){
      const { data, error } = await sb.from("os_client_tree")
        .select("client_id,client_name,phone,parcel_no,job_code,job_name,status")
        .order("client_name").limit(400);
      if(error) throw error;
      body.innerHTML = archClients(data||[]);
    }else{
      const { data, error } = await sb.from("os_parcel_owners_now")
        .select("parcel_id,parcel_no,parcel_code,owners_label,owners_count,total_share,has_unverified")
        .order("parcel_no").limit(400);
      if(error) throw error;
      body.innerHTML = archParcels(data||[]);
    }
    wireArchRows();
  }catch(e){
    body.innerHTML = `<div class="empty-state">
      <b>مقدرناش نحمّل البيانات</b>
      <div class="muted" style="font-size:12px;margin-top:4px">${esc(e.message||"خطأ غير معروف")}</div>
      <button class="btn sm" style="margin-top:10px" onclick="renderArchive()">جرّب تاني</button></div>`;
  }
}

/* شجرة العميل — عميل ← أراضيه ← ملفاته */
function archClients(rows){
  if(!rows.length) return archEmpty("مفيش عملاء لسه","أول عميل هيظهر هنا أول ما يتسجّل");
  const byClient = {};
  rows.forEach(r=>{
    if(!byClient[r.client_id]) byClient[r.client_id]={name:r.client_name,phone:r.phone,parcels:{}};
    const key = r.parcel_no || "__none__";
    if(!byClient[r.client_id].parcels[key]) byClient[r.client_id].parcels[key]=[];
    if(r.job_code) byClient[r.client_id].parcels[key].push(r);
  });
  let h = `<table class="dtable"><thead><tr>
      <th>العميل</th><th>التليفون</th><th>الأراضي</th><th>الملفات</th><th></th></tr></thead><tbody>`;
  Object.entries(byClient).forEach(([id,c])=>{
    const pk = Object.keys(c.parcels).filter(k=>k!=="__none__");
    const jobs = Object.values(c.parcels).reduce((a,b)=>a+b.length,0);
    h += `<tr data-client="${id}">
      <td><b>${esc(c.name)}</b></td>
      <td class="ltr">${esc(c.phone||"—")}</td>
      <td>${pk.length? pk.map(p=>"قطعة "+esc(p)).join(" · ") : '<span class="muted">—</span>'}</td>
      <td>${jobs||'<span class="muted">—</span>'}</td>
      <td class="row-go">›</td></tr>`;
  });
  return h+"</tbody></table>";
}

/* الأراضي — بالمُلّاك الحاليين */
function archParcels(rows){
  if(!rows.length) return archEmpty("مفيش أراضي لسه","أول أرض هتظهر هنا أول ما تتسجّل");
  let h = `<table class="dtable"><thead><tr>
      <th>القطعة</th><th>الكود</th><th>المُلّاك</th><th>الحصص</th><th></th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const owners = r.owners_label
      ? esc(r.owners_label)
        + (r.has_unverified ? ' <span class="chip-warn">غير موثّق</span>' : '')
        + (r.share_overflow ? ' <span class="chip-warn">&gt;100%</span>' : '')
      : '<span class="warn-inline">⚠️ مفيش مالك مسجّل</span>';
    const share = r.total_share ? esc(r.total_share)+"%" : '<span class="muted">—</span>';
    h += `<tr data-parcel="${r.parcel_id}">
      <td><b>قطعة ${esc(r.parcel_no)}</b></td>
      <td class="ltr muted">${esc(r.parcel_code||"—")}</td>
      <td>${owners}</td><td>${share}</td>
      <td class="row-go">›</td></tr>`;
  });
  return h+"</tbody></table>";
}

function archEmpty(title,hint){
  return `<div class="empty-state"><b>${esc(title)}</b>
    <div class="muted" style="font-size:12px;margin-top:4px">${esc(hint)}</div></div>`;
}

function wireArchRows(){
  document.querySelectorAll("#archBody tr[data-client]").forEach(tr=>{
    tr.onclick=()=>{ if(typeof openClientRecord==="function") openClientRecord(tr.dataset.client);
                     else toast("سجل العميل جاي في التحديث الجاي","ok"); };
  });
  document.querySelectorAll("#archBody tr[data-parcel]").forEach(tr=>{
    tr.onclick=()=>{ if(typeof openParcel==="function") openParcel(tr.dataset.parcel);
                     else toast("سجل الأرض جاي في التحديث الجاي","ok"); };
  });
}

/* بحث داخل الأرشيف */
async function archSearch(q){
  const body=$("archBody"); if(!body) return;
  if(!q){ return archLoad(); }
  body.innerHTML = '<div class="muted" style="padding:16px;text-align:center">بيدوّر…</div>';
  try{
    const res = await gsearch(q);
    body.innerHTML = gsearchHTML(res, q);
    wireGsearchRows();
  }catch(e){
    body.innerHTML = `<div class="empty-state"><b>البحث وقف</b>
      <div class="muted" style="font-size:12px;margin-top:4px">${esc(e.message||"")}</div></div>`;
  }
}

function relTime(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date(), diff=(d-now)/86400000;
  if(diff<0) return "(فات)";
  if(diff<1 && d.getDate()===now.getDate()) return "النهارده "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  if(diff<2) return "بكرة "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
}
function relativeTime(iso){
  if(!iso) return "";
  const sec=(Date.now()-new Date(iso).getTime())/1000;
  if(sec<0) return relTime(iso);
  if(sec<60) return "دلوقتي";
  if(sec<3600) return "من "+Math.max(1,Math.floor(sec/60))+" دقيقة";
  if(sec<86400) return "من "+Math.floor(sec/3600)+" ساعة";
  const d=new Date(iso), y=new Date(Date.now()-86400000);
  if(d.getDate()===y.getDate()&&d.getMonth()===y.getMonth()&&d.getFullYear()===y.getFullYear())
    return "أمس "+d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  return "من "+Math.floor(sec/86400)+" يوم";
}
